<!doctype html>
<!-- Rosa spot card: one surf spot as a collectible card, no map. Face down, it flips to the spot's stats
     (wave, level, months, tide) under a rolling-swell picture, then flips back to this week's forecast
     from Rosa. Read from spec.js (tools/spotfilm/build.py, type: card); every frame is a pure
     function of t: window.__film.seek(t), spine/render.py. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #071225; }
body { font-family: Inter, sans-serif; color: #f5f0e8; position: relative; -webkit-font-smoothing: antialiased; }
#bg { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 40%, #0d2a5c 0, #071225 70%), #071225; }
#rays { position: absolute; left: 540px; top: 760px; width: 0; height: 0; }
#rays i { position: absolute; left: -1200px; top: -14px; width: 2400px; height: 28px; background: linear-gradient(90deg, transparent, rgba(17,183,242,.10) 35%, rgba(17,183,242,.10) 65%, transparent); }
#pt { position: absolute; left: 0; top: 0; mix-blend-mode: screen; pointer-events: none; }
#dim { position: absolute; inset: 0; background: #02060f; opacity: 0; }
.beat { position: absolute; left: 65px; width: 950px; }
.line { overflow: hidden; padding: 0 0 .12em; }
.line > span { display: inline-block; will-change: transform; }
.kick { font-size: 42px; font-weight: 700; color: #11b7f2; letter-spacing: -.005em; line-height: 1.2; }
.title { font-size: 100px; font-weight: 800; letter-spacing: -.04em; line-height: 1.02; margin-top: 8px; }
.title em { font-style: normal; color: #11b7f2; }
.sub { position: absolute; left: 65px; right: 65px; margin: 0 auto; width: fit-content; max-width: 950px; padding: 16px 26px 20px; border-radius: 26px; background: rgba(4,10,28,.66); text-align: center; font-size: 46px; font-weight: 650; line-height: 1.22; letter-spacing: -.01em; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 2200px; }
#card { position: absolute; left: 265px; width: 550px; height: 700px; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border-radius: 34px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
  background: linear-gradient(160deg, #13284f 0, #0a1733 55%, #081127 100%); border: 4px solid transparent;
  box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06) inset; }
.face::before { content: ""; position: absolute; inset: -4px; border-radius: 34px; padding: 4px; background: linear-gradient(135deg, #11b7f2, #032afa 45%, #8df0ff 70%, #11b7f2);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 47%, rgba(140,240,255,.12) 52%, transparent 62%); mix-blend-mode: screen; }
#back { transform: rotateY(180deg); }
.head { display: flex; justify-content: space-between; align-items: center; padding: 26px 28px 0; }
.no { font-size: 30px; font-weight: 800; color: #11b7f2; letter-spacing: .02em; }
.lvl { padding: 5px 18px 7px; border-radius: 99px; font-size: 26px; font-weight: 800; color: #fff; }
.art { position: relative; margin: 16px 28px 0; height: 300px; border-radius: 22px; overflow: hidden; background: linear-gradient(180deg, #0d3a8c 0, #0b2a66 45%, #071a42 100%); }
.art canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.art .sun { position: absolute; left: 50%; top: 58px; width: 120px; height: 120px; margin-left: -60px; border-radius: 50%; background: radial-gradient(circle, #8df0ff 0, #11b7f2 45%, rgba(17,183,242,0) 70%); opacity: .85; }
.name { padding: 16px 28px 0; font-size: 60px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
.place { padding: 4px 28px 0; font-size: 26px; font-weight: 600; color: rgba(245,240,232,.66); }
.stats { padding: 14px 16px 0; }
.st { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 16px; font-size: 26px; }
.st span { color: rgba(245,240,232,.66); font-weight: 650; }
.st b { font-weight: 800; letter-spacing: -.01em; }
.pips { display: flex; gap: 7px; }
.pips i { width: 30px; height: 14px; border-radius: 99px; background: rgba(255,255,255,.14); }
.pips i.on { background: #11b7f2; }
.months { display: flex; gap: 4px; }
.months i { width: 24px; text-align: center; font-style: normal; font-size: 21px; font-weight: 800; border-radius: 6px; padding: 2px 0 3px; color: rgba(245,240,232,.32); }
.months i.on { background: #24b161; color: #fff; }
.cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cover img { width: 210px; height: 210px; }
.cover b { margin-top: 40px; font-size: 52px; font-weight: 800; letter-spacing: .12em; }
.cover span { margin-top: 10px; font-size: 30px; font-weight: 700; color: #11b7f2; letter-spacing: .06em; }
.wk { position: absolute; inset: 0; padding: 30px 28px; display: flex; flex-direction: column; }
.wk .top { display: flex; align-items: center; gap: 18px; }
.wk .top img { width: 64px; height: 64px; }
.wk h4 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.wk h4 small { display: block; font-size: 24px; font-weight: 650; color: rgba(245,240,232,.66); letter-spacing: 0; }
.week { display: flex; justify-content: space-between; align-items: flex-end; height: 300px; margin-top: 28px; }
.day { width: 64px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.day .h { font-size: 26px; font-weight: 750; margin-bottom: 8px; }
.day .bar { width: 46px; border-radius: 14px 14px 8px 8px; transform-origin: 50% 100%; }
.day .n { font-size: 24px; font-weight: 650; margin-top: 10px; color: rgba(245,240,232,.72); }
.day.best .n { color: #fff; font-weight: 800; }
.day.best .bar { box-shadow: 0 0 0 4px #fff, 0 0 34px rgba(36,177,97,.8); }
.best { margin-top: 30px; align-self: center; padding: 10px 30px 13px; border-radius: 99px; font-size: 34px; font-weight: 800; color: #fff; }
.unit { margin-top: 18px; text-align: center; font-size: 22px; font-weight: 600; color: rgba(245,240,232,.55); }
#end { position: absolute; left: 65px; width: 950px; display: flex; flex-direction: column; align-items: center; text-align: center; }
#e1 { font-size: 82px; font-weight: 800; letter-spacing: -.03em; line-height: 1.08; margin-top: 52px; }
#btn { margin-top: 84px; padding: 30px 74px; border-radius: 999px; background: #11b7f2; color: #fff; font-weight: 800; font-size: 50px; letter-spacing: -.01em; }
#e3 { font-size: 48px; font-weight: 600; margin-top: 46px; }
</style></head>
<body>
<div id="bg"></div>
<div id="rays"></div>
<canvas id="pt" width="1080" height="1920"></canvas>
<div id="stage"><div id="card">
  <div class="face" id="front">
    <div class="head"><span class="no" id="no"></span><span class="lvl" id="lvl"></span></div>
    <div class="art" id="art"><div class="sun"></div><canvas id="sea" width="988" height="600"></canvas></div>
    <div class="name" id="nm"></div>
    <div class="place" id="pl"></div>
    <div class="stats" id="stats"></div>
    <div class="shine" id="sh1"></div>
  </div>
  <div class="face" id="back">
    <div class="cover" id="cover"><img src="rosa-icon.svg"><b>SPOT CARD</b><span id="cno"></span></div>
    <div class="wk" id="wk"></div>
    <div class="shine" id="sh2"></div>
  </div>
</div></div>
<div id="hud"></div>
<div id="dim"></div>
<div id="end">
  <img id="logo" src="rosa-icon.svg" style="width:190px; height:190px">
  <div id="e1"></div>
  <div id="btn"></div>
  <div id="e3">link in bio</div>
</div>
<script src="spec.js"></script>
<script>
const S = window.SPEC, C = S.card, B = S.beats;
const variant = new URLSearchParams(location.search).get("variant") === "story" ? "story" : "reel";
const SAFE_TOP = variant === "story" ? 269 : 285, SAFE_BOTTOM = 1248;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const inOut = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outExpo = (k) => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const outBack = (k) => 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2);
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
const el = (tag, cls, html, parent) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; (parent || document.body).appendChild(d); return d; };
const RATING = { FLAT: "#5d6880", POOR: "#92b9e8", FAIR: "#11b7f2", GOOD: "#24b161", FIRING: "#0c6733" };
const LEVEL = ["", "#24b161", "#24b161", "#11b7f2", "#e48022", "#d0574a"];
const MONTHS = "JFMAMJJASOND";

// ── the card's faces, filled from the spec ──
$("no").textContent = $("cno").textContent = "#" + String(C.number).padStart(2, "0");
$("lvl").textContent = C.level.label; $("lvl").style.background = LEVEL[C.level.n];
$("nm").textContent = C.name; $("pl").textContent = C.place;
// the art: layered swell lines rolling in, Rosa's blues (no map on a card)
function sea(t) {
  const cv = $("sea"), c = cv.getContext("2d"), W = cv.width, H = cv.height;
  c.clearRect(0, 0, W, H);
  const seed = hash(C.name);
  for (let j = 0; j < 7; j++) {
    const y0 = H * (.42 + j * .085), amp = 10 + j * 5, len = 260 + j * 60, sp = .5 + j * .18, ph = seed * 6.28 + j;
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) c.lineTo(x, y0 + Math.sin(x / len * 6.283 + t * sp + ph) * amp + Math.sin(x / (len * .37) - t * sp * .7) * amp * .25);
    c.lineTo(W, H); c.closePath();
    const a = .18 + j * .1; c.fillStyle = `rgba(${j % 2 ? "17,183,242" : "3,42,250"},${a})`; c.fill();
    c.strokeStyle = `rgba(200,245,255,${.25 + j * .06})`; c.lineWidth = 2.5; c.stroke();
  }
}
const ROWS = {
  wave: ["Wave", `<b>${C.wave}</b>`],
  level: ["Level", `<div class="pips">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= C.level.n ? "on" : ""}"></i>`).join("")}</div>`],
  months: ["Season", `<div class="months">${[...MONTHS].map((m, i) => `<i class="${C.months.includes(i + 1) ? "on" : ""}">${m}</i>`).join("")}</div>`],
  tide: ["Tide", `<b>${C.tide}</b>`],
};
const rows = Object.fromEntries(Object.entries(ROWS).filter(([k]) => k !== "tide" || C.tide).map(([k, [a, b]]) => [k, el("div", "st", `<span>${a}</span>${b}`, $("stats"))]));
const W = S.week;
$("wk").innerHTML = `<div class="top"><img src="rosa-icon.svg"><h4>This week<small>${W.when}</small></h4></div>` +
  `<div class="week">${W.days.map((d) => `<div class="day${d.best ? " best" : ""}"><div class="h">${d.h}</div><div class="bar" style="height:${Math.max(16, 190 * d.h / Math.max(...W.days.map((x) => +x.h)))}px; background:${RATING[d.bucket]}"></div><div class="n">${d.name}</div></div>`).join("")}</div>` +
  `<div class="best" style="background:${RATING[W.best.bucket]}">Best: ${W.best.day}, ${W.best.word}</div><div class="unit">Wave height, ${W.unit} · Rosa forecast</div>`;

// ── words: kicker + title on top, the voice-over line near the bottom ──
const huds = B.map((b) => {
  const top = el("div", "beat", (b.kicker ? `<div class="line"><span class="kick">${b.kicker}</span></div>` : "") +
    (b.title || []).map((l) => `<div class="line"><span class="title">${l}</span></div>`).join(""), $("hud"));
  top.style.top = SAFE_TOP + 6 + "px";
  return { top, sub: b.sub ? el("div", "sub", b.sub, $("hud")) : null, b };
});
function rise(s, t, a, z, d = .7) {
  const i = outExpo(seg(t, a, a + d)), o = 1 - inOut(seg(t, z - .35, z));
  s.style.transform = `translateY(${(1 - i) * 105 + (1 - o) * -110}%)`; s.style.opacity = Math.min(i * 1.4, 1 - seg(t, z - .2, z)); s.style.filter = `blur(${(1 - i) * 10 + (1 - o) * 6}px)`;
}
function words(t) {
  huds.forEach(({ top, sub, b }, i) => {
    const on = t >= b.t0 - .05 && t < b.t1 + .05;
    const same = (x) => x && JSON.stringify([x.kicker, x.title]) === JSON.stringify([b.kicker, b.title]);
    const a = same(B[i - 1]) ? -9 : b.t0 + .12, z = same(B[i + 1]) ? 1e9 : b.t1;
    top.style.visibility = on ? "visible" : "hidden";
    if (on) [...top.querySelectorAll(".line > span")].forEach((s, j) => rise(s, t, a + j * .1, z));
    if (sub) {
      const k = outExpo(seg(t, b.t0 + .3, b.t0 + .8)), o = 1 - seg(t, b.t1 - .25, b.t1);
      sub.style.visibility = on ? "visible" : "hidden"; sub.style.opacity = k * o; sub.style.transform = `translateY(${(1 - k) * 30}px)`;
      sub.style.top = SAFE_BOTTOM - sub.offsetHeight - 4 + "px";
    }
  });
}

// ── the card: where it sits, which face shows, which stat is lit ──
// a beat's `show`: cover (face down), front, week (flipped back over); a title above shrinks it
const POSE = { cover: 180, front: 0, week: 180 };
function pose(b) { return { rot: POSE[b.show || "front"], scale: b.title && b.title.length ? .62 : b.kicker ? 1 : 1.06 }; }   // no kicker: the card takes its room
function card(t) {
  let i = B.findIndex((b) => t < b.t1); if (i < 0) i = B.length - 1;
  const b = B[i], p = pose(b), q = i > 0 ? pose(B[i - 1]) : { rot: 180, scale: .62 };
  const k = inOut(seg(t, b.t0, b.t0 + .8));
  let rot = lerp(q.rot, p.rot, k) + (q.rot === p.rot && b.show !== B[i - 1]?.show ? 360 * k : 0);   // week after cover: a full turn
  if (i === 0) rot = 180 + 360 * (1 - outExpo(seg(t, 0, 1.2)));                                   // it spins in
  const sc = lerp(q.scale, p.scale, k), enter = outBack(seg(t, 0, .9));
  const from = b.kicker ? SAFE_TOP + 62 : SAFE_TOP + 4, h = 700 * sc, room = (SAFE_BOTTOM - 132) - from;   // under the kicker, over the line
  const top = sc < 1 ? 1128 - h - 10 : from + (room - h) / 2;
  const sway = Math.sin(t * 1.3) * 3;
  $("card").style.top = top + (1 - enter) * 700 + "px";
  $("card").style.transform = `scale(${sc}) rotateY(${rot + sway}deg) rotateX(${Math.cos(t * 1.1) * 2}deg)`;
  $("card").style.transformOrigin = "50% 0";
  // the back: the cover until the card has shown its front, then the week
  const seenFront = B.slice(0, i + 1).some((x) => x.show === "front") && (b.show !== "front");
  $("cover").style.opacity = seenFront ? 0 : 1; $("wk").style.opacity = seenFront ? 1 : 0;
  const wa = b.show === "week" ? b.t0 + .5 : 1e9;
  $("wk").querySelectorAll(".bar").forEach((x, j) => { x.style.transform = `scaleY(${outBack(seg(t, wa + j * .09, wa + .6 + j * .09))})`; });
  $("wk").querySelectorAll(".h").forEach((x, j) => { x.style.opacity = seg(t, wa + .5 + j * .09, wa + .8 + j * .09); });
  $("wk").querySelector(".best").style.opacity = seg(t, wa + 1.1, wa + 1.5);
  for (const [key, r] of Object.entries(rows)) {
    const lit = b.focus === key ? outExpo(seg(t, b.t0 + .5, b.t0 + 1)) * (1 - seg(t, b.t1 - .2, b.t1)) : 0;
    r.style.background = `rgba(17,183,242,${.2 * lit})`; r.style.transform = `scale(${1 + .04 * lit})`;
    r.style.boxShadow = lit ? `0 0 0 2px rgba(17,183,242,${.7 * lit})` : "none";
  }
  sea(t);
  const sh = ((t * .35) % 1.4) - .2; for (const s of [$("sh1"), $("sh2")]) s.style.transform = `translateX(${lerp(-110, 110, sh)}%)`;
  $("rays").innerHTML = ""; for (let j = 0; j < 6; j++) { const r = el("i", null, null, $("rays")); r.style.transform = `rotate(${j * 30 + t * 6}deg)`; }
  $("rays").style.top = top + h / 2 + "px";
}

// ── Rosa particles: the app's splash field as a pure function of t ──
const BW = 390, BH = 700, N = Math.round(BW * BH / 11000 * 1.2), PAL = ["125, 185, 240", "94, 205, 205"];
const SLOTS = Array.from({ length: N }, (_, i) => ({ life: 5 * (0.8 + hash("l" + i) * 0.4), off: hash("o" + i) * 5 }));
function particles(cv, t, o, gain) {
  const c = cv.getContext("2d"); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); cv.style.opacity = o;
  if (o <= 0) return;
  const CSS = cv.width / BW; c.setTransform(CSS, 0, 0, CSS, 0, 0);
  const ps = [];
  SLOTS.forEach(({ life, off }, i) => {
    const k = Math.floor((t + off) / life), age = t + off - k * life, f = age * 60, r = (s) => hash(s + i + "-" + k);
    const depth = Math.pow(r("d"), 0.85), rad = 0.5 + depth * 2.7, blur = (1 - depth) * 4.5;
    const vy = -(0.24 + depth * 1.4), vx = (r("v") - 0.5) * (0.05 + depth * 0.28);
    const ph = r("p") * 6.283, ws = 0.004 + r("w") * 0.012, wa = 0.05 + depth * 0.4;
    const x = r("x") * BW + vx * f + (wa / ws) * (Math.cos(ph) - Math.cos(ph + ws * f)), y = BH + r("y") * 30 + vy * f;
    const lf = age / life, env = lf < .15 ? lf / .15 : lf > .7 ? (1 - lf) / .3 : 1;
    const a = clamp((0.22 + depth * 0.7) * 0.3 * gain * Math.min(1, (BH - y) / 80) * Math.min(1, y / (BH * .55)) * env);
    if (a > 0.002 && y > -10) ps.push({ x, y, rad, depth, bucket: Math.round(blur), a, col: PAL[Math.floor(r("c") * PAL.length)] });
  });
  ps.sort((p, q) => p.depth - q.depth);
  for (const p of ps) { c.filter = p.bucket ? `blur(${p.bucket / 2 * CSS}px)` : "none"; c.globalAlpha = p.a; c.fillStyle = `rgb(${p.col})`; c.beginPath(); c.arc(p.x, p.y, p.rad, 0, 6.283); c.fill(); }
  c.filter = "none"; c.globalAlpha = 1;
}

// ── closing card: logo, two lines, the glowing button, "link in bio" ──
$("e1").innerHTML = S.end.line; $("btn").textContent = S.end.button;
function closing(t) {
  const E = S.end.t, k = seg(t, E - .5, E + .4);
  $("dim").style.opacity = .8 * k; $("stage").style.filter = k ? `blur(${k * 14}px)` : "none";
  $("hud").style.opacity = 1 - seg(t, E - .5, E - .1);
  particles($("pt"), t, 1, lerp(1, 2.4, seg(t, E - .2, E + .8)));
  $("end").style.top = SAFE_TOP + 120 + "px"; $("end").style.visibility = t < E ? "hidden" : "visible";
  const lg = seg(t, E, E + .8);
  $("logo").style.transform = `scale(${lerp(.4, 1, outBack(lg))}) rotate(${(1 - outExpo(lg)) * -20}deg)`; $("logo").style.opacity = clamp(lg * 3);
  const pop = (e, a) => { const q = outExpo(seg(t, a, a + .8)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * 60}px)`; e.style.filter = `blur(${(1 - q) * 8}px)`; };
  pop($("e1"), E + .2); pop($("btn"), E + .5); pop($("e3"), E + .85);
  const glow = 30 + 10 * Math.sin(t * 2.6);
  $("btn").style.boxShadow = `0 0 ${glow}px rgba(17,183,242,.65), 0 0 ${glow * 2.4}px rgba(17,183,242,.28)`;
}

const ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
async function seek(t) {
  await ready;
  card(t); words(t); closing(t);
}
window.__film = { seek, duration: S.dur };
</script>
</body></html>
