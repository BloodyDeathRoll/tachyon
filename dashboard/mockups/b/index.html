<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tachyon — Planner</title>
<meta name="description" content="Tachyon operator dashboard, direction B “Planner”: the week is the spine; every reel is a chip on a 7-day board and opens into a side panel. Reads dashboard/data.json.">
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url("../../fonts/manrope-latin-wght-normal.woff2") format("woff2")}
:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;
  /* direction B accent: deep ocean blue. Fill only on white; accent text only on t5. */
  --acc:#0F4C81;--acc-h:#0C3F6B;--t1:#4B79A0;--t2:#87A6C0;--t3:#B7C9D9;--t4:#DBE4EC;--t5:#EEF2F6;
  --blue:#1F4BFF;
  --green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;--red-bg:#FCEBED;--amber:#8A4B00;--amber-bg:#FFF4D6;--gbg:#EEF0F3;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.06);
  --r:20px;--r2:12px;--gap:24px;--pad:28px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;background:var(--ground);display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;font-size:15px;line-height:1.45;font-weight:400}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;overflow:visible}
img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:3000}
.skip:focus{top:8px}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap;border-radius:4px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:12px;height:12px}
.muted{color:var(--ink3)}
.ink2{color:var(--ink2)}
.small{font-size:13px}
b{font-weight:700}

/* ---------- sidebar (Oneshot, verbatim except the accent) ---------- */
.side{position:sticky;top:0;height:100vh;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:28px 20px 24px;z-index:2}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 28px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--acc);display:inline-block;position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px;border:0;background:transparent;border-radius:var(--r2);font-weight:500;font-size:15px;color:var(--ink2);cursor:pointer;text-decoration:none}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav a svg{width:22px;height:22px;flex:none}
.nav .badge{margin-left:auto;background:var(--acc);color:#fff;font-size:13px;font-weight:700;min-width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.nav .n{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600}
.nav .n.z{color:var(--ink3);font-weight:500}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--rule);font-size:13px;color:var(--ink3);display:grid;gap:4px}
.side-foot b{color:var(--ink2);font-weight:700}

/* ---------- main ---------- */
main{min-width:0;padding:0 24px 48px}
.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;background:var(--ground);z-index:900;padding:12px 0}
.top .tl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.top .sub{font-size:15px;color:var(--ink3);font-weight:500}
.controls{display:flex;gap:12px;align-items:center;flex:none}
.psel{position:relative;display:inline-flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);height:40px;padding:0 14px;gap:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.psel svg.ic{width:16px;height:16px;flex:none}
.psel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 22px 0 0;height:40px;font-weight:600;color:var(--ink);cursor:pointer;max-width:260px}
.psel .chev{position:absolute;right:14px;width:12px;height:12px;pointer-events:none}
.psel:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.psel select:focus{outline:none}
.fresh{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);font-weight:500;white-space:nowrap}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.view{display:none}.view.on{display:block}
.wnav{display:inline-flex;align-items:center;gap:6px}
.ibtn{width:36px;height:36px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.ibtn:hover{background:var(--ground)}
.ibtn svg{width:16px;height:16px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--pad)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.card-h h2{font-size:18px;font-weight:700;letter-spacing:-.005em;display:flex;align-items:center;gap:10px}
.card-h .meta{font-size:13px;color:var(--ink3);font-weight:500}
.cnt{min-width:24px;height:24px;padding:0 8px;border-radius:6px;background:var(--t5);color:var(--acc);font-weight:700;font-size:13px;display:inline-grid;place-items:center}
.cnt.z{background:var(--gbg);color:var(--ink2)}
.label{font-size:13px;font-weight:700;color:var(--ink2)}
.soft{background:var(--ground);border-radius:var(--r2);padding:14px 16px}

/* ---------- pills & buttons (one action grammar) ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1}
.pill.live{background:var(--green-bg);color:var(--green)}
.pill.wait{background:var(--acc);color:#fff}
.pill.sched,.pill.done{background:var(--gbg);color:var(--ink2)}
.pill.fail{background:var(--red-bg);color:var(--red)}
.pill.prod{background:transparent;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.sample{background:var(--amber-bg);color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:15px;font-weight:700;border-radius:999px;height:36px;padding:0 16px;line-height:1;cursor:pointer;border:1.5px solid transparent;white-space:nowrap;text-decoration:none;background:transparent;color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
.btn.p{background:var(--acc);color:#fff;height:44px;padding:0 24px;min-width:160px;border-radius:12px}
.btn.p:hover{background:var(--acc-h)}
.btn.s{background:var(--card);border-color:var(--rule)}
.btn.s:hover{background:var(--ground)}
.btn.d{background:var(--red-bg);color:var(--red);height:44px;padding:0 20px;border-radius:12px}
.btn.d:hover{background:#F8DDE0}
.btn.dd{background:var(--red);color:#fff;height:48px;padding:0 28px;border-radius:12px}
.btn.dd:hover{background:#A51425}
.btn.ghost{color:var(--ink2);font-weight:600}
.btn.ghost:hover{background:var(--ground);color:var(--ink)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ok{color:var(--green);border-color:#BFE3CA}

/* ---------- band (Sypher stat strip) ---------- */
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin-bottom:var(--gap)}
.band .m{padding:20px 28px;min-width:0;display:flex;flex-direction:column;gap:6px}
.band .m+.m{border-left:1px solid var(--rule)}
.band .lab{font-size:14px;font-weight:600;color:var(--ink2)}
.band .fig{font-size:40px;line-height:44px;font-weight:600;letter-spacing:-.02em;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.band .fig.word{font-size:18px;line-height:44px;font-weight:700;display:flex;align-items:center;gap:10px}
.band .fig.word i{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.band .fig.word.off i{background:var(--red)}
.band .fig.z{color:var(--ink3)}
.band .fig small{font-size:15px;font-weight:600;color:var(--ink3);letter-spacing:0}
.band .ctx{font-size:14px;color:var(--ink3);line-height:20px;text-wrap:pretty}
.band .ctx b{color:var(--ink);font-weight:600}
.band .m.wait .fig{color:var(--acc)}

/* ---------- board (the week) ---------- */
.board{padding:20px 24px 24px;overflow:hidden;margin-bottom:var(--gap)}
.bgrid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));column-gap:6px}
.bgrid>*{min-width:0}
.bh{padding:8px 10px 12px;font-size:15px;font-weight:700;color:var(--ink);line-height:20px}
.bh .d{display:block;font-size:13px;color:var(--ink3);font-weight:500}
.bh.today{border-radius:12px 12px 0 0}
.bh.today .d{color:var(--acc);font-weight:600}
.rl{font-size:13px;font-weight:600;color:var(--ink3);padding:10px 0 0;line-height:16px}
.cell{padding:6px;min-height:222px;display:flex;align-items:stretch}
.cell.today{background:var(--t4)}
.cell.today.last{border-radius:0 0 12px 12px}
.bh.today{background:var(--t4)}
.cell .empty{width:100%;min-height:100%;border:1.5px dashed var(--rule);border-radius:var(--r2)}
.cell.today .empty{border-color:var(--t2)}
.chip{appearance:none;border:0;padding:0;margin:0;width:100%;text-align:left;background:var(--card);border-radius:var(--r2);box-shadow:0 0 0 1px var(--rule);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;color:var(--ink)}
.chip:hover{box-shadow:0 0 0 1px var(--rule),var(--shadow)}
.chip.next{box-shadow:0 0 0 2px var(--t3)}
.chip.next:hover{box-shadow:0 0 0 2px var(--t3),var(--shadow)}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.chip .cov{width:100%;height:108px;background:#0B1220;position:relative;overflow:hidden}
.chip .cov img{width:100%;height:100%;object-fit:cover;object-position:center 12%}
.chip .cov .len{position:absolute;right:8px;bottom:8px;background:rgba(11,18,32,.72);color:#fff;font-size:12px;font-weight:700;padding:3px 6px;border-radius:6px}
.chip .cb{padding:10px 12px 12px;display:grid;gap:5px}
.chip .t{font-size:15px;font-weight:700;line-height:20px}
.chip .s{font-size:13px;color:var(--ink3);line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .s b{color:var(--ink2);font-weight:600}
.noplan{grid-column:1/-1;padding:40px 16px;text-align:center;color:var(--ink3);font-size:15px}
.noplan b{color:var(--ink2)}

/* ---------- under the board ---------- */
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:start}
.lr{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start}
.lr .cov{width:48px;height:85px;border-radius:8px;overflow:hidden;background:#0B1220}
.lr .cov img{width:100%;height:100%;object-fit:cover}
.lr .t{font-size:16px;font-weight:700;line-height:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lr .s{font-size:14px;color:var(--ink3);margin-top:2px}
.ml{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;margin-top:14px}
.ml div{display:grid;gap:2px}
.ml dt{font-size:13px;color:var(--ink3)}
.ml dd{font-size:18px;font-weight:600;color:var(--ink3)}
.ml dd.v{color:var(--ink)}
.plain{display:grid;gap:12px;font-size:15px;line-height:22px;color:var(--ink2);text-wrap:pretty}
.plain b{color:var(--ink);font-weight:700}
.kv{display:grid;gap:10px}
.kv div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;font-size:15px;line-height:22px;color:var(--ink2)}
.kv div b{color:var(--ink);font-weight:600;text-align:right}
.kv div .z{color:var(--ink3);font-weight:500}

/* ---------- charts ---------- */
.chart{position:relative;margin-top:8px}
.chart svg{width:100%;height:auto}
.chart text{font-family:inherit;font-size:12px;fill:var(--ink3)}
.chart .ax{stroke:var(--rule)}
.chart .pt circle{fill:var(--acc)}
.chart .pt{cursor:default;outline:none}
.chart .pt .tip{opacity:0;transition:opacity .15s}
.chart .pt:hover .tip,.chart .pt:focus .tip{opacity:1}
.chart .pt:focus-visible circle{stroke:var(--acc);stroke-width:2;fill:#fff}
.chart .tip rect{fill:var(--ink)}
.chart .tip text{fill:#fff;font-weight:600}
.chart .note{fill:var(--ink3);font-size:13px}
.chart .ruler text{font-size:12px}

/* ---------- approve ---------- */
.keys{font-size:13px;color:var(--ink3);font-weight:500;display:inline-flex;gap:8px;align-items:center}
.keys kbd{font:inherit;font-weight:700;color:var(--ink2);background:var(--card);border-radius:6px;padding:2px 7px;box-shadow:inset 0 0 0 1px var(--rule)}
.ap{display:grid;grid-template-columns:288px minmax(0,1fr);gap:var(--gap);align-items:start}
.aplist{padding:20px 20px 16px}
.aplist h2{font-size:15px;font-weight:700;color:var(--ink2);padding:0 8px 10px;display:flex;align-items:center;gap:8px}
.aplist h2 .cnt{font-size:13px}
.aplist .none{padding:4px 8px 16px;color:var(--ink3);font-size:15px;line-height:22px}
.aprow{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:10px 8px;border-radius:var(--r2);cursor:pointer;align-items:center;color:var(--ink)}
.aprow:hover{background:var(--ground)}
.aprow[aria-selected="true"]{background:var(--t5)}
.aprow .cov{width:48px;height:85px;border-radius:8px;overflow:hidden;background:#0B1220}
.aprow .cov img{width:100%;height:100%;object-fit:cover}
.aprow .t{font-size:15px;font-weight:700;line-height:20px}
.aprow .s{font-size:13px;color:var(--ink3);line-height:18px;margin-top:2px}
.aprow .s b{color:var(--ink2);font-weight:600}
.aprow .pill{margin-top:6px}
.apcard{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start;position:relative;padding:24px}
.apcard.focus{outline:2px solid var(--acc);outline-offset:4px}
.vid{width:360px;display:grid;gap:10px}
.vid video,.vid .noimg{width:360px;height:640px;border-radius:var(--r2);background:#0B1220;object-fit:cover}
.vid .noimg{display:grid;place-items:center;color:#fff;font-size:13px;text-align:center;padding:16px}
.vid .vm{font-size:13px;color:var(--ink3);text-align:center}
.apr{display:grid;gap:22px;min-width:0}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trow h2{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:28px}
.trow .when{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink2);font-weight:600}
.trow .when button{appearance:none;border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink2);padding:0}
.trow .when button:hover{background:var(--ground);color:var(--ink)}
.trow .when button svg{width:14px;height:14px}
.meta2{font-size:15px;color:var(--ink2);line-height:22px}
.meta3{font-size:13px;color:var(--ink3);line-height:18px}
.life{margin-top:2px}
.life svg{width:100%;height:auto;max-width:520px}
.life text{font-family:inherit;font-size:12px;fill:var(--ink3)}
.life text.on{fill:var(--ink2);font-weight:600}
.life .ln{stroke:var(--rule);stroke-width:2}
.life .ln.on{stroke:var(--acc)}
.life .nd{fill:#fff;stroke:var(--rule);stroke-width:2}
.life .nd.on{fill:var(--acc);stroke:var(--acc)}
.life .nd.cur{fill:#fff;stroke:var(--acc);stroke-width:3}
.sec h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec h3 .pill{height:22px}
/* caption editor with the Instagram cut */
.cap{position:relative}
.cap .mirror,.cap textarea{font:inherit;font-size:16px;line-height:1.6;padding:14px 76px 14px 16px;width:100%;border-radius:var(--r2);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin:0;display:block}
.cap .mirror{position:absolute;inset:0;color:transparent;pointer-events:none;visibility:hidden;border:1.5px solid transparent;overflow:hidden}
.cap textarea{border:1.5px solid var(--rule);background:var(--card);color:var(--ink);resize:none;min-height:calc(8 * 1.6 * 16px + 28px);overflow:hidden}
.cap textarea:focus{outline:2px solid var(--acc);outline-offset:2px;border-color:var(--rule)}
.cap textarea[readonly]{background:var(--ground);border-color:transparent}
.cap .cut{position:absolute;left:0;right:0;height:0;pointer-events:none}
.cap .cut .ln{position:absolute;right:62px;height:0;border-top:1.5px solid var(--t1)}
.cap .cut .tk{position:absolute;width:0;border-left:1.5px solid var(--t1)}
.cap .cut .lb{position:absolute;right:12px;transform:translateY(-50%);font-size:13px;color:var(--ink2);font-weight:700;line-height:18px}
.capf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.capf .c{font-size:13px;color:var(--ink3)}
.verd{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:12px;font-size:15px}
.verd span{display:inline-flex;align-items:center;gap:8px}
.verd i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ink3)}
.verd .g i{background:var(--green)}.verd .a i{background:#C77700}.verd .r i{background:var(--red)}
.verd .n{color:var(--ink3)}
.fc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.fc p{font-size:15px;line-height:22px;overflow-wrap:anywhere}
.qa{display:grid;gap:8px}
.qa li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;font-size:15px;line-height:22px;color:var(--ink2)}
.qa li i{width:20px;height:22px;display:inline-grid;place-items:center}
.qa li i svg{width:16px;height:16px}
.qa li.pass i{color:var(--green)}
.qa li.warn i{color:#C77700}
.qa li.note i{color:var(--ink3)}
.qa li.spec{color:var(--ink);font-weight:600}
.ovr{display:grid;gap:8px}
.ovr li{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:15px;line-height:22px}
.ovr li b{font-weight:700}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.acts .sp{flex:1}
.ro{color:var(--ink3);font-size:13px}
.samplebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-bg);color:var(--amber);border-radius:var(--r2);padding:12px 16px;font-size:15px;font-weight:600;margin-bottom:var(--gap)}
.samplebar .btn{height:32px;font-size:13px;background:#fff;color:var(--amber);border-color:#EACB8A}
.ap2{display:grid;gap:var(--gap)}
.readcard{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px 24px}
.readcard .cov{width:48px;height:85px;border-radius:8px;overflow:hidden;background:#0B1220}
.readcard .cov img{width:100%;height:100%;object-fit:cover}
.readcard .t{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.readcard .s{font-size:14px;color:var(--ink3);margin-top:4px}
.readcard .a{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- window table (Ancestry rows) ---------- */

  const map = {
    IDEA: ['In production: idea', '', 'prod'], BRIEFED: ['In production: briefed', '', 'prod'],
    SCRIPTED: ['In production: scripted', p.qa_rounds > 0 ? `Revision ${p.qa_rounds} of 2` : '', 'prod'],
    RENDERED: ['In production: rendered', '', 'prod'], QA: ['In QA', '', 'prod'],
    NEEDS_APPROVAL: ['Waiting for you', `Waiting since ${fmtDay(dt(p.updated_at))} ${fmtTime(dt(p.updated_at))} UTC`, 'wait'],
    APPROVED: ['Approved', 'Queues within 10 min', 'sched'],
    QUEUED: ['Scheduled', `${fmtDT(p.scheduled_at)} · ${rel(p.scheduled_at)}`, 'sched'],
    PUBLISHING: ['Publishing now', `Started ${fmtTime(dt(p.scheduled_at))}`, 'sched'],
    PUBLISHED: ['Live', n ? `First numbers ${n}` : '', 'live'],
    MEASURING: ['Live, measuring', n ? `24 h numbers ${rel(p.metrics.next_window_at)}` : '', 'live'],
    ANALYZED: ['Measured', '', 'done'],
    REJECTED: ['Sent back with your note', p.note || '', 'done'],
    FAILED: ['Publish failed, retrying', p.note || '', 'fail'],
    NEEDS_INPUT: ['QA stuck after 2 rounds, needs your call', '', 'wait'],
    MANUAL_HANDOFF: ['Post it by hand, then paste the id', '', 'fail']
  };
  const [words, second, role] = map[s] || [s, '', 'prod'];
  return { words, second, role };
};
const pill = p => { const s = stateInfo(p); return h('span', { class: `pill ${s.role}` }, s.words); };
const warnsOf = p => (p.qa && p.qa.warns ? p.qa.warns.length : 0);
const captionChecks = p => { // humanizer + lint live only inside a QA line today (data gap, concepts §6.4)
  const line = (p.qa?.lines || []).find(l => /ig-human/i.test(l)) || '';
  const hm = line.match(/ig-human\s+(\d+(?:\.\d+)?)/i), lm = line.match(/caption lint\s+([A-Z]+)/i);
  return { human: hm ? Number(hm[1]) : null, lint: lm ? lm[1].toLowerCase() : null };
};
const firstLine = c => (c || '').split('\n')[0];

/* ---------- mockup state (reverts on reload) ---------- */

const extLink = (href, text) => h('a', { class: 'lnk', href, target: '_blank', rel: 'noopener' }, text, h('span', { html: I.ext, 'aria-hidden': 'true' }));
const copyBtn = (text, label = 'Copy') => {

const metricList = (p, keys) => {

const METRICS = [['Views'], ['Reach'], ['Sends / reach'], ['Saves / reach'], ['Follows / reach'], ['Hold']];

/* lifecycle nodes (23andMe): filled = reached, ring = where it is now */
const lifecycle = p => {
  const steps = ['Scripted', 'QA', 'Approved', 'Queued', 'Published', 'Measured'];
  const idx = { IDEA: -1, BRIEFED: -1, SCRIPTED: 0, RENDERED: 0, QA: 1, NEEDS_APPROVAL: 1, NEEDS_INPUT: 1, APPROVED: 2, QUEUED: 3, PUBLISHING: 3, PUBLISHED: 4, MEASURING: 4, ANALYZED: 5, REJECTED: 0, FAILED: 3, MANUAL_HANDOFF: 3 }[p.state] ?? -1;
  const w = 520, step = (w - 40) / (steps.length - 1), y = 12;
  let s = `<svg viewBox="0 0 ${w} 44" role="img" aria-label="Where this reel is: ${steps.filter((_, i) => i <= idx).join(', ')} done">`;
  steps.forEach((name, i) => {
    const x = 20 + i * step;
    if (i < steps.length - 1) s += `<line class="ln ${i < idx ? 'on' : ''}" x1="${x + 8}" y1="${y}" x2="${x + step - 8}" y2="${y}"/>`;
    s += `<circle class="nd ${i < idx ? 'on' : ''} ${i === idx ? 'cur' : ''}" cx="${x}" cy="${y}" r="6"/>`;
    s += `<text class="${i <= idx ? 'on' : ''}" x="${x}" y="${y + 26}" text-anchor="middle">${name}</text>`;
  });
  return h('div', { class: 'life', html: s + '</svg>' });
};

/* caption editor with the "… more" rule after character 125 */
const CUT = 125;
const captionEditor = (p, editable) => {
  const wrap = h('div', { class: 'cap' });
  const mirror = h('div', { class: 'mirror', 'aria-hidden': 'true' });
  const ta = h('textarea', { 'aria-label': `Caption for ${title(p)}`, spellcheck: 'false' }, p._caption ?? p.caption);
  if (!editable) ta.setAttribute('readonly', '');
  const cut = h('div', { class: 'cut', 'aria-hidden': 'true' }, h('i', { class: 'tk' }), h('i', { class: 'ln' }), h('span', { class: 'lb' }, '… more'));
  wrap.append(mirror, ta, cut);
  const foot = h('div', { class: 'capf' });
  const count = h('span', { class: 'c' });
  const verd = h('div', { class: 'verd' });
  const head = h('h3', { style: 'justify-content:space-between' }, h('span', {}, 'Caption'));
  const out = h('div', { class: 'sec' }, head, wrap, foot, verd);
  foot.append(count);
  if (editable) {
    const save = h('button', { class: 'btn s sm', type: 'button' }, 'Save caption');
    save.addEventListener('click', () => { p._caption = ta.value; const real = S.posts.find(x => x.slot_id === p.slot_id); if (real) real._caption = ta.value; save.innerHTML = `${I.check}Saved`; save.classList.add('ok'); live('Caption saved in the mockup'); setTimeout(() => { save.textContent = 'Save caption'; save.classList.remove('ok'); }, 1600); });
    head.append(save);
  } else head.append(h('span', { class: 'small muted', style: 'font-weight:500' }, 'read-only once live'));
  const layout = () => {
    const v = ta.value;
    ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
    mirror.innerHTML = `<span>${esc(v.slice(0, CUT))}</span><span class="m">&#8203;</span>${esc(v.slice(CUT))}${v.endsWith('\n') ? ' ' : ''}`;
    mirror.style.height = ta.style.height;
    const m = mirror.querySelector('.m');
    const lh = 16 * 1.6;
    const r = m.getBoundingClientRect(), mr = mirror.getBoundingClientRect();
    const lineTop = (r.top - mr.top) - (lh - r.height) / 2, left = r.left - mr.left;
    const top = Math.round(lineTop + lh) - 1;
    cut.style.top = top + 'px';
    cut.querySelector('.ln').style.left = left + 'px';
    const tk = cut.querySelector('.tk'); tk.style.left = left + 'px'; tk.style.top = -lh + 3 + 'px'; tk.style.height = lh - 3 + 'px';
    const n = v.replace(/\n$/, '').length;
    count.textContent = `${n} characters · Instagram shows the first ${CUT} before “… more”`;
    const fl = firstLine(v); verd.innerHTML = '';
    if (fl.length <= CUT) verd.append(h('span', { class: 'g' }, h('i'), `Hook survives the cut · ${fl.length} characters`));
    else { const words = v.slice(0, CUT).trim().split(/\s+/).slice(-3).join(' '); verd.append(h('span', { class: 'a' }, h('i'), `Cut mid-sentence after “${words}”`)); }
    const ck = captionChecks(p);
    if (ck.human != null) verd.append(h('span', { class: ck.human >= 70 ? 'g' : ck.human >= 55 ? 'a' : 'r' }, h('i'), `Reads human · ${ck.human}/100`));
    if (ck.lint) verd.append(h('span', { class: ck.lint === 'ready' ? 'g' : 'a' }, h('i'), `Caption lint: ${ck.lint}`));
    if (ck.human == null && !ck.lint) verd.append(h('span', { class: 'n' }, h('i'), 'Reads-human score: not scored'));
  };
  ta.addEventListener('input', layout);
  out._layout = layout;
  requestAnimationFrame(layout);
  if ('ResizeObserver' in window) new ResizeObserver(layout).observe(wrap);
  return out;
};

const qaList = p => {
  const q = p.qa || { lines: [], warns: [] };
  const n = (q.warns || []).length;
  const head = h('h3', {}, `QA · ${q.verdict === 'APPROVED' ? (n ? `approved with ${n} warning${n > 1 ? 's' : ''}` : 'approved, clean') : (q.verdict || '').toLowerCase()}`);
  const ul = h('ul', { class: 'qa' });
  ul.append(h('li', { class: 'spec pass' }, h('i', { html: I.check }), `Spec check: ${q.spec === 'PASS' ? 'passed' : (q.spec || 'not recorded')}`));
  for (const line of q.lines || []) {
    const cls = /\bPASS\b\.?\s*$/.test(line) ? 'pass' : /\b(WARN|STALE)\b/.test(line) ? 'warn' : 'note';
    ul.append(h('li', { class: cls }, h('i', { html: cls === 'pass' ? I.check : cls === 'warn' ? I.warn : I.dot }), line));
  }
  return h('div', { class: 'sec' }, head, ul);
};
const overrides = p => {

    ul.append(h('li', {}, date ? h('b', {}, `${date} · `) : null, text[0].toUpperCase() + text.slice(1)));

};
const firstComment = p => {

const windowTable = p => {

/* the approval card's right column (§1.4 items 2–9), shared by the Approve card and the side panel */
const detailColumn = (p, opts = {}) => {
  const st = stateInfo(p);
  const col = h('div', { class: 'apr' });
  const whenEl = h('span', { class: 'when' }, p.published_at ? `Went out ${fmtDT(p.published_at)}` : `Posts ${fmtDT(p.scheduled_at)}`);
  if (!p.published_at && ['NEEDS_APPROVAL', 'APPROVED', 'QUEUED'].includes(p.state)) whenEl.append(h('button', { type: 'button', 'aria-label': 'Change the time', html: I.pen, onclick: () => openReschedule(p) }));
  const trow = h('div', { class: 'trow' }, h('h2', { id: opts.titleId }, `${title(p)} · ${lenS(p)}`), pill(p), whenEl);
  if (p._sample) trow.append(h('span', { class: 'pill sample' }, 'Sample: shown as if waiting'));
  col.append(trow);
  if (st.second && p.state !== 'QUEUED') col.append(h('div', { class: 'meta2' }, st.second));

  col.append(h('div', { class: 'meta3' }, `Trial: ${p.trial ? 'yes' : 'no'} · Experiment: ${p.experiment_id || 'none'} · Hook: ${p.hook_formula} · ${p.slot_id}`));

const actionsFor = (p, where) => {

  } else if (p.state === 'QUEUED' || p.state === 'APPROVED') {

    acts.append(h('button', { class: 'btn d', type: 'button', onclick: () => openReject(p) }, 'Send back'));
  } else if (p.state === 'NEEDS_INPUT') {
    acts.append(h('button', { class: 'btn d', type: 'button', onclick: () => openReject(p) }, 'Send back with a note'));

  acts.append(h('span', { class: 'sp' }));

  else if (where !== 'panel' && !acts.querySelector('.btn')) acts.append(h('span', { class: 'ro' }, 'Nothing to do until it posts'));

const closePanel = () => {

};
$('#pclose').addEventListener('click', closePanel);
$('#pveil').addEventListener('click', closePanel);
$('#panel').addEventListener('keydown', e => { // focus trap
  if (e.key !== 'Tab') return;
  const f = [...$('#panel').querySelectorAll('button,a[href],textarea,input,select,video,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});

/* ---------- writes (mockup) ---------- */
const setState = (id, state, extra = {}) => { const real = S.posts.find(x => x.slot_id === id); if (!real) return; Object.assign(real, { state, updated_at: NOW.toISOString() }, extra); if (real.slot_id === '2026-w43-02') S.sample = false; };
let undoFn = null;
const approve = p => {

/* ---------- account chart: one honest point ---------- */
const accountChart = () => {
  const rows = C.account_daily || [];
  const w = 312, hgt = 120, pl = 28, pr = 8, pt = 30, pb = 26;
  const days = [...Array(7)].map((_, i) => addDays(THIS.monday, i));

  const vals = rows.map(r => r.followers_count);
  const max = Math.max(1, ...vals);
  const y = v => pt + (hgt - pt - pb) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${w} ${hgt}" role="img" aria-label="Followers per day this week: ${rows.map(r => `${fmtDay(dt(r.date))} ${r.followers_count}`).join(', ') || 'no days yet'}">`;
  s += `<line class="ax" x1="${pl}" y1="${y(0)}" x2="${w - pr}" y2="${y(0)}"/>`;
  s += `<text x="${pl - 6}" y="${y(0) + 4}" text-anchor="end">0</text>`; if (rows.length >= 3) s += `<text x="${pl - 6}" y="${y(max) + 4}" text-anchor="end">${max}</text>`;
  days.forEach((d, i) => { s += `<text x="${x(i)}" y="${hgt - 8}" text-anchor="middle" ${d.getTime() === TODAY.getTime() ? 'font-weight="700" fill="#4B5563"' : ''}>${DAYS[d.getUTCDay()]}</text>`; });
  if (rows.length >= 3) {

  } else {
    s += `<text class="note" x="${w - pr}" y="12" text-anchor="end">Followers · line draws from 3 days (${rows.length} of 3)</text>`;
  }

  });
  return h('div', { class: 'chart', html: s + '</svg>' });

    }
    tr.append(th);
  });
  t.append(h('thead', {}, tr));
  const tb = h('tbody');
  const sc = cols.find(c => c.key === S.sort.key);
  const sorted = [...visiblePosts()].sort((a, b) => { const x = sc.val(a), y = sc.val(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * S.sort.dir; });
  const groups = new Map();
  sorted.forEach(p => { const w = isoWeek(dt(when(p)) || NOW); const k = `${w.year}-${w.week}`; if (!groups.has(k)) groups.set(k, { w, items: [] }); groups.get(k).items.push(p); });
  for (const { w, items } of groups.values()) {
    tb.append(h('tr', { class: 'g' }, h('td', { colspan: cols.length }, `Week ${w.week}`, h('span', {}, `· ${items.length} reel${items.length === 1 ? '' : 's'} · ${fmtDay(w.monday).slice(4)} – ${fmtDay(addDays(w.monday, 6)).slice(4)}`))));
    items.forEach(p => {
      const n = nextNumbers(p);
      const row = h('tr', {}, h('td', { class: 'l' }, cover(p)),
        h('td', { class: 'l' }, h('button', { class: 'nm', type: 'button', onclick: () => openPanel(p.slot_id) }, `${title(p)} · ${lenS(p)}`), h('span', { class: 'sub' }, p.pillar)),
        h('td', { class: 'l', title: stateInfo(p).second }, pill(p)),
        h('td', { class: 'l' }, p.published_at ? `${fmtDay(dt(p.published_at))} ${fmtTime(dt(p.published_at))}` : h('span', { class: 'muted' }, `Posts ${fmtDay(dt(p.scheduled_at))} ${fmtTime(dt(p.scheduled_at))}`)));
      for (let i = 0; i < 7; i++) row.append(h('td', { class: 'dash', title: n ? `First numbers ${n}` : 'Numbers start after it posts' }, '—'));
      row.append(h('td', {}, p.permalink ? extLink(p.permalink, 'Open') : ''));
      tb.append(row);
    });
  }
  t.append(tb);
  const card = h('div', { class: 'card tbl' }, t);
  if (!visiblePosts().length) card.append(h('p', { class: 'no' }, 'No reels yet.'));
  root.append(card, h('p', { class: 'small muted', style: 'margin-top:12px' }, 'Sparklines appear per reel once three measurements exist; today there are none. Metric columns show the latest window.'));
  setTitle(h('h1', { tabindex: '-1' }, 'Posts'), h('span', { class: 'sub' }, `${visiblePosts().length} reels · sort by any column`));
};

V.today = () => {
  const root = $('#view-today'); root.innerHTML = '';
  // the 24-hour ruler, drawn empty (planned comment times appear as ticks)
  const w = innerWidth <= 760 ? 342 : 508, hgt = 72, pl = 20, pr = 20;
  const x = hr => pl + (hr - 6) * ((w - pl - pr) / 16);
  let s = `<svg viewBox="0 0 ${w} ${hgt}" role="img" aria-label="Engagement round on a 06:00 to 22:00 UTC ruler; no comments planned today"><line class="ax" x1="${pl}" y1="44" x2="${w - pr}" y2="44"/>`;
  for (let hr = 6; hr <= 22; hr++) s += `<line class="ax" x1="${x(hr)}" y1="${hr % 4 ? 39 : 34}" x2="${x(hr)}" y2="44"/>${hr % 4 ? '' : `<text x="${x(hr)}" y="64" text-anchor="middle">${p2(hr)}:00</text>`}`;
  [6.5, 18.5].forEach((hr, i) => { s += `<g class="pt" tabindex="0" role="img" aria-label="House slot ${SLOTS[i]} UTC"><rect x="${x(hr) - 2}" y="20" width="4" height="24" rx="2" fill="#87A6C0"/><text x="${x(hr)}" y="14" text-anchor="middle" fill="#4B5563" font-weight="600">${SLOTS[i]} reel</text></g>`; });
  s += '</svg>';
  const eng = h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Engagement round', h('span', { class: 'cnt z' }, `${C.engage.done} of ${C.engage.total}`)), h('span', { class: 'meta' }, '06:00 – 22:00 UTC')),
    h('div', { class: 'chart ruler', html: s }),
    h('p', { class: 'plain', style: 'margin-top:16px' }, h('b', {}, `No engagement round for ${fmtDay(TODAY)}.`), ' Plan writes one each day it runs; the first comes with week 44’s plan on Monday. Each row will be: account · post · planned time · the comment · Copy · tick.'));
  const rep = h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Replies to send', h('span', { class: 'cnt z' }, C.listen.comments_waiting ?? 0))),
    h('p', { class: 'plain' }, h('b', {}, 'No replies drafted.'), ' Comment and DM alerts start once the listener is deployed; Claude drafts replies every morning after that. Each will show the comment, the drafted reply, Copy and “Mark sent”.'));
  root.append(h('div', { class: 'two' }, eng, rep));
  setTitle(h('h1', { tabindex: '-1' }, 'Today'), h('span', { class: 'sub' }, `${fmtDay(TODAY)} · two hand jobs`));
};

V.learn = () => {
  const root = $('#view-learn'); root.innerHTML = '';
  root.append(h('div', { class: 'two' },
    h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Weekly report')), h('p', { class: 'plain' }, h('b', {}, 'No weekly report yet.'), ' Learn runs on Sundays once a full week of numbers exists; the showreel’s 7-day numbers land 31 Oct, so the earliest report is Sun 1 Nov.')),
    h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Experiments', h('span', { class: 'cnt z' }, C.experiments.length))), h('p', { class: 'plain' }, h('b', {}, 'No experiment this week.'), ' Both reels are existing clips; the first pre-registered test comes with week 44’s plan.')),
    h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Targets', h('span', { class: 'cnt z' }, C.kpis.length))), h('div', { class: 'kv' }, ...C.kpis.map(k => h('div', {}, ({ '`app_install` + `push_optin_start`': 'App installs + push opt-ins', '`favorite_add` (lead)': 'Favorites added (lead)' })[k.kpi] || k.kpi.replace(/`/g, ''), h('b', {}, k.target))))),
    h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Strategy changes')), h('p', { class: 'plain' }, h('b', {}, 'Nothing proposed.'), ' Learn proposes changes with the weekly report; each arrives here with Accept and Reject.'))));
  setTitle(h('h1', { tabindex: '-1' }, 'Learn'), h('span', { class: 'sub' }, 'reports, experiments, lessons'));
};

V.settings = () => {
  const root = $('#view-settings'); root.innerHTML = '';
  const sw = (key, label, on) => h('li', {}, h('div', {}, label, h('span', {}, on ? 'Claude replies on its own; every reply is journaled.' : 'Off: Claude drafts, you send.')),
    h('span', { class: 'switch' }, h('button', { type: 'button', role: 'switch', 'aria-checked': on ? 'true' : 'false', 'aria-label': label, onclick: () => on ? (S.grants.auto_reply[key] = false, toast(`${label}: off.`, 'Mockup only: nothing is saved, reload resets.'), render()) : openFlag(key, label.toLowerCase().replace('claude ', '')) }), on ? 'On' : 'Off'));
  const board = h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Switchboard')), h('ul', { class: 'sw' },
    sw('comments', 'Claude replies to comments', S.grants.auto_reply.comments),
    sw('dm', 'Claude replies to DMs', S.grants.auto_reply.dm),
    h('li', {}, h('div', {}, 'Auto-approve pillars', h('span', {}, S.grants.auto_approve_pillars.length ? S.grants.auto_approve_pillars.join(', ') : 'None: every reel waits for you.')))));
  const stop = h('div', { class: 'card stopcard' }, h('div', { class: 'card-h', style: 'margin-bottom:0' }, h('h2', {}, 'Emergency stop')),
    h('p', {}, S.grants.emergency_stop ? 'Publishing is stopped. Nothing goes out until you resume.' : 'Halts the queue for Rosa. Nothing publishes until you resume. Asks before it does anything.'),
    S.grants.emergency_stop ? h('button', { class: 'btn p', type: 'button', onclick: openResume }, 'Resume publishing') : h('button', { class: 'btn dd', type: 'button', onclick: openStop }, 'Stop publishing'));
  const last = C.journal_recent[0];
  const acct = h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Account')), h('div', { class: 'kv' },
    h('div', {}, 'Instagram', h('b', {}, `@${C.handle}`)),
    h('div', {}, 'Instagram account id', h('span', { style: 'display:flex;gap:8px;align-items:center;justify-content:flex-end' }, h('b', {}, C.grants.ig_user_id), copyBtn(C.grants.ig_user_id, 'Copy'))),
    h('div', {}, 'Facebook Page id', h('span', { style: 'display:flex;gap:8px;align-items:center;justify-content:flex-end' }, h('b', {}, C.grants.page_id), copyBtn(C.grants.page_id, 'Copy'))),
    h('div', {}, 'Token expiry', h('b', { class: 'z' }, 'not reported yet')),
    h('div', {}, 'Posting slots', h('b', {}, `${SLOTS.join(' and ')} UTC`)),
    h('div', {}, 'Last journal entry', h('b', {}, last ? fmtDT(last.ts) : '—'))));
  const links = h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', {}, 'Documents')), h('div', { class: 'plain' }, h('p', {}, extLink('../../../docs/PLAN.md', 'Plan')), h('p', {}, extLink('../../../docs/PLAYBOOK.md', 'Playbook')), h('p', {}, extLink('https://rosa.surf', 'rosa.surf'))));
  root.append(h('div', { class: 'two' }, board, stop, acct, links));
  setTitle(h('h1', { tabindex: '-1' }, 'Settings'), h('span', { class: 'sub' }, C.display));
};

/* ---------- shell ---------- */
const VIEWS = [['overview', 'Overview'], ['calendar', 'Calendar'], ['approve', 'Approve'], ['posts', 'Posts'], ['today', 'Today'], ['learn', 'Learn'], ['settings', 'Settings']];
const route = () => (location.hash.replace('#', '') || 'overview');
const navHtml = (cur) => VIEWS.map(([k, lab]) => {
  let tail = '';
  if (k === 'approve') { const n = waiting().length; tail = n ? `<span class="badge">${n}</span>` : `<span class="n z">0</span>`; }
  if (k === 'posts') tail = `<span class="n">${visiblePosts().length}</span>`;
  if (k === 'today') { const n = (C.listen.comments_waiting || 0) + (C.engage.total || 0); tail = `<span class="n ${n ? '' : 'z'}">${n}</span>`; }
  return `<a href="#${k}" ${cur === k ? 'aria-current="page"' : ''}>${I.nav[k]}${lab}${tail}</a>`;
}).join('');
const setTitle = (...els) => { const tl = $('#tl'); tl.innerHTML = ''; tl.append(...els.filter(Boolean)); };
const countUp = root => {
  if (reduced) return;
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count); if (!to) return; const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 600); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
};
const render = () => {
  const r = VIEWS.some(([k]) => k === route()) ? route() : 'overview';
  $('#nav').innerHTML = navHtml(r); $('#mnav').innerHTML = navHtml(r);
  $('#mvn').textContent = `· ${VIEWS.find(([k]) => k === r)[1]}`;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === `view-${r}`));
  V[r]();
  document.title = `Tachyon — ${VIEWS.find(([k]) => k === r)[1]}`;
};
addEventListener('hashchange', () => { closePanel(); if (dlg.open) dlg.close(); $('#navsheet').open && $('#navsheet').close(); render(); $('#tl h1')?.focus(); });
$('#client').append(h('option', {}, C.display)); $('#client').value = C.display;
$('#fresh').append(h('i', { 'aria-hidden': 'true' }), `Data ${fmtDT(D.generated_at)}`);
$('#sidefoot').append(h('div', {}, h('b', {}, C.display), ` · @${C.handle}`), h('div', {}, `${S.posts.length} reels · ${C.journal_recent.length} journal lines`), h('div', {}, `Data ${fmtDate(D.generated_at)} ${fmtTime(NOW)} UTC`));
$('#menubtn').addEventListener('click', () => $('#navsheet').showModal());
$('#navsheet').addEventListener('click', e => { if (e.target === $('#navsheet')) $('#navsheet').close(); });
$('#mnav').addEventListener('click', e => { if (e.target.closest('a')) $('#navsheet').close(); });

/* keyboard: J K move · A approve · R send back · Esc · ? */
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { if ($('#panel').classList.contains('on')) { e.preventDefault(); closePanel(); } return; }
  if (route() !== 'approve') return;
  const ids = [...document.querySelectorAll('.aprow')].map(b => b.dataset.id);
  if (!ids.length) return;
  const i = Math.max(0, ids.indexOf(S.sel));
  if (e.key === 'j' || e.key === 'J') { e.preventDefault(); S.sel = ids[Math.min(ids.length - 1, i + 1)]; V.approve(); $(`.aprow[data-id="${S.sel}"]`)?.focus(); $('.apcard')?.scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' }); }
  else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); S.sel = ids[Math.max(0, i - 1)]; V.approve(); $(`.aprow[data-id="${S.sel}"]`)?.focus(); }
  else if (e.key === 'a' || e.key === 'A') { const p = byId(S.sel); if (p && p.state === 'NEEDS_APPROVAL') { e.preventDefault(); approve(p); } else toast('Only a post that is waiting for you can be approved.'); }
  else if (e.key === 'r' || e.key === 'R') { const p = byId(S.sel); if (p && ['NEEDS_APPROVAL', 'QUEUED', 'APPROVED', 'NEEDS_INPUT'].includes(p.state)) { e.preventDefault(); openReject(p); } }
  else if (e.key === '?') { toast('J K move · A approve · R send back · Esc close'); }
});

// ?view=approve (and ?sample=1) on load, for the shoot tool
const qv = new URLSearchParams(location.search).get('view');
if (qv && VIEWS.some(([k]) => k === qv)) history.replaceState(null, '', `#${qv}`);
render();
const qo = new URLSearchParams(location.search).get('open');
if (qo && byId(qo)) setTimeout(() => openPanel(qo), 50);
})();
</script>
