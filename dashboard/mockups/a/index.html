<!doctype html>
<html lang="en" data-view="overview">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tachyon — Overview</title>
<meta name="description" content="Tachyon operator dashboard, direction A “Inbox” (run dash-01): one queue of what waits on you, the week and the live reel beside it. Reads dashboard/data.json; a static open renders everything.">
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url("../../fonts/manrope-latin-wght-normal.woff2") format("woff2")}
:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;
  /* Direction A accent: teal. White on it 6.05:1, it on white 6.05:1, on the ground 5.64:1, on t5 5.48:1. */
  --acc:#0B6E6E;--acc-hover:#095C5C;--t1:#489292;--t2:#85B6B6;--t3:#B6D4D4;--t4:#DAE9E9;--t5:#EEF5F5;
  --blue:#1F4BFF;
  --green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;--red-bg:#FCEBED;--amber:#8A4B00;--amber-bg:#FFF4D6;--grey-bg:#EEF0F3;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.06);
  --r:20px;--r2:12px;--gap:24px;--pad:28px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;background:var(--ground);display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;font-size:15px;line-height:1.45;font-weight:400}
a{color:inherit}
button,select,textarea,input{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;overflow:visible}
img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap;border-radius:4px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:12px;height:12px;flex:none}
.muted{color:var(--ink3)}
.meta13{font-size:13px;color:var(--ink3);font-weight:500}
b,strong{font-weight:700}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:28px 20px 24px;z-index:2}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 28px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--acc);display:inline-block;position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px;border:0;background:transparent;border-radius:var(--r2);font-weight:500;font-size:15px;color:var(--ink2);cursor:pointer;text-decoration:none}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav a svg{width:22px;height:22px;flex:none}
.nav .badge{margin-left:auto;background:var(--acc);color:#fff;font-size:13px;font-weight:700;min-width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.nav .n{margin-left:auto;font-size:13px;color:var(--ink3);font-weight:600}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--rule);font-size:13px;color:var(--ink3);display:grid;gap:4px}
.side-foot b{color:var(--ink2);font-weight:700}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--green);margin-right:6px;vertical-align:1px}

/* ---------- main ---------- */
main{min-width:0;padding:0 24px 48px}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;background:var(--ground);z-index:5}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1}
.top .keys{font-size:13px;color:var(--ink3);margin-left:16px;font-weight:500}
.top .keys kbd{font:inherit;font-weight:700;color:var(--ink2)}
.controls{display:flex;gap:12px;align-items:center}
.fresh{font-size:13px;color:var(--ink3);font-weight:500;white-space:nowrap}
.fresh i{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--green);margin-right:6px;vertical-align:1px}
.psel{position:relative;display:inline-flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);height:40px;padding:0 14px;gap:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.psel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 22px 0 0;height:40px;font-weight:600;color:var(--ink);cursor:pointer;max-width:200px}
.psel .chev{position:absolute;right:14px;width:12px;height:12px;pointer-events:none}
.psel:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.psel select:focus{outline:none}
.view{display:none}.view.on{display:block}
.sum{margin:0 0 20px;font-size:17px;line-height:26px;color:var(--ink2);text-wrap:pretty;max-width:92ch}
.sum b{color:var(--ink);font-weight:700}

/* ---------- cards / shared ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--pad)}
.card.tight{padding:20px 24px}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 12px;min-height:28px}
.gh h2{font-size:18px;font-weight:700;letter-spacing:-.005em;line-height:28px}
.gh .cnt{min-width:24px;height:24px;padding:0 8px;border-radius:6px;background:var(--t5);color:var(--acc);font-weight:700;font-size:13px;display:inline-grid;place-items:center}
.gh .cnt.z{background:var(--grey-bg);color:var(--ink2)}
.gh .meta{margin-left:auto;font-size:13px;color:var(--ink3);font-weight:500}
.grp+.grp{margin-top:28px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1}
.pill::before{content:"";width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.pill.acc{background:var(--t5);color:var(--acc)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.grey{background:var(--grey-bg);color:var(--ink2)}
.pill.outline{background:transparent;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--rule)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1}
.btn:hover{background:var(--ground)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{height:44px;padding:0 22px;border-color:transparent;background:var(--acc);color:#fff;border-radius:12px;min-width:160px}
.btn.primary:hover{background:var(--acc-hover)}
.btn.danger{height:44px;padding:0 18px;border-color:transparent;background:var(--red-bg);color:var(--red);border-radius:12px}
.btn.danger:hover{background:#F8D9DD}
.btn.danger-fill{height:48px;padding:0 22px;border-color:transparent;background:var(--red);color:#fff;border-radius:12px}
.btn.danger-fill:hover{background:#A6142A}
.btn.ghost{border-color:transparent;color:var(--ink2);background:transparent}
.btn.ghost:hover{background:var(--ground);color:var(--ink)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ok{display:none}
.btn.done .ok{display:inline}
.btn.done .lbl,.btn.done .ic{display:none}
.cover{display:block;border-radius:8px;overflow:hidden;background:var(--t4);position:relative;flex:none}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.c96{width:96px;height:171px}
.cover.c48{width:48px;height:85px;border-radius:6px}
.cover.c32{width:32px;height:57px;border-radius:5px}
.rowline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.soft{background:var(--ground);border-radius:var(--r2);padding:14px 16px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--ink2)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:44px;height:24px;border-radius:999px;background:#CBD2DC;position:relative;flex:none;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(11,18,32,.2);transition:transform .15s}
.switch input:checked+i{background:var(--acc)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.switch .w{min-width:24px;color:var(--ink)}

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--gap);align-items:start}
.ok-card{display:grid;grid-template-columns:40px minmax(0,1fr);gap:20px;align-items:start}
.ok-card .disc{width:40px;height:40px;border-radius:999px;background:var(--green-bg);color:var(--green);display:grid;place-items:center}
.ok-card .disc svg{width:22px;height:22px}
.ok-card .big{font-size:20px;font-weight:700;line-height:28px;letter-spacing:-.005em}
.ok-card .next{margin-top:6px;color:var(--ink2);font-size:15px;line-height:24px}
.ok-card .next b{color:var(--ink)}
.q-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:24px}
.q-card .ttl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.q-card .ttl h3{font-size:18px;font-weight:700;letter-spacing:-.005em;line-height:28px}
.q-card .ttl .len{color:var(--ink3);font-weight:500}
.q-card .when{margin-top:4px;font-size:15px;color:var(--ink)}
.q-card .when b{font-weight:700}
.q-card .when .rel{color:var(--ink3);font-weight:500}
.q-card .desc{margin-top:4px;color:var(--ink2)}
.q-card .qa{margin-top:8px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.q-card .qa svg{width:16px;height:16px;color:var(--amber)}
.q-card .acts{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.q-card .acts .lead{color:var(--ink3);font-weight:600;margin-right:2px}
.q-card .acts .right{margin-left:auto}
.q-card .slot{font-size:13px;color:var(--ink3);margin-top:8px}
.hand{display:grid;gap:10px;color:var(--ink2)}
.hand .r{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start}
.hand .r i{width:20px;height:20px;border-radius:6px;border:1.5px dashed #CBD2DC;margin-top:2px}
.hand b{color:var(--ink);font-weight:700}
.rail{display:grid;gap:var(--gap)}
.rail .card{padding:24px}
.rail h2{font-size:18px;font-weight:700;letter-spacing:-.005em;line-height:28px}
.rail .sub{font-size:13px;color:var(--ink3);font-weight:500;margin-top:2px}
.wk{margin-top:16px;display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:6px 4px;align-items:center;text-align:center}
.wk .d{font-size:13px;font-weight:700;color:var(--ink3);padding:4px 0}
.wk .d.today{color:var(--acc);background:var(--t4);border-radius:8px}
.wk .t{font-size:13px;color:var(--ink2);text-align:left;font-weight:600}
.wk .c{height:40px;display:grid;place-items:center;border-radius:8px;background:transparent}
.wk .c.today{background:var(--t5)}
.wk .c a{display:block;width:18px;height:18px;border-radius:999px;cursor:pointer;border:0;padding:0}
.wk .c a:hover{transform:scale(1.15)}
.wk .c a.live{background:var(--green)}
.wk .c a.sched{background:#fff;box-shadow:inset 0 0 0 2px var(--ink2)}
.wk .c a.acc{background:var(--acc)}
.wk .c a.red{background:var(--red)}
.wk .c a.grey{background:var(--grey-bg)}
.wk .c .none{width:6px;height:6px;border-radius:999px;background:#D5D9E2}
.legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:6px;vertical-align:-1px}
.legend i.live{background:var(--green)}.legend i.sched{box-shadow:inset 0 0 0 2px var(--ink2);background:#fff}
.nextwk{margin-top:12px;color:var(--ink3);font-size:13px}
.live-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;margin-top:16px}
.live-card .ttl{font-size:18px;font-weight:700;line-height:28px}
.live-card .ttl span{color:var(--ink3);font-weight:500;font-size:15px;margin-left:6px}
.live-card .since{color:var(--ink2);margin-top:2px}
.mslots{margin-top:12px;display:grid;gap:0;font-size:14px}
.mslots div{display:flex;justify-content:space-between;gap:8px;color:var(--ink2);border-top:1px solid var(--rule);padding:7px 0}
.mslots div:last-child{border-bottom:1px solid var(--rule)}
.mslots b{color:var(--ink2);font-weight:600}
.mslots span{color:var(--ink3)}
.arrive{margin-top:12px;color:var(--ink2);font-size:14px}
.arrive b{color:var(--ink);font-weight:700}
.health{margin-top:14px;display:grid;gap:10px}
.health .h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:10px}
.health .h:last-child{border-bottom:0;padding-bottom:0}
.health .h span{color:var(--ink2)}
.health .h b{font-weight:700;white-space:nowrap}
.health .h b.ok{color:var(--green)}
.health .h b.na{color:var(--ink3);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:0}
.strip .s{padding:20px 24px;display:grid;gap:2px;align-content:start;min-width:0}
.strip .s+.s{border-left:1px solid var(--rule)}
.strip .s span{font-size:13px;color:var(--ink2);font-weight:600}
.strip .s b{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em}
.strip .s b.ok{color:var(--green)}.strip .s b.bad{color:var(--red)}.strip .s b.na{color:var(--ink3);font-weight:500}
.strip .s small{font-size:13px;color:var(--ink3);text-wrap:pretty}
.acct{margin-top:14px}
.acct .line{color:var(--ink2);font-size:15px}
.acct .line b{color:var(--ink);font-weight:700}
.chart{margin-top:12px;position:relative}
.chart svg{width:100%;height:auto}
.chart text{font-family:inherit;font-size:12px;fill:var(--ink3);font-weight:500}
.chart .pt{cursor:pointer}
.chart .pt:focus-visible{outline:none}
.chart .pt:focus-visible circle,.chart .pt:hover circle{stroke:var(--acc);stroke-width:3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);display:none;line-height:1.3}
.tip.on{display:block}
.tip small{display:block;font-weight:500;color:#CBD2DC;font-size:12px}
.chart-note{margin-top:8px;font-size:13px;color:var(--ink3)}

/* ---------- approve ---------- */
.ap-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ap-head .sum{margin:0}
.preview{display:inline-flex;align-items:center;gap:12px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:6px 16px 6px 12px;font-size:14px}
.preview .switch{font-weight:600;color:var(--ink2)}
.banner{display:flex;align-items:flex-start;gap:12px;background:var(--amber-bg);color:var(--amber);border-radius:var(--r2);padding:12px 16px;font-weight:600;margin-bottom:20px;line-height:22px}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.compact{display:grid}
.compact .r{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:20px;align-items:center;padding:14px 0;border-top:1px solid var(--rule)}
.compact .r:first-child{border-top:0;padding-top:0}
.compact .r:last-child{padding-bottom:0}
.compact .r h3{font-size:16px;font-weight:700}
.compact .r h3 span{color:var(--ink3);font-weight:500;margin-left:6px}
.compact .r .when{color:var(--ink2);margin-top:2px;font-size:14px}
.compact .r .when i{font-style:normal;color:var(--ink3);margin-left:6px}
.compact .r .act{justify-self:end}
.ap-card{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;position:relative;scroll-margin-top:88px}
.ap-card.focus{outline:2px solid var(--acc);outline-offset:4px}
.ap-card+.ap-card{margin-top:24px}
.vid{width:360px;position:sticky;top:88px;align-self:start}
.vid video{width:360px;height:640px;border-radius:var(--r2);background:#0B1220;object-fit:cover}
.vid .meta{margin-top:10px;font-size:13px;color:var(--ink3);text-align:center}
.ap-right{min-width:0;display:grid;gap:22px;align-content:start}
.ap-ttl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ap-ttl h2{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:30px}
.ap-ttl .when{margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.ap-ttl .when button{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;cursor:pointer;color:var(--ink2)}
.ap-ttl .when button:hover{background:var(--ground)}
.ap-ttl .when button svg{width:14px;height:14px}
.ap-l2{color:var(--ink2);margin-top:-14px}
.ap-l3{font-size:13px;color:var(--ink3);margin-top:-16px}
.ap-sec h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px;letter-spacing:.005em}
.capbox{position:relative;border:1.5px solid var(--rule);border-radius:var(--r2);background:#fff}
.capbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px var(--t4)}
.capbox textarea,.capbox .mirror{font:inherit;font-size:16px;line-height:1.6;padding:14px 16px;margin:0;width:100%;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;letter-spacing:normal}
.capbox textarea{display:block;position:relative;z-index:1;background:transparent;border:0;resize:none;color:transparent;caret-color:var(--ink);outline:none;min-height:calc(8 * 1.6 * 16px + 28px);overflow:hidden}
.capbox .mirror{position:absolute;inset:0;z-index:0;color:var(--ink);pointer-events:none;overflow:hidden}
.capbox .mirror .after{color:var(--ink3)}
.capbox .cutrule{position:absolute;left:0;right:0;height:0;border-top:1px solid #CBD2DC;z-index:2;pointer-events:none}
.capbox .cutrule .lbl{position:absolute;right:12px;top:-10px;background:#fff;padding:0 6px;font-size:13px;color:var(--ink3);font-weight:600;line-height:20px}
.capbox .cutrule .tick{position:absolute;top:-6px;width:0;border-left:2px solid var(--ink3);height:12px}
.cap-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--ink3)}
.cap-foot b{color:var(--ink2);font-weight:700}
.showall{display:none;margin-top:10px}
.less{display:none}
.verdicts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px}
.verdicts span{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink2)}
.verdicts span::before{content:"";width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.verdicts .g{color:var(--green)}.verdicts .a{color:var(--amber)}.verdicts .r{color:var(--red)}.verdicts .n{color:var(--ink3)}.verdicts .n::before{background:var(--rule)}
.fc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.fc p{overflow-wrap:anywhere}
.qa-list{display:grid;gap:8px}
.qa-list li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;line-height:22px}
.qa-list li svg{width:18px;height:18px;margin-top:2px}
.qa-list li.pass svg{color:var(--green)}
.qa-list li.warn svg{color:var(--amber)}

    const role = { green:'live', grey:'sched', acc:'acc', red:'red', outline:'grey' }[stateRole(p)] || 'grey';

function wireChart(root) {
  if (!root) return;
  const tip = $('.tip', root), svg = $('svg', root);
  const show = g => { const vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect(); const sx = r.width / vb.width, sy = r.height / vb.height; tip.innerHTML = esc(g.dataset.tip); tip.style.left = (g.dataset.x * sx) + 'px'; tip.style.top = (g.dataset.y * sy - 10) + 'px'; tip.classList.add('on'); };
  const hide = () => tip.classList.remove('on');
  $$('.pt', root).forEach(g => { g.addEventListener('mouseenter', () => show(g)); g.addEventListener('mouseleave', hide); g.addEventListener('focus', () => show(g)); g.addEventListener('blur', hide); });
}

const CUT = 125;
function verdicts(p) {
  const hook = p.caption.split('\n')[0];
  const out = [];
  if (hook.length <= CUT) out.push(`<span class="g">Hook survives the cut · ${hook.length} characters</span>`);
  else { const before = p.caption.slice(0, CUT).trim().split(/\s+/).slice(-3).join(' '); out.push(`<span class="a">Cut mid-sentence after “${esc(before)}”</span>`); }
  const qaText = (p.qa.lines || []).join(' ');
  const h = qaText.match(/ig-human\s+(\d+(?:\.\d+)?)/i), l = qaText.match(/caption lint\s+([A-Z]+)/i);
  if (h) { const v = +h[1]; out.push(`<span class="${v >= 70 ? 'g' : v >= 55 ? 'a' : 'r'}">Reads human · ${v}/100</span>`); } else out.push('<span class="n">Reads human · not scored</span>');
  if (l) out.push(`<span class="g">Caption lint: ${esc(l[1].toLowerCase())}</span>`); else out.push('<span class="n">Caption lint · not scored</span>');
  return `<div class="verdicts">${out.join('')}</div>`;
}
function qaList(p) {

  const ic = { pass: I.check18, warn: I.warn18, note: I.dot18 };
  const head = p.qa.warns.length ? `QA · approved with ${p.qa.warns.length} warning${p.qa.warns.length > 1 ? 's' : ''}` : 'QA · approved, clean';
  return `<div class="ap-sec"><h3>${head}</h3><ul class="qa-list">

    ${p.qa.lines.map(s => `<li class="${cls(s)}">${ic[cls(s)]}<span>${esc(s)}</span></li>`).join('')}
  </ul></div>`;
}
function captionBox(p, id) {

function wireCaption(box) {
  const ta = $('textarea', box), mir = $('.mirror', box), rule = $('.cutrule', box), tick = $('.tick', box);
  const foot = box.parentElement.querySelector('.cap-foot'), cnt = $('.cnt', foot);
  if (window.matchMedia('(max-width:640px)').matches && ta.value.length > CUT + 40) { box.classList.add('collapsed'); ta.addEventListener('focus', () => { box.classList.remove('collapsed'); box.nextElementSibling?.matches('[data-showall]') && box.nextElementSibling.remove(); }, { once: true }); } else box.nextElementSibling?.matches('[data-showall]') && box.nextElementSibling.remove();
  const draw = () => {
    const v = ta.value;
    mir.innerHTML = `<span class="before">${esc(v.slice(0, CUT))}</span><span class="cut"></span><span class="after">${esc(v.slice(CUT))}</span>​`;
    ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, 0) + 'px';
    cnt.textContent = v.length;
    const c = $('.cut', mir);

    rule.hidden = false;
    const cr = c.getBoundingClientRect(), br = box.getBoundingClientRect();
    rule.style.top = Math.round(cr.bottom - br.top + 2) + 'px';
    tick.style.left = Math.round(cr.left - br.left) + 'px';

  ta.addEventListener('input', draw);

}

function renderCalendar() {
  const mon = mondayOf(NOW); mon.setUTCDate(mon.getUTCDate() + S.week * 7);
  const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setUTCDate(mon.getUTCDate() + i); return d; });
  const sun = days[6];
  const all = posts.map(eff);
  const inWeek = all.filter(p => { const t = parse(p.scheduled_at); return t && t >= mon && t < new Date(sun.getTime() + 86400000); });
  const find = (d, slot) => inWeek.find(p => { const t = parse(p.scheduled_at); return sameUTCDay(t, d) && ((t.getUTCHours() < 12) === (slot === '06:30')); });
  const chip = (p, slot) => {
    const t = parse(p.scheduled_at); const actual = hm(t); const differs = actual !== slot;
    return `<button class="chip ${stateRole(p)}" data-open="post" data-post="${p.slot_id}" aria-label="${esc(title(p))}, ${esc(stateWords(p))}, ${esc(fmt(p.scheduled_at))}">
      <span class="cover c32"><img src="${mediaUrl(p, 'cover.jpg')}" alt=""></span>
      <span class="txt"><b>${esc(title(p))}</b><span class="st"><i></i>${esc(stateShort(p))}</span><small>${differs ? `went out ${actual}` : esc(p.pillar)}</small></span></button>`;
  };
  const cell = (d, slot, i, row) => { const p = find(d, slot); const today = sameUTCDay(d, NOW) ? ' today' : ''; return `<div class="cell${today}" style="grid-column:${i + 2};grid-row:${row}" role="gridcell">${p ? chip(p, slot) : `<span class="empty" aria-hidden="true"><span class="slotw">${slot} · nothing planned</span></span>`}</div>`; };
  const label = `Week ${isoWeek(mon)} · Mon ${mon.getUTCDate()} ${MONS[mon.getUTCMonth()]} – Sun ${sun.getUTCDate()} ${MONS[sun.getUTCMonth()]}`;
  const note = S.week > 0 ? `No plan for week ${isoWeek(mon)} yet. Plan runs Monday and fills this week.` : S.week < 0 ? `Nothing posted in week ${isoWeek(mon)}. Rosa's first reel went out Sat 24 Oct.` : '';
  const sum = S.week === 0 ? `<b>${inWeek.length} reels this week.</b> ${inWeek.map(p => `${esc(title(p))} ${p.state === 'MEASURING' || p.state === 'PUBLISHED' ? 'went out ' + DAYS[parse(p.published_at).getUTCDay()] + ' ' + hm(parse(p.published_at)) : 'posts ' + DAYS[parse(p.scheduled_at).getUTCDay()] + ' ' + hm(parse(p.scheduled_at))} UTC`).join(' · ')}.`
    : `<b>${esc(note)}</b>`;
  $('#view-calendar').innerHTML = `
  <div class="cal-head"><p class="sum">${sum}</p>
    <div class="wknav"><button class="btn sm" data-week="-1" aria-label="Previous week">${I.left}</button><span class="wkl">${label}</span><button class="btn sm" data-week="1" aria-label="Next week">${I.right}</button>${S.week ? `<button class="btn sm" data-week="0">This week</button>` : ''}</div></div>
  <div class="card board" role="grid" aria-label="${esc(label)}">
    <div class="tm" style="grid-column:1;grid-row:2">06:30</div><div class="tm" style="grid-column:1;grid-row:3">18:30</div>
    ${days.map((d, i) => `<div class="day" role="row"><div class="hd${sameUTCDay(d, NOW) ? ' today' : ''}" style="grid-column:${i + 2};grid-row:1" role="columnheader"><b>${DAYS[d.getUTCDay()]}</b> ${d.getUTCDate()}${sameUTCDay(d, NOW) ? '<span class="tdy">Today</span>' : ''}</div>${cell(d, '06:30', i, 2)}${cell(d, '18:30', i, 3)}</div>`).join('')}
    ${note ? `<div class="boardnote" style="grid-column:1/-1;grid-row:4">${esc(note)}</div>` : ''}
  </div>
  ${S.week === 0 ? `<div class="card tight nextwk-card"><b>Next week · week ${isoWeek(new Date(sun.getTime() + 86400000))} · Mon ${sun.getUTCDate() + 1} Oct – Sun 1 Nov.</b> No plan yet. Plan runs Monday and fills the week; its first engagement round comes with it.</div>` : ''}
  <p class="meta13" style="margin-top:12px">Times are UTC. A reel that went out before its slot shows the actual time. Drag to move is not built; use Change time in the reel.</p>`;
  $$('[data-week]', $('#view-calendar')).forEach(b => b.addEventListener('click', () => { S.week = b.dataset.week === '0' ? 0 : S.week + +b.dataset.week; renderCalendar(); }));

const COLS = [
  ['title', 'Reel', 'l'], ['state', 'State', 'l'], ['when', 'Published', 'l'], ['views', 'Views', 'r'], ['reach', 'Reach', 'r'], ['sends', 'Sends /<br>reach', 'r'],

function metric(p, k) {
  const m = p.metrics.latest; if (!m) return null;
  const d = m._derived || {};
  return { views: m.views, reach: m.reach, sends: d.sends_per_reach, saves: d.saves_per_reach, follows: d.follows_per_reach, skip: d.skip_rate, hold: d.hold }[k];
}
function renderPosts() {

  rows.sort((a, b) => { const x = val(a, key), y = val(b, key); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  const arrive = p => p.metrics.next_window_at ? `First numbers ${fmt(p.metrics.next_window_at)}` : p.published_at ? 'Measuring' : `After it posts ${fmt(p.scheduled_at)}`;

    <td class="r">${p.permalink ? `<a class="lnk" href="${esc(p.permalink)}" target="_blank" rel="noopener" data-stop>Open ${I.ext}</a>` : ''}</td></tr>`;
  const live1 = live()[0];

  <p class="sum"><b>${posts.length} reels.</b> ${live1 ? `${esc(title(live1))}'s first numbers arrive ${fmt(live1.metrics.next_window_at)}; until then the metric columns are dashes.` : ''} <span class="more">Click a row to open a reel, a column head to sort.</span></p>
  <div class="card tbl"><div class="scroll"><table class="posts"><thead><tr>${COLS.map(th).join('')}</tr></thead><tbody>${rows.map(tr).join('')}</tbody></table></div></div>`;
  $$('[data-sort]', $('#view-posts')).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const k = b.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : 1 }; renderPosts(); }));

  stop() { openModal({ title: `Stop everything for ${esc(C.display)}?`, sub: `The queue halts. Nothing publishes until you resume. ${nextPost ? `The ${esc(title(nextPost).toLowerCase())} reel scheduled for ${fmt(nextPost.scheduled_at)} will wait.` : ''}`, body: '', footer: `<button type="button" class="btn" data-close>Cancel</button><button class="btn danger-fill">Stop publishing</button>`, onsubmit() { S.stop = true; toast('Publishing stopped. Nothing goes out until you resume.', 'Saved in the mockup only.'); rerender(); } }); },
  resume() { openModal({ title: `Resume publishing for ${esc(C.display)}?`, sub: 'The queue runs again on the next cron tick (every 10 min).', body: '', footer: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Resume</button>`, onsubmit() { S.stop = false; toast('Publishing resumed.', 'Saved in the mockup only.'); rerender(); } }); },
  flag(k) { const what = k === 'comments' ? 'comments' : 'DMs'; openModal({ title: `Let Claude reply to ${what} on its own?`, sub: `Claude drafts a reply and posts it without waiting for you. You can turn it off here any time.`, body: '', footer: `<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Turn on</button>`, onsubmit() { S.flags[k] = true; toast(`Claude now replies to ${what} on its own.`, 'Saved in the mockup only.'); rerender(); } }); $('#modal').addEventListener('close', () => rerender(), { once: true }); }
};
const pct = v => v == null ? '—' : (v * 100).toFixed(1) + ' %';

/* ---------- toast ---------- */
let toastT = null, undoFn = null;
function toast(msg, sub, { undo, ms=4000 } = {}) {
  const t = $('#toast');
  t.innerHTML = `<div>${msg}${sub ? `<small>${sub}</small>` : ''}</div>${undo ? `<button type="button" id="undo">Undo</button>` : ''}`;
  t.classList.add('on'); clearTimeout(toastT);
  undoFn = undo || null;
  if (undo) $('#undo').addEventListener('click', () => { clearTimeout(toastT); t.classList.remove('on'); undo(); undoFn = null; });
  toastT = setTimeout(() => { t.classList.remove('on'); undoFn = null; }, ms);
}

/* ---------- approve actions ---------- */
let pendingApprove = null;
function approve(id) {
  const p = eff(byId[id]); if (p.state !== 'NEEDS_APPROVAL') return;
  clearTimeout(pendingApprove);
  toast(`Approving ${esc(title(p))}…`, `Posts ${fmt(p.scheduled_at)}. Saved in the mockup only.`, { ms: 2000, undo: () => { clearTimeout(pendingApprove); pendingApprove = null; } });
  pendingApprove = setTimeout(() => { S.decided[id] = { state: 'APPROVED' }; toast(`Approved. Posts ${fmt(p.scheduled_at)}.`, 'Saved in the mockup only. The dashboard server records this for real.'); rerender(); }, 2000);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const o = e.target.closest('[data-open]');
  if (o) { const k = o.dataset.open; const p = o.dataset.post ? eff(byId[o.dataset.post]) : null; if (k === 'post') POPUP.post(p, { edit: !!o.dataset.edit }); else if (POPUP[k]) POPUP[k](p); return; }
  const a = e.target.closest('[data-approve]'); if (a) return approve(a.dataset.approve);
  const c = e.target.closest('[data-copy]'); if (c) { navigator.clipboard?.writeText(c.dataset.copy).catch(() => {}); c.classList.add('done'); setTimeout(() => c.classList.remove('done'), 1600); return; }
  const s = e.target.closest('[data-save-cap]'); if (s) { const id = s.dataset.saveCap.replace(/^pop-/, ''); const ta = $(`#cap-${s.dataset.saveCap}`); S.captions[id] = ta.value + '\n'; s.classList.add('done'); setTimeout(() => s.classList.remove('done'), 1600); return; }
  const sa = e.target.closest('[data-showall]'); if (sa) { const box = sa.previousElementSibling; box.classList.remove('collapsed'); sa.remove(); $('textarea', box).dispatchEvent(new Event('input')); return; }
  const pg = e.target.closest('[data-pg]'); if (pg) { S.focus += +pg.dataset.pg; renderApprove(); return; }
  if (e.target.closest('#menubtn')) { openModal({ title: 'Sections', body: `<nav class="nav" aria-label="Main">${$('#nav').innerHTML}</nav>` }); return; }
});
document.addEventListener('change', e => {
  const f = e.target.closest('[data-flag]'); if (f) { const k = f.dataset.flag; if (f.checked) { f.checked = false; POPUP.flag(k); } else { S.flags[k] = false; toast(`Claude no longer replies to ${k === 'comments' ? 'comments' : 'DMs'} on its own.`, 'Saved in the mockup only.'); rerender(); } }
});
document.addEventListener('keydown', e => {
  if ($('#modal').open || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
  if (current !== 'approve') return;
  const cards = $$('.ap-card', $('#view-approve'));
  if (!cards.length) return;
  const k = e.key.toLowerCase();
  if (k === 'j' || k === 'k') { S.keyed = true; S.focus = Math.max(0, Math.min(cards.length - 1, S.focus + (k === 'j' ? 1 : -1))); cards.forEach((c, i) => c.classList.toggle('focus', i === S.focus)); cards[S.focus].scrollIntoView({ block: 'start', behavior: 'smooth' }); cards[S.focus].focus({ preventScroll: true }); e.preventDefault(); }
  else if (k === 'a') { approve(cards[S.focus].dataset.card); e.preventDefault(); }
  else if (k === 'r') { POPUP.reject(eff(byId[cards[S.focus].dataset.card])); e.preventDefault(); }
  else if (k === '?') { openModal({ title: 'Keys on Approve', body: `<dl style="display:grid;grid-template-columns:48px 1fr;gap:10px 16px"><dt><kbd>J</kbd></dt><dd>Next card</dd><dt><kbd>K</kbd></dt><dd>Previous card</dd><dt><kbd>A</kbd></dt><dd>Approve the outlined card (2 s to undo)</dd><dt><kbd>R</kbd></dt><dd>Send the outlined card back, with a note</dd><dt><kbd>Esc</kbd></dt><dd>Close</dd></dl>` }); }
});

/* ---------- routing ---------- */
let current = null;
const RENDER = { overview: renderOverview, approve: renderApprove, calendar: renderCalendar, posts: renderPosts, today: renderToday, learn: renderLearn, settings: renderSettings };
function markNav() { $$('#nav a').forEach(a => a.toggleAttribute('aria-current', false)); const a = $(`#nav a[data-view="${current}"]`); if (a) a.setAttribute('aria-current', 'page'); }
function route() {
  const qs = new URLSearchParams(location.search).get('view');
  const h = location.hash.slice(1) || qs || document.documentElement.dataset.view || 'overview';
  const v = RENDER[h] ? h : 'overview';
  const changed = v !== current; current = v;
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'view-' + v));
  const label = VIEWS.find(x => x[0] === v)[1];
  $('#title').textContent = label; $('#mviewname').textContent = label; document.title = 'Tachyon — ' + label;
  renderNav(); markNav();
  RENDER[v]();
  $('#keys').hidden = v !== 'approve' || !$$('.ap-card').length;
  if (changed) window.scrollTo(0, 0);
}
function rerender() { renderNav(); markNav(); RENDER[current](); }
window.addEventListener('hashchange', route);
route();
</script>
</body>
