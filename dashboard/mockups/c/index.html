<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tachyon — Overview</title>
<meta name="description" content="Tachyon operator dashboard, direction C “Studio”: reels as cover tiles with their numbers, approvals as a rail. Mockup dash-01 on the real data.json of 24 Oct 2026.">
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url("../../fonts/manrope-latin-wght-normal.woff2") format("woff2")}
:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;
  /* Direction C accent: coral. Fill only, white text on it, never coral text. */
  --acc:#D1434F;--acc-h:#BF3A45;--t1:#DC727B;--t2:#E8A1A7;--t3:#F1C7CA;--t4:#F8E3E5;--t5:#FCF2F3;
  --blue:#1F4BFF;
  --green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;--red-bg:#FCEBED;--amber:#8A4B00;--amber-bg:#FFF4D6;--grey-bg:#EEF0F3;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.06);
  --r:20px;--r2:12px;--gap:24px;--pad:28px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;background:var(--ground);display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;font-size:15px;line-height:1.45;font-weight:400}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;overflow:visible}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lnk{color:var(--blue);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:4px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:12px;height:12px}
b,strong{font-weight:700}
.muted{color:var(--ink3)}
.small{font-size:13px}
.ink2{color:var(--ink2)}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:28px 20px 24px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 28px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--acc);display:inline-block;position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px;border:0;background:transparent;border-radius:var(--r2);font-weight:500;font-size:15px;color:var(--ink2);cursor:pointer;text-decoration:none;position:relative}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t5);color:var(--ink);font-weight:700}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--acc)}
.nav a svg{width:22px;height:22px;flex:none}
.nav .badge{margin-left:auto;background:var(--acc);color:#fff;font-size:13px;font-weight:700;min-width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.nav .n{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600}
.nav .n.z{color:var(--ink3);font-weight:500}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--rule);font-size:13px;color:var(--ink3);display:grid;gap:4px}
.side-foot b{color:var(--ink2);font-weight:700}
.mtop{display:none}

/* ---------- main ---------- */
main{min-width:0;padding:0 24px 48px}
.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;background:var(--ground);z-index:10;padding:16px 0}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.top h1:focus{outline:none}
.top .hint{font-size:13px;color:var(--ink3);font-weight:500;margin-left:14px}
.top .hint kbd{font:inherit;font-weight:700;color:var(--ink2)}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.psel{position:relative;display:inline-flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);height:40px;padding:0 14px;gap:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.psel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 22px 0 0;height:40px;font-weight:600;color:var(--ink);cursor:pointer}
.psel .chev{position:absolute;right:14px;width:12px;height:12px;pointer-events:none}
.psel:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.psel select:focus{outline:none}
.fresh{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:500;white-space:nowrap}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.view{display:none}.view.on{display:block}
.lede{font-size:17px;line-height:26px;color:var(--ink2);margin:0 0 20px;text-wrap:pretty}
.lede b{color:var(--ink)}
.lede .at{color:var(--ink)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--pad)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.card-h h2{font-size:18px;font-weight:700;letter-spacing:-.005em;display:flex;align-items:center;gap:10px}
.card-h .meta{font-size:13px;color:var(--ink3);font-weight:500}
.cnt{min-width:24px;height:24px;padding:0 8px;border-radius:6px;background:var(--grey-bg);color:var(--ink2);font-weight:700;font-size:13px;display:inline-grid;place-items:center}
.cnt.acc{background:var(--acc);color:#fff}
.stack{display:grid;gap:var(--gap)}
.empty{color:var(--ink2);font-size:15px;line-height:1.55;text-wrap:pretty}
.empty b{color:var(--ink)}
.empty.big{font-size:17px;line-height:26px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.grey{background:var(--grey-bg);color:var(--ink2)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.outline{background:#fff;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.acc{background:var(--acc);color:#fff}
.pill.acc i{background:#fff}
.pill.on-cover{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 1px 2px rgba(11,18,32,.08)}
.pill.on-cover.green i{background:var(--green)}
.pill.on-cover.grey i{background:var(--ink3)}
.pill.on-cover.red i{background:var(--red)}
.pill.on-cover.acc{background:var(--acc);color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1}
.btn:hover{background:var(--ground)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{height:44px;padding:0 24px;border-color:transparent;background:var(--acc);color:#fff;border-radius:12px;min-width:160px}
.btn.primary:hover{background:var(--acc-h)}
.btn.danger{height:44px;padding:0 20px;border-color:transparent;background:var(--red-bg);color:var(--red);border-radius:12px}
.btn.danger:hover{background:#F8D9DD}
.btn.stop{height:48px;padding:0 24px;border-color:transparent;background:var(--red);color:#fff;border-radius:12px}
.btn.stop:hover{background:#A8142A}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--ground);color:var(--ink)}
.btn.icon{width:36px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.done{border-color:var(--green-bg);background:var(--green-bg);color:var(--green)}
.chips{display:inline-flex;gap:6px;background:var(--ground);border-radius:999px;padding:4px}
.chip{height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff;font-weight:700}
.switch{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:var(--ink2);font-size:15px}
.switch i{width:44px;height:24px;border-radius:999px;background:#CBD0DA;position:relative;transition:background .15s;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(11,18,32,.2);transition:left .15s}
.switch[aria-checked="true"] i{background:var(--acc)}
.switch[aria-checked="true"] i::after{left:22px}
.switch[aria-checked="true"]{color:var(--ink)}

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--gap);align-items:start}
.wall{display:grid;gap:var(--gap)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:var(--gap)}
.tile{min-width:0}
.tile .cov{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:var(--r2);overflow:hidden;background:#0B1220;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(11,18,32,.06)}
.tile .cov img{width:100%;height:100%;object-fit:cover}
.tile .cov:hover img{opacity:.92}
.tile .cov:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:var(--r2)}
.tile .cov.slot{background:transparent;box-shadow:none;border:1.5px dashed var(--rule);display:grid;place-items:center;padding:24px;text-align:center;font-size:13px;color:var(--ink3);line-height:1.45;cursor:default}
.tile h3{margin-top:14px;font-size:17px;font-weight:700;letter-spacing:-.005em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tile h3 .len{color:var(--ink3);font-weight:500;font-size:14px}
.tile .sub{font-size:13px;color:var(--ink3);margin-top:2px}
.tile dl{margin-top:12px;border-top:1px solid var(--rule)}
.tile dl div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:15px}
.tile dt{color:var(--ink2)}
.tile dd{font-weight:700;color:var(--ink)}
.tile dd.dash{color:var(--ink3);font-weight:500}
.tile .when{margin-top:10px;font-size:14px;color:var(--ink2);line-height:1.4}
.tile .when b{color:var(--ink)}
.tile .acts{margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rail{display:grid;gap:var(--gap)}
.rail .card{padding:24px}
.needs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:start}
.needs .num{font-size:40px;line-height:44px;font-weight:600;color:var(--ink3);letter-spacing:-.02em}
.needs .num.acc{color:var(--ink);font-weight:700}
.needs .txt{grid-column:1/-1;font-size:15px;line-height:1.5;color:var(--ink2)}
.needs .txt b{color:var(--ink)}
.needs .txt .lnk{margin-top:8px}
.needs ul li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.wk{display:grid;grid-template-columns:44px repeat(7,1fr);gap:6px 4px;align-items:center;justify-items:center;font-size:13px;color:var(--ink3);font-weight:600}
.wk .d{font-size:13px;color:var(--ink3)}
.wk .d.today{color:var(--ink);font-weight:800}
.wk .t{justify-self:start;color:var(--ink3);font-weight:500}
.wk .dot{width:14px;height:14px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule);border:0;padding:0;cursor:default}
.wk .dot.has{cursor:pointer}
.wk .dot.live{background:var(--green);box-shadow:none}
.wk .dot.sched{background:#CBD0DA;box-shadow:none}
.wk .dot.wait{background:var(--acc);box-shadow:none}
.wk .dot.fail{background:var(--red);box-shadow:none}
.wk .today-col{background:var(--t5);border-radius:8px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;color:var(--ink3);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.health{display:grid;gap:0}
.health div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}
.health div:first-child{border-top:0;padding-top:0}
.health dt{color:var(--ink2)}
.health dd{font-weight:700;text-align:right}
.health dd.na{color:var(--ink3);font-weight:500}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}

/* charts */
.chart{position:relative}
.chart svg{width:100%;height:auto;font-family:inherit}
.chart text{font-size:12px;fill:var(--ink3);font-weight:500}
.chart .axis{stroke:var(--rule);stroke-width:1}
.chart .pt{fill:var(--acc);stroke:#fff;stroke-width:2;cursor:default}
.chart .pt:hover,.chart .pt:focus{r:8;outline:none}
.chart .pt:focus-visible{stroke:var(--acc);stroke-width:3}
.chart .lbl{fill:var(--ink);font-weight:700;font-size:13px}
.chart .note{font-size:13px;color:var(--ink3);margin-top:10px;line-height:1.45}
.ctip{position:absolute;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap;opacity:0;transition:opacity .12s}
.ctip.on{opacity:1}

/* ---------- approve ---------- */
.ap{display:grid;grid-template-columns:288px minmax(0,1fr);gap:var(--gap);align-items:start}
.ap-col h2{font-size:15px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px;margin:0 0 12px}
.ap-col h2+.empty{font-size:14px;margin-bottom:20px}
.ap-col .group{margin-bottom:20px}
.minis{display:grid;gap:12px}
.mini{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:8px;margin:-8px;border-radius:14px;border:0;background:transparent;text-align:left;cursor:pointer;width:calc(100% + 16px)}
.mini:hover{background:#fff}
.mini[aria-selected="true"]{background:#fff;box-shadow:var(--shadow)}
.mini .cov{width:96px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#0B1220;position:relative}
.mini .cov img{width:100%;height:100%;object-fit:cover}
.mini[aria-selected="true"] .cov{outline:2px solid var(--acc);outline-offset:2px}
.mini h3{font-size:15px;font-weight:700;margin-top:4px}
.mini .s{font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.4}
.mini .pill{margin-top:8px}
.acard{position:relative;display:grid;grid-template-columns:360px minmax(0,1fr);gap:32px;align-items:start}
.acard.focused{outline:2px solid var(--acc);outline-offset:4px}
.vid{width:360px;position:sticky;top:88px}
.vid video,.vid .cover{width:360px;height:640px;border-radius:var(--r2);background:#0B1220;object-fit:cover;display:block}
.vid .spec{font-size:13px;color:var(--ink3);margin-top:10px;text-align:center}
.acol{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.acol>*{min-width:0}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trow h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.trow .time{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600;font-size:15px}
.trow .time button{border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.trow .time button:hover{background:var(--ground);color:var(--ink)}
.trow .time button svg{width:14px;height:14px}
.meta1{font-size:15px;color:var(--ink2);line-height:1.5}
.meta2{font-size:13px;color:var(--ink3);margin-top:4px}
.lab{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lab .r{font-weight:500;color:var(--ink3)}
.capbox{position:relative;border:1.5px solid var(--rule);border-radius:var(--r2);background:#fff}
.capbox:focus-within{border-color:var(--acc)}
.capbox .mirror,.capbox textarea{font-size:16px;line-height:1.6;padding:14px 72px 14px 16px;font-family:inherit;font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;letter-spacing:0}
.capbox .mirror{min-height:calc(1.6em * 8 + 28px);color:var(--ink);pointer-events:none}
.capbox .mirror .after{color:var(--ink3)}
.capbox textarea{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color:transparent;caret-color:var(--ink);resize:none;overflow:hidden;outline:none;margin:0}
.capbox textarea::selection{background:var(--t3);color:transparent}
.capbox textarea[readonly]{cursor:default}
.capbox.ro .mirror{color:var(--ink)}
.cut{position:absolute;height:1px;background:var(--ink2);pointer-events:none}
.cut::before{content:"";position:absolute;left:0;top:-24px;width:2px;height:25px;background:var(--ink)}
.cut span{position:absolute;right:0;top:-9px;font-size:12px;color:var(--ink2);font-weight:700;background:#fff;padding:0 4px;line-height:18px;border:1px solid var(--rule);border-radius:6px}
.capfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
.verdicts{display:flex;gap:10px 20px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--ink2)}
.verdicts span{display:inline-flex;align-items:center;gap:8px}
.verdicts i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ink3)}
.verdicts .g i{background:var(--green)}.verdicts .a i{background:#D98C00}.verdicts .r i{background:var(--red)}
.softbox{background:var(--ground);border-radius:var(--r2);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;font-size:15px;line-height:1.5}
.softbox p{overflow-wrap:anywhere;min-width:0;flex:1}
.qa li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:6px 0;font-size:15px;line-height:1.45;color:var(--ink)}
.qa li svg{width:18px;height:18px;margin-top:2px}
.qa li.warn{color:var(--ink)}
.qa li.note{color:var(--ink2)}
.qa li svg.ok{color:var(--green)}
.qa li svg.warn{color:#D98C00}
.qa li svg.dot{color:#CBD0DA}
.over li{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45;margin-top:8px;font-weight:500}
.over li:first-child{margin-top:0}
.over li b{font-weight:700;white-space:nowrap}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px}
.actions .right{margin-left:auto}
.okline{display:flex;align-items:center;gap:10px;background:var(--green-bg);color:var(--green);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.okline svg{width:18px;height:18px}
.wintbl{width:100%;border-collapse:collapse;font-size:15px}
.wintbl th{text-align:left;font-size:13px;color:var(--ink3);font-weight:600;padding:0 0 8px;border-bottom:1px solid var(--rule)}
.wintbl td{padding:12px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.wintbl td:first-child{font-weight:700;width:72px}
.wintbl td.na{color:var(--ink2)}
.wintbl .ratio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px;color:var(--ink3);font-size:13px}
.preview-note{display:flex;align-items:center;gap:12px;background:var(--t5);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--ink);margin-bottom:20px;flex-wrap:wrap}
.preview-note b{color:var(--ink)}
.ap-bar{display:none}

/* ---------- QA checklist ---------- */
const qaHead = p => p.qa.verdict === 'APPROVED' ? (warnsOf(p) ? `approved with ${warnsOf(p)} warning${warnsOf(p) > 1 ? 's' : ''}` : 'approved, clean') : esc(p.qa.verdict.toLowerCase());
function qaList(p) {
  const spec = `<li><svg class="ok" viewBox="0 0 18 18">${I.check.replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg><span>Spec check: ${p.qa.spec === 'PASS' ? 'passed' : esc(p.qa.spec)}</span></li>`;
  return `<ul class="qa">${spec}${p.qa.lines.map(l => {
    const warn = /WARN|STALE/.test(l), pass = /PASS\.?$/.test(l.trim());
    const ic = pass ? I.check.replace('<svg ', '<svg class="ok" ') : warn ? I.tri.replace('<svg ', '<svg class="warn" ') : I.dot.replace('<svg ', '<svg class="dot" ');
    return `<li class="${warn ? 'warn' : pass ? '' : 'note'}">${ic}<span>${esc(l.replace(/\s*PASS\.?$/, ''))}</span></li>`;
  }).join('')}</ul>`;
}

/* ---------- caption checks (from the caption and QA prose; see notes.md for the data gap) ---------- */
function captionChecks(p, caption) {
  const first = (caption.split('\n')[0] || '').trim();
  const out = [];
  if (first.length <= 125) out.push({ c: 'g', t: 'Hook survives the cut' });
  else { const cut = caption.slice(0, 125).trim().split(/\s+/).slice(-3).join(' '); out.push({ c: 'a', t: `Cut mid-sentence after “${cut}”` }); }
  const qa = p.qa.lines.join(' ');
  const h = qa.match(/ig-human\s+(\d+(?:\.\d+)?)/i);
  if (h) { const s = parseFloat(h[1]); out.push({ c: s >= 70 ? 'g' : s >= 55 ? 'a' : 'r', t: `Reads human · ${s}/100` }); }
  const lint = qa.match(/caption lint\s+(\w+)/i);
  if (lint) out.push({ c: /READY|PASS/i.test(lint[1]) ? 'g' : 'a', t: `Caption lint: ${lint[1].toLowerCase()}` });
  if (!h && !lint) out.push({ c: 'n', t: 'Human and lint scores: not scored for this reel' });
  return out;
}

function accountChart() {

  const x = i => rows.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (rows.length - 1);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const pts = rows.map((r, i) => `<circle class="pt" r="6" cx="${x(i)}" cy="${y(vals[i])}" tabindex="0" data-tip="${esc(dmy(P(r.date)))} · ${vals[i]} followers"><title>${esc(dmy(P(r.date)))}: ${vals[i]} followers</title></circle>`).join('');

  const xl = rows.map((r, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(dmy(P(r.date)))}</text>`).join('');

      <text x="${pl - 8}" y="${y(0) + 4}" text-anchor="end">0</text><text x="${pl - 8}" y="${y(max) + 4}" text-anchor="end">${max}</text>
      ${line}${pts}${xl}

function wireChart(root) {
  const tip = $('.ctip', root); if (!tip) return;
  $$('.pt', root).forEach(c => {
    const show = () => { const r = c.getBoundingClientRect(), b = root.getBoundingClientRect(); tip.textContent = c.dataset.tip; tip.style.left = (r.left - b.left + r.width / 2) + 'px'; tip.style.top = (r.top - b.top) + 'px'; tip.classList.add('on'); };
    const hide = () => tip.classList.remove('on');
    c.addEventListener('mouseenter', show); c.addEventListener('mouseleave', hide); c.addEventListener('focus', show); c.addEventListener('blur', hide);
  });
}

    const d = new Date(mon); d.setUTCDate(d.getUTCDate() + di);

  };
  const row = slot => `<span class="t">${slot}</span>` + [0,1,2,3,4,5,6].map(i => cell(i, slot)).join('');
  const heads = [0,1,2,3,4,5,6].map(i => { const d = new Date(mon); d.setUTCDate(d.getUTCDate() + i); const today = dayKey(d) === dayKey(NOW); return `<span class="d ${today ? 'today' : ''}" title="${esc(dmy(d))}">${DAYS[d.getUTCDay()][0]}</span>`; }).join('');
  return `<div class="wk" role="img" aria-label="This week's two daily slots"><span></span>${heads}${row('06:30')}${row('18:30')}</div>

}
function wirePosts(root) {
  $$('[data-sort]', root).forEach(b => b.onclick = () => { if (PT.key === b.dataset.sort) PT.dir = -PT.dir; else { PT.key = b.dataset.sort; PT.dir = 1; } render(); });
  $$('tr.row', root).forEach(tr => { const open = () => popPost(byId(tr.dataset.post)); tr.onclick = e => { if (e.target.closest('[data-stop]')) return; open(); }; tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }; });
}

/* =================================================================== TODAY · LEARN · SETTINGS */
function rToday() {
  const d = dmy(NOW);
  return `<div class="two">
    <section class="card"><div class="card-h"><h2>Replies to send <span class="cnt">0</span></h2></div><p class="empty"><b>No replies drafted.</b> Comment and DM alerts start once the listener is deployed; Claude drafts replies every morning after that. Each reply will show the reel it is under, the comment, the draft, Copy and “Mark sent”.</p></section>
    <section class="card"><div class="card-h"><h2>Engagement round <span class="cnt">0</span></h2></div><p class="empty"><b>No engagement round for ${esc(DAYS[NOW.getUTCDay()])} ${esc(d)}.</b> Plan writes one each day it runs; the first comes with week ${isoWeek(NOW) + 1}'s plan on Monday. It will be 10 rows: account, the post, the planned time, the comment to leave, Copy and a tick.</p></section></div>`;
}
function rLearn() {
  return `<div class="stack">
    <section class="card"><div class="card-h"><h2>Weekly report</h2></div><p class="empty"><b>No weekly report yet.</b> Learn runs on Sundays once a full week of numbers exists; the showreel's 7-day numbers land 31 Oct, so the earliest report is Sun 1 Nov. It will appear here as sections, not as a file.</p></section>
    <div class="two">
      <section class="card"><div class="card-h"><h2>Experiments</h2></div><p class="empty">No experiment this week. Both reels are existing clips; the first pre-registered test comes with week 44's plan. Results will carry a “directional only” mark until the sample is large enough.</p></section>
      <section class="card"><div class="card-h"><h2>Which slot wins</h2></div><div class="chart"><svg viewBox="0 0 300 120" role="img" aria-label="Slot time comparison, no data yet"><line class="axis" x1="32" x2="288" y1="92" y2="92"/><rect x="70" y="40" width="64" height="52" rx="6" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><rect x="180" y="40" width="64" height="52" rx="6" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><text x="102" y="110" text-anchor="middle">06:30</text><text x="212" y="110" text-anchor="middle">18:30</text><text x="102" y="30" text-anchor="middle">0 reels</text><text x="212" y="30" text-anchor="middle">1 reel</text></svg><p class="note">Hold and sends per reach by slot, once each slot has 3 measured reels.</p></div></section>
    </div></div>`;
}
function rSettings() {
  const g = C.grants; const stop = MOCK.stop ?? g.emergency_stop;
  const flag = (key, label) => { const on = MOCK.flags[key] ?? g.auto_reply[key]; return `<div><dt>${label}</dt><dd><button class="switch" role="switch" aria-checked="${on}" data-flag="${key}"><i></i>${on ? 'On' : 'Off'}</button></dd></div>`; };
  const last = C.journal_recent[0];
  return `<div class="two">
    <div class="stack">
      <section class="card"><div class="card-h"><h2>What Claude may do on its own</h2></div><dl class="rows">${flag('comments', 'Reply to comments')}${flag('dm', 'Answer DMs')}<div><dt>Approve reels without you</dt><dd class="na">${g.auto_approve_pillars.length ? esc(g.auto_approve_pillars.join(', ')) : 'No pillar yet · every reel waits for you'}</dd></div></dl></section>
      <section class="card stopcard"><div class="card-h" style="margin-bottom:4px"><h2>${stop ? 'Publishing is stopped' : 'Emergency stop'}</h2>${stop ? '<span class="pill red"><i></i>Stopped</span>' : ''}</div><p>${stop ? 'Nothing publishes until you resume. The queue keeps its order.' : 'Halts the queue for this client. Nothing publishes until you resume; nothing already live is touched.'}</p><div>${stop ? `<button class="btn primary" id="resume">Resume publishing</button>` : `<button class="btn stop" id="stop">Stop publishing</button>`}</div></section>
    </div>
    <div class="stack">
      <section class="card"><div class="card-h"><h2>Account</h2></div><dl class="rows">
        <div><dt>Instagram</dt><dd>@${esc(C.handle)}</dd></div>
        <div><dt>Page id</dt><dd>${esc(g.page_id)} <button class="btn icon" data-copy="${esc(g.page_id)}" aria-label="Copy the page id">${I.copy}</button></dd></div>
        <div><dt>Instagram id</dt><dd>${esc(g.ig_user_id)} <button class="btn icon" data-copy="${esc(g.ig_user_id)}" aria-label="Copy the Instagram id">${I.copy}</button></dd></div>
        <div><dt>Access token</dt><dd class="na">Expiry not reported yet</dd></div>
        <div><dt>Last activity</dt><dd>${last ? esc(fmt(P(last.ts))) : '—'}</dd></div></dl></section>
      <section class="card"><div class="card-h"><h2>Documents</h2></div><div style="display:flex;gap:20px;flex-wrap:wrap"><a class="lnk" href="../../../docs/PLAN.md">The plan ${I.ext}</a><a class="lnk" href="../../../docs/PLAYBOOK.md">The playbook ${I.ext}</a><a class="lnk" href="../../../clients/rosa/strategy.md">${esc(C.display)}'s strategy ${I.ext}</a></div></section>
    </div></div>`;
}
function wireSettings(root) {
  $$('[data-flag]', root).forEach(b => b.onclick = () => { const k = b.dataset.flag; const on = MOCK.flags[k] ?? C.grants.auto_reply[k]; if (on) { MOCK.flags[k] = false; render(); toast(`Turned off. ${MOCKNOTE}`); } else popFlag(k, render); });
  const s = $('#stop', root); if (s) s.onclick = () => popStop(render);
  const r = $('#resume', root); if (r) r.onclick = () => popResume(render);
  $$('[data-copy]', root).forEach(b => b.onclick = () => copy(b.dataset.copy, b));
}

/* =================================================================== render + routing */
const R = { overview: rOverview, approve: rApprove, calendar: rCalendar, posts: rPosts, today: rToday, learn: rLearn, settings: rSettings };
function render() {
  const v = VIEWS.find(x => x.id === current) || VIEWS[0];
  const root = $('#view-' + v.id);
  const scroll = window.scrollY;
  root.innerHTML = R[v.id]();
  $$('.view').forEach(s => s.classList.toggle('on', s === root));
  $('#title').textContent = v.name; document.title = `Tachyon — ${v.name}`;
  $('#hint').textContent = v.id === 'approve' ? '' : v.id === 'overview' ? `${C.display}, week ${isoWeek(NOW)}` : '';
  renderNav();
  if (v.id === 'approve') wireApprove(root);
  if (v.id === 'calendar') wireCalendar(root);
  if (v.id === 'posts') wirePosts(root);
  if (v.id === 'settings') wireSettings(root);
  $$('[data-win]', root).forEach(b => b.onclick = () => { WIN = b.dataset.win; render(); });
  $$('[data-post]', root).forEach(b => b.onclick = () => popPost(byId(b.dataset.post)));
  $$('.chart', root).forEach(wireChart);
  window.scrollTo(0, scroll);
}
function route() {
  const sp = new URLSearchParams(location.search); const q = sp.get('view');
  if (sp.get('sample') === '1' && !route.ran) { MOCK.sample = true; AP.sel = '2026-w43-02'; }
  route.ran = true;
  let id = (location.hash || '').replace('#', '') || q || 'overview';
  if (!R[id]) id = 'overview';
  const changed = id !== current; current = id;
  $('#side').classList.remove('open'); $('#menu').setAttribute('aria-expanded', 'false');
  render();
  if (changed) { window.scrollTo(0, 0); $('#title').focus({ preventScroll: true }); }
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (current === 'approve') layoutCaption(); });
$('#menu').onclick = () => { const s = $('#side'); const open = !s.classList.contains('open'); s.classList.toggle('open', open); $('#menu').setAttribute('aria-expanded', String(open)); };
$('#nav').addEventListener('click', e => { if (e.target.closest('a')) $('#side').classList.remove('open'); });
document.fonts && document.fonts.ready.then(() => { if (current === 'approve') layoutCaption(); });
renderTop();
route();
})();
</script>
</body>
</html>
