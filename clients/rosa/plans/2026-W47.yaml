- at: '2026-11-16T06:30:00+00:00'
  title: Bars light up
  pillar: Why this rating
  brief: 'A fresh Pixabay clip of a peeling left at Uluwatu snaps to a freeze frame and the light-theme Uluwatu spot page slides up over it in a big phone, filling the bottom two thirds of the screen. The Size, Period and Wind bars fill one after another on a beat, each bar''s name popping huge above the phone as it lands. The rating pill punches in last and the phone swings in 3D toward the camera so the score reads full size. Rosa particles rise and fade through the empty space, then the closing card: logo, white two-line text, space, glowing blue button with white text, white "link in bio".

    '
  hook: Here's why it says Good
  theme: light
  motion: gabrielbuzziv-4ff0c6
  caption: 'Ever wonder why a day rates Good?


    Rosa shows you. Size, period and wind, each with its own bar, right on the spot page. Uluwatu here, and the wind can only polish what the swell brings.


    Over 4,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.

    .

    .

    .

    #surfforecast #uluwatu #surfing

    '
