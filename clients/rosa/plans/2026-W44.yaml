  - at: "2026-10-27T18:30:00+00:00"
    title: "Uluwatu hour by hour"
    pillar: "Spot spotlight"
    brief: "Open on Pixabay surfer footage (1306-145340152_medium.mp4) with the hook. The phone tilts in showing spot-uluwatu-full.png and scrolls down the hourly table in 3-hour steps, pausing on the green \"Best session\" tag. Keep scrolling to the tide curve and first light / sunset row. End card: logo, \"rosa.surf/spot/uluwatu\", \"Footage: Pixabay\"."
    hook: "Uluwatu, hour by hour."
    caption: |
      Uluwatu, hour by hour. rosa.surf/spot/uluwatu, it's free.

      Every 3 hours: surf height, swell period and direction, wind and whether it's offshore, cross or onshore. The best session gets its own tag, the tide gets its own curve, first light gets its own line.

      Uluwatu is no secret and it gets busy. Go early, be nice in the line-up.

      One of 3,056 spots, 16 days out, four updates a day.

