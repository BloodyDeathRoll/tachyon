  - at: "2026-10-26T06:30:00+00:00"
    title: "Pipeline: why Good"
    pillar: "Why this rating"
    brief: "Open on Pixabay surf footage (218670_large.mp4) with the hook, then the phone swings in showing spot-pipeline.png. Push in on the green Good badge. The Size, Period and Wind bars light up one at a time; Size and Period run long, the Wind bar stops short and a card reads \"wind can only polish\". End card: logo, \"rosa.surf, link in bio\", \"Footage: Pixabay\"."
    hook: "Why Good and not Epic?"
    caption: |
      Why Good and not Epic? Open the spot and the bars tell you. rosa.surf, link in bio.

      Every rating in Rosa comes with its reasons: size, period and wind, each on its own bar. Here the swell and the period are there, the wind is only so-so, so the day stops at Good.

      Wind can polish a day. It can't make one.

      3,056 spots worldwide, 16 days out, four updates a day. Free.

      Waves: NOAA GFS-Wave + ECMWF open data (CC-BY 4.0) · Peak periods: DWD GWAM (CC-BY 4.0) · Weather by Open-Meteo.com (CC-BY 4.0) · Sea temp: NOAA OISST · Tides: EOT20 (CC-BY 4.0)

      #surfforecast #pipeline #northshore

