    brief: "Hook over Pixabay wave footage (310248_large.mp4). Cut to the phone showing spot-pipeline.png, push in on the day strip as the bars step up from Today to Sunday and turn dark green. A brand card slides in: \"Swell alert. Straight to your phone.\" End card: logo, \"rosa.surf, link in bio\", \"Footage: Pixabay\"."
    hook: "Let the swell find you."
    caption: |
      Stop refreshing. Let the swell find you. rosa.surf, link in bio.

      Turn on swell alerts and Rosa sends a push when a swell is lining up. Open it, see the rating and why, decide if the drive is worth it.

