  - at: "2026-10-28T18:30:00+00:00"
    title: "Onshore by nine"
    pillar: "Why this rating"
    brief: "Hook on a black card. The phone shows spot-supertubos.png and scrolls into the hourly table: the wind column reads CROSS in orange at midnight, 03:00 and 06:00, then flips to ONSHORE in red at 09:00. Highlight that row while the 14 s period column stays steady. Card: \"Same swell. Different wind.\" End card: logo, \"rosa.surf, link in bio\"."
    hook: "Onshore by nine?"
    caption: |
      Onshore by nine? The wind column says so before you load the car. rosa.surf, link in bio.

      Every hour shows the wind and what it does to the wave: offshore, cross or onshore, colour coded. The swell can hold all morning and the session still ends when the wind turns.

      That's why the rating weighs wind, and why wind can only polish a day that already has size and period.

      Free, worldwide, 16 days out.

      Waves: NOAA GFS-Wave + ECMWF open data (CC-BY 4.0) · Peak periods: DWD GWAM (CC-BY 4.0) · Weather by Open-Meteo.com (CC-BY 4.0) · Sea temp: NOAA OISST · Tides: EOT20 (CC-BY 4.0)

