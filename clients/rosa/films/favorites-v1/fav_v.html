<style>

  box-shadow:0 50px 110px rgba(13,18,37,.28),0 12px 30px rgba(13,18,37,.12),0 0 0 1.5px #ffffff inset,0 0 0 9px #0b0c10 inset}

.status .t{position:absolute;left:44px;top:18px}

.card{position:absolute;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
.pill{display:inline-block;border-radius:20px;font-weight:650;color:#fff}
.tabbar{position:absolute;left:16px;top:764px;width:358px;height:64px;border-radius:32px;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.16);z-index:30}
.bars{display:flex;gap:3px;align-items:flex-end}
.bars i{display:block;border-radius:2px}
.row{position:absolute;left:0;width:390px;height:72px;border-top:1px solid #3e3e4319}
.wind{position:absolute;left:228px;top:9px;width:86px;height:54px;border-radius:10px;background:#0a0b0f08}
.cap{font-size:11px;font-weight:750;letter-spacing:.08em}
.page{position:absolute;top:0;width:390px;height:844px}
.burst{position:absolute;left:12px;top:12px;width:0;height:0}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#11b7f2}
.burst b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2px solid #11b7f2}
#touch{position:absolute;left:-27px;top:-27px;width:54px;height:54px;border-radius:50%;background:rgba(13,18,37,.22);border:2px solid rgba(255,255,255,.95);z-index:80;box-shadow:0 4px 18px rgba(13,18,37,.25)}
#ripple{position:absolute;left:-27px;top:-27px;width:54px;height:54px;border-radius:50%;border:2px solid #11b7f2;z-index:79}
#notif{position:absolute;left:10px;top:12px;width:370px;border-radius:26px;padding:14px 16px;z-index:65;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(13,18,37,.22),0 0 0 1px #0000000a inset}
.fly{position:absolute;left:0;top:0;width:360px;height:108px;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(13,18,37,.14),0 4px 12px rgba(13,18,37,.06),0 0 0 1px #0d122508;padding:16px 20px}
.nm{white-space:nowrap}
.roll{display:inline-flex;overflow:hidden;line-height:1;vertical-align:top}
.roll .col{display:flex;flex-direction:column}
.roll .col span{height:1em;display:block}
</style></head>
<body>
<div id="stage">
 <div id="cam">

   <path id="bsP" d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="#11b7f2" fill-opacity="0" stroke="#11b7f2" stroke-width=".7" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/>

  <!-- S4 counter -->

   <div class="big" style="font-size:200px;display:flex;align-items:center;gap:24px"><span id="cnt">0</span><svg width="150" height="150" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="#11b7f2"/></svg></div>
   <div class="big" style="font-size:50px;margin-top:4px;letter-spacing:-.03em">favorites, <span class="muted">one tap each.</span></div>
  </div>

  <!-- phone -->
  <div id="phone">
   <div id="body"></div>
   <div class="btn" style="left:-3px;top:180px;height:34px"></div>
   <div class="btn" style="left:-3px;top:240px;height:64px"></div>
   <div class="btn" style="left:-3px;top:316px;height:64px"></div>
   <div class="btn" style="right:-3px;top:260px;height:100px"></div>
   <div id="screen">
    <div id="island"></div>
    <div id="spots" class="scr"><div id="strip" class="a" style="left:0;top:0"></div></div>
    <div id="favs" class="scr"><div id="favIn" class="a" style="left:0;top:0;width:390px"></div></div>
    <div id="statusbar" class="status"></div>
    <div id="tabs" class="tabbar"></div>

   </div>
  </div>

  <div id="cyan" class="a" style="background:#11b7f2"></div>

  <!-- end lockup -->
  <div id="end" class="a" style="left:0;top:0;width:1080px;height:1920px">
   <div id="endMark" class="a" style="left:256px;top:824px;width:190px;height:190px"></div>
   <div id="endWord" class="a big" style="left:470px;top:818px;font-size:200px;letter-spacing:-.05em">rosa<span id="endDot" style="color:#11b7f2;display:inline-block">.</span></div>
   <div id="endUrl" class="a hud" style="left:0;width:1080px;top:1110px;text-align:center;font-size:22px;letter-spacing:.5em;color:#0d1225">rosa.surf</div>
   <div id="endSub" class="a hud" style="left:0;width:1080px;top:1160px;text-align:center;font-size:14px;letter-spacing:.4em">Star your spots &middot; free</div>
  </div>
 </div>

 <div id="flash" class="a" style="inset:0;background:#fff;opacity:0"></div>
 <div id="vig" class="a" style="inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(13,18,37,.13) 100%)"></div>
 <canvas id="grain" width="270" height="480" style="width:1080px;height:1920px;opacity:.07;mix-blend-mode:overlay;image-rendering:pixelated"></canvas>

 <div id="hud">
  <div class="a hud" style="left:56px;top:46px"><span style="color:#11b7f2">&#9679;</span>&nbsp; ROSA &nbsp;<span style="opacity:.45">/</span>&nbsp; <span id="scene"></span></div>
  <div class="a hud" id="tc" style="right:56px;top:46px"></div>
  <div class="a hud" id="favHud" style="left:0;width:1080px;top:96px;text-align:center;color:#0d1225"><span style="color:#11b7f2">&#9733;</span> &nbsp;Favorites&nbsp; <span id="favN" style="display:inline-block;min-width:2.2em;text-align:left">00</span></div>
  <div class="a hud" style="left:56px;bottom:44px">rosa.surf</div>
  <div class="a hud" style="right:56px;bottom:44px;opacity:.6">Surf forecast &middot; worldwide</div>
  <svg class="a" width="1080" height="1920" style="left:0;top:0" fill="none" stroke="#0d122540" stroke-width="2">
   <path d="M30 60V30h30M1050 60V30h-30M30 1860v30h30M1050 1860v30h-30"/>
  </svg>
 </div>
</div>

<script src="pts.js"></script>
<script src="lib_v.js"></script>
<script>
const STAR='m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z';
const starSvg=(s,fill,stroke)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="${STAR}" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const RT={Epic:'#0c6733',Good:'#24b161',Fair:'#11b7f2'};
// real Rosa spots (data/spots/*.yaml)
const SP=[
 ['Banzai Pipeline','Hawaii',21.6656,-158.0539,'Epic','1.8-2.4'],
 ['Uluwatu','Bali',-8.8153,115.0875,'Good','1.2-1.5'],
 ['The Point (J-Bay)','South Africa',-34.0257,24.9330,'Epic','1.5-2.1'],
 ['Supertubos','Portugal',39.343,-9.362,'Good','1.4-1.8'],
 ['Snapper Rocks','Gold Coast',-28.1623,153.5487,'Fair','0.9-1.2'],
 ['Chicama','Peru',-7.7010,-79.4462,'Good','1.0-1.4'],
 ['La Graviere','Landes',43.6739,-1.4420,'Epic','1.6-2.2'],
 ['Mundaka','Basque Country',43.4060,-2.6950,'Good','1.3-1.7'],
 ['Upper Trestles','California',33.3885,-117.5975,'Fair','0.8-1.1'],
 ['Bells Beach','Victoria',-38.3693,144.2832,'Good','1.4-1.9'],
 ['Teahupoo','French Polynesia',-17.8667,-149.2537,'Epic','2.0-2.8'],
 ['Anchor Point','Morocco',30.5458,-9.7251,'Good','1.2-1.6'],
];
const N=SP.length;
// favoriting spree: each spot gets a beat, accelerating
const D=[1.05,.82,.64,.52,.44,.38,.34,.31,.29,.28,.27,.27];
const S0=3.98, ST=[];{let s=S0;for(const d of D){ST.push(s);s+=d}}
const TAP=ST.map((s,i)=>s+Math.min(.36,D[i]*.32));
const SW0=ST.map((s,i)=>s+D[i]*.55), SW1=ST.map((s,i)=>s+D[i]*.96);
const TABT=TAP[N-1]+.42; // tap Favorites tab
const FAV0=TABT+.1;

// ---------- status + tabs
$('statusbar').innerHTML=`<div class="t">6:04</div><div class="r">
<svg width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0d1225"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#0d1225"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#0d1225"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0d1225"/></svg>
<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.3 6.8a6.6 6.6 0 0 1 9.4 0l-1.4 1.4a4.6 4.6 0 0 0-6.6 0zM1 4.5a9.9 9.9 0 0 1 14 0l-1.4 1.4a7.9 7.9 0 0 0-11.2 0z" fill="#0d1225"/></svg>
<svg width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0d122588"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="#0d1225"/><rect x="25" y="4.5" width="2" height="4" rx="1" fill="#0d122588"/></svg></div>`;
$('tabs').innerHTML=['home','star','map','swim','user'].map((k,i)=>`<div id="tab${i}" style="position:absolute;left:${358*(i+.5)/5-12}px;top:20px">${ic[k]}</div>`).join('');

// ---------- spot pages
const R0=rng(11);
const days=['Today','Mon','Tue','Wed','Thu','Fri','Sat'];
function page(sp,i){
 const [name,region,,,rat,hr]=sp;const r=rng(100+i);const lo=parseFloat(hr),hi=parseFloat(hr.split('-')[1]);
 const cols=['#0c6733','#24b161','#11b7f2'];
 const dstrip=days.map((d,k)=>{const hs=[0,1,2].map(()=>14+Math.round(r()*24));const cs=hs.map(h=>h>30?'#0c6733':h>20?'#24b161':'#11b7f2');
  const a=(lo*(.7+r()*.5)).toFixed(1),b=(hi*(.8+r()*.5)).toFixed(1);
  return `<div style="width:54px;text-align:center"><div style="margin:0 2px;border-radius:12px;padding:6px 0 8px;${k==0?'background:#1c2137;color:#faf9f7':''}">
   <div style="font-size:12px;font-weight:600;${k==0?'':'color:#17171c80'}">${d}</div><div style="font-size:19px;font-weight:750">${4+k}</div>
   <div style="width:5px;height:5px;border-radius:50%;background:${cs[1]};margin:2px auto 0"></div></div>
   <div style="height:42px;display:flex;justify-content:center;align-items:flex-end;margin-top:8px"><div class="bars">${hs.map((h,j)=>`<i class="bar" style="width:13px;height:${h}px;background:${cs[j]}"></i>`).join('')}</div></div>
   <div style="font-size:11px;font-weight:700;margin-top:6px">${a}-${b}</div></div>`}).join('');
 const winds=[['OFFSHORE','#24b161'],['OFFSHORE','#24b161'],['CROSS','#e48022'],['OFFSHORE','#24b161'],['ONSHORE','#d0574a']];
 const rows=[0,1,2,3,4].map(k=>{const a=(lo+r()*.2).toFixed(1),b=(hi-r()*.2).toFixed(1);const w=winds[(k+i)%5];const per=11+Math.round(r()*8);
  return `<div class="row" style="top:${514+k*72}px">
  <div style="position:absolute;left:4px;top:28px;width:40px;font-size:11px;font-weight:600;transform:rotate(-90deg);color:#17171c90">${String(k*3).padStart(2,'0')}:00</div>
  <div style="position:absolute;left:38px;top:10px;width:5px;height:52px;border-radius:3px;background:${cols[Math.floor(r()*2)]}"></div>
  <div style="position:absolute;left:56px;top:12px;font-size:21px;font-weight:750">${a}-${b}</div><div class="muted" style="position:absolute;left:66px;top:40px;font-size:15px;font-weight:650">${((+a + +b)/2).toFixed(1)} m</div>
  <div style="position:absolute;left:150px;top:12px;font-size:21px;font-weight:750"><span style="font-size:15px">&#8599;</span> ${per}s</div><div class="muted" style="position:absolute;left:170px;top:40px;font-size:13px">${['SW','WSW','W','NW','S'][(i+k)%5]}</div>
  <div class="wind"><div style="position:absolute;left:10px;top:6px;font-size:17px;font-weight:750"><span style="color:${w[1]};font-size:13px">&#9660;</span> ${4+Math.round(r()*12)}</div><div class="cap" style="position:absolute;left:10px;top:32px;color:${w[1]}">${w[0]}</div></div>
  <div style="position:absolute;left:330px;top:12px;font-size:18px;font-weight:750">${200+Math.round(r()*900)}</div><div class="muted" style="position:absolute;left:330px;top:40px;font-size:13px">10${String(Math.round(r()*15)).padStart(2,'0')}</div></div>`}).join('');
 return `<div class="page" style="left:${i*390}px">
 <div style="position:absolute;left:20px;top:62px;font-size:24px;color:#17171c80">&#8249;</div>
 <div style="position:absolute;left:48px;top:60px;display:flex;gap:10px;align-items:center"><span class="nm" style="font-size:21px;font-weight:750">${name}</span>
  <span class="star" style="position:relative;width:24px;height:24px;display:inline-block"><span class="so" style="position:absolute;inset:0;color:#17171c80">${starSvg(24,'none','currentColor')}</span><span class="sf" style="position:absolute;inset:0">${starSvg(24,'#11b7f2','#11b7f2')}</span>
  <span class="burst">${[...Array(8)].map(()=>'<i></i>').join('')}<b></b></span></span></div>
 <div style="position:absolute;right:62px;top:64px;color:#0d1225">${ic.share}</div><div style="position:absolute;right:22px;top:64px">${ic.search}</div>
 <div style="position:absolute;left:6px;top:104px;display:flex">${dstrip}</div>
 <div class="card" style="left:16px;top:252px;width:358px;height:150px">
  <div style="position:absolute;left:16px;top:14px;display:flex;gap:12px;align-items:center"><span class="pill" style="background:${RT[rat]};padding:4px 14px;font-size:16px">${rat}</span><span style="color:#11b7f2;font-weight:650;font-size:15px">Map</span></div>
  <div style="position:absolute;left:16px;top:56px;font-size:14px;line-height:28px"><div><span class="muted">${ic.therm}</span> air ${16+Math.round(r()*12)}&#176;C</div><div><span class="muted">${ic.wave}</span> water ${14+Math.round(r()*13)}&#176;C</div><div><span class="muted">${ic.shirt}</span> ${['3/2 wetsuit','springsuit','boardshorts'][i%3]}</div></div>
  <div style="position:absolute;left:150px;top:14px;bottom:14px;width:1px;background:#3e3e4319"></div>
  <div class="muted" style="position:absolute;left:166px;top:14px;font-size:13px;line-height:24.5px">Size<br>Period<br>Wind<br>Clarity<br>Pollution</div>
  ${[.4+r()*.6,.6+r()*.4,.4+r()*.6,.5+r()*.5].map((v,k)=>`<div style="position:absolute;left:240px;top:${24+k*24.5}px;width:100px;height:6px;border-radius:3px;background:#17171c12"><div style="height:6px;border-radius:3px;background:${k==0?'#11b7f2':'#24b161'};width:${v*100}%"></div></div>`).join('')}
  <div class="muted" style="position:absolute;left:240px;top:112px;font-size:12px">no data</div></div>
 <div style="position:absolute;left:22px;top:420px"><div style="font-size:19px;font-weight:700">Today &middot; Oct 4</div><div class="muted" style="font-size:14px;margin-top:4px">${region}</div></div>
 <div style="position:absolute;right:20px;top:424px;background:#1c2137;color:#faf9f7;border-radius:22px;padding:9px 18px;font-weight:700;font-size:15px">Report</div>
 <div class="muted cap" style="position:absolute;left:60px;top:492px;width:330px;display:flex"><span style="width:96px">SURF M</span><span style="width:76px">SWELL</span><span style="width:92px">WIND KM/H</span><span>KJ HPA</span></div>
 ${rows}</div>`;
}
$('strip').innerHTML=SP.map(page).join('');
const pages=[...document.querySelectorAll('.page')];
const starPos=pages.map(p=>{const s=p.querySelector('.star');return[48+p.querySelector('.nm').offsetWidth+10+12,72]});

// ---------- favorites screen
const order=[0,10,8,5,3,11,6,7,2,1,4,9]; // grouped roughly by ocean, like the app's region groups
$('favIn').innerHTML=`<div style="position:absolute;left:22px;top:66px;font-size:13px;font-weight:750;letter-spacing:.14em" class="muted">FAVORITES</div>
<div style="position:absolute;right:22px;top:62px;font-size:15px;font-weight:700;color:#11b7f2">${N} spots</div>`+
order.map((k,j)=>{const [name,region,,,rat,hr]=SP[k];const r=rng(300+k);
 return `<div class="frow" style="position:absolute;left:16px;top:${100+j*132}px;width:358px">
 <div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.1em;margin:0 0 8px 6px">${region.toUpperCase()}</div>
 <div class="card" style="position:relative;width:358px;height:100px">
  <div style="position:absolute;left:18px;top:14px;font-size:18px;font-weight:650;display:flex;gap:8px;align-items:center">${name} ${starSvg(16,'#11b7f2','#11b7f2')}</div>
