caption: |
  This wave was found on Google Earth.

  Skeleton Bay, Namibia: a left that runs down a sand spit in the desert, for up to two kilometres. Then you walk back, no cars allowed. It only breaks four or five times a year, on a long southwest swell in winter.

  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.
