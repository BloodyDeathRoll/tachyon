name: Skeleton Bay
place: Walvis Bay, Namibia
title: Skeleton Bay, explained
pillar: Spot spotlight
hook: This wave was found on Google Earth
brief: >
  Map film, spot explained. Satellite view of Walvis Bay from high up, then the camera dives to
  the sand spit at Pelican Point. The left is drawn two kilometres down the spit, then the walk
  back, how rarely it breaks and the swell it needs. A surfer's voice tells it; the closing card
  has the glowing button.
