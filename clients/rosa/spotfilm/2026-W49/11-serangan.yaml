caption: 'This surf spot sits on its own island.


  Serangan, once called Turtle Island, is joined to Bali by a causeway. Reef peaks, lefts and rights, for intermediates rather
  than first-timers. November to April is the season.


  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.

