caption: |
  The name loosely means place of skulls.

  A left over coral on the southwest tip of Tahiti Iti. The reef sits half a metre down at most, and the ocean floor drops past a hundred metres right outside it. Best on south to southwest swell, April to October.

  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.
