hook: The name means place of skulls
brief: >
  Map film, spot explained. Satellite view of Tahiti Iti from high up, then the camera dives to the
  reef pass at Teahupo'o. The left is drawn along the reef edge into the pass, then the shallow
  reef and the deep water outside it, the swell it wants, and the Olympics. A surfer's voice tells
  it; the closing card has the glowing button.
