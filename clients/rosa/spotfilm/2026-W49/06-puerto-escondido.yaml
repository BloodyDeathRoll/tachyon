caption: |
  They call this the Mexican Pipeline.

  Playa Zicatela, Puerto Escondido: a beach break with lefts and rights. An underwater canyon points at the northern half of the beach, so the swell arrives at full height. South-southwest swell, northeast wind, mornings. Not for beginners.

  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.
