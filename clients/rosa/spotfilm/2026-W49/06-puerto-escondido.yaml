hook: They call this the Mexican Pipeline
brief: >
  Map film, spot explained. Satellite view of the Oaxaca coast from high up, then the camera dives
  to Playa Zicatela. The swell's path up the offshore canyon to the northern half of the beach is
  drawn, then the swell and wind it wants. A surfer's voice tells it; the closing card has the
  glowing button.
