caption: |
  The Superbank is man-made.

  Sand pumped from the Tweed River filled the gaps between the points, and now one right-hander can run two kilometres from Snapper Rocks to Kirra. It likes an east-southeast swell and a light southwest wind. On a good day, five hundred surfers are out there.

  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.
