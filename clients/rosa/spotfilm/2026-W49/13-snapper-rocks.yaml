title: The Superbank, explained
pillar: Spot spotlight
hook: The Superbank is man-made
brief: >
  Map film, spot explained. Satellite view of the southern Gold Coast from high up, then the camera
  dives to Snapper Rocks. The sand's path from the Tweed River to the point is drawn, then the
  right-hander down the Superbank, two kilometres from Snapper to Kirra, the swell and wind it
  likes and the crowd. A surfer's voice tells it; the closing card has the glowing button.
