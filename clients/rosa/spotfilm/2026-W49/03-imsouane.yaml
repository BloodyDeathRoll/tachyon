caption: 'One wave, 300 metres.


  Imsouane Bay, Morocco: a right-hand point for total beginners and longboarders. No long paddle, you hop off a few rocks
  by the village. Peak season November to March.


  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.

