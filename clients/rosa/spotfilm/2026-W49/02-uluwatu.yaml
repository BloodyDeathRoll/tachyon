caption: |
  Uluwatu means land's end rock.

  One long left over coral on the southwest corner of the Bukit. Five sections, from The Peak to the Bombie, and a cave to paddle out through. Southwest swell, southeast wind, May to October.

  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.
