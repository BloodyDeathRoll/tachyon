hook: The name means land's end rock
brief: >
  Map film, spot explained. Satellite view of Bali's Bukit from high up, then the camera dives to
  Uluwatu. The left is drawn along the cliff, the five sections listed, the cave marked, then the
  swell and wind it wants. A surfer's voice tells it; the closing card has the glowing button.
