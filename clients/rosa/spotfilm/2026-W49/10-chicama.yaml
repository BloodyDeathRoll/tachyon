caption: |
  They call Chicama the longest wave in the world.

  A left point in northern Peru, spotted from a plane in 1966. Four sections, nearly four kilometres from the point to the pier, and you usually need a few waves to ride it all. South and southwest swell, April to October. The wave is protected by law.

  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.
