hook: They call it the longest wave in the world
brief: >
  Map film, spot explained. Satellite view of the north Peru coast from high up, then the camera
  dives to the headland at Puerto Malabrigo. The left is drawn from the tip of the point to the
  pier, nearly four kilometres, with its four sections, the swell it runs on and the law that
  protects it. A surfer's voice tells it; the closing card has the glowing button.
