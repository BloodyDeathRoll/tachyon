caption: |
  Jeffreys Bay is eight sections in a row.

  A very long, very fast right-hand point. Supertubes is the best part, about 300 metres of it, and on a rare day the whole point links up for over a kilometre. Winter is the season, June to August, on a southwest swell.

  Over 5,000 spots, 16 days out, four updates a day. Free at rosa.surf, link in bio.
