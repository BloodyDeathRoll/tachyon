brief: >
  Map film, spot explained. Satellite view of the bay from high up, then the camera dives to the
  point at Jeffreys Bay. The right is drawn down the point, Supertubes marked, then the full
  link-up of over a kilometre and the swell and wind of the winter season. A surfer's voice tells
  it; the closing card has the glowing button.
