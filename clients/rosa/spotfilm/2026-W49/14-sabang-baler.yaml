caption: 'Surfing in Baler started with a film crew.


  Apocalypse Now was shot here in 1976, and the crew left surfboards behind for the locals. Today Sabang Beach is the spot
  for total beginners, in season September to early March. Spot card 07, with this week''s forecast on the back.


