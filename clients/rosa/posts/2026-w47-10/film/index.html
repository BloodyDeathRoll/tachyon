<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #01040f; }
body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#clip { position: absolute; inset: 0; overflow: hidden; }
video { position: absolute; left: 0; top: 0; width: 1600px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
#dawn, #tint, #shade, #glow, #green { position: absolute; inset: 0; }
#dawn { background: linear-gradient(180deg, rgba(255,150,70,.9) 0%, rgba(255,110,120,.5) 28%, rgba(17,183,242,.12) 60%, rgba(3,42,250,.3) 100%); mix-blend-mode: soft-light; }
#tint { background: linear-gradient(180deg, #0a1f8f 0%, #031046 50%, #01040f 100%); mix-blend-mode: multiply; }
#glow { background: radial-gradient(70% 40% at 50% 72%, rgba(17,183,242,.3), rgba(17,183,242,0) 70%), radial-gradient(50% 30% at 50% 100%, rgba(3,42,250,.45), rgba(3,42,250,0) 70%); }
#green { background: radial-gradient(60% 38% at 50% 38%, rgba(36,177,97,.55), rgba(36,177,97,0) 72%); }
#pt { position: absolute; left: 0; top: 646px; mix-blend-mode: screen; pointer-events: none; }
#fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; pointer-events: none; opacity: 0; }
#lines { position: absolute; inset: 0; pointer-events: none; }

.h { font-weight: 850; letter-spacing: -0.05em; line-height: 1; }
.mask { overflow: hidden; padding-bottom: .12em; }
.mask > span { display: inline-block; }
#hook { position: absolute; left: 65px; top: 0; width: 950px; font-size: 200px; transform-origin: 0 0; }
#hook .ln { display: flex; gap: .22em; height: 214px; white-space: nowrap; }
.gloss { background: linear-gradient(100deg, #fff 0%, #fff 40%, #8fe3ff 47%, #fff 50%, #c9f2ff 53%, #fff 60%, #fff 100%); background-size: 320% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; }

#rig { position: absolute; left: 0; top: 0; transform-origin: 0 0; perspective: 3000px; }
#dev { position: relative; padding: 22px; border-radius: 142px; transform-style: preserve-3d; transform-origin: 50% 40%;
  background: linear-gradient(150deg, #3a4150, #0b0e14 30%, #262c38 60%, #07090d); }
#screen { position: relative; width: 1170px; height: 2532px; overflow: hidden; border-radius: 120px; background: #000; }
#scroll { position: absolute; left: 0; top: 0; width: 1170px; }
.sl { position: absolute; left: 0; width: 1170px; background: url(spot-supertubos-w47-full.png) no-repeat; background-size: 1170px 4659px; }
#grey { position: absolute; background: url(spot-supertubos-w47-full.png) no-repeat; background-size: 1170px 4659px; filter: grayscale(1) brightness(.75); }
#pill { position: absolute; background: url(spot-supertubos-w47-full.png) no-repeat; background-size: 1170px 4659px; }
#rows { position: absolute; left: 24px; width: 1122px; border-radius: 40px; pointer-events: none; }
#nav { position: absolute; background: url(spot-supertubos-w47-full.png) no-repeat; background-size: 1170px 4659px; }
#glare { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.16) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; }

#slab { position: absolute; left: -40px; width: 1160px; height: 230px; background: #032afa; transform-origin: 0 50%;
  box-shadow: 0 40px 120px rgba(3,42,250,.5); overflow: hidden; }
#slab .h { position: absolute; left: 105px; top: 38px; font-size: 140px; white-space: nowrap; }

#go { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; font-weight: 900; font-size: 520px; letter-spacing: -0.06em; line-height: 1;
  transform-origin: 50% 50%; white-space: nowrap; }

#end { position: absolute; left: 65px; width: 950px; display: flex; flex-direction: column; align-items: center; text-align: center; }
#btn { margin-top: 130px; padding: 32px 100px 38px; border-radius: 999px; background: #11b7f2; color: #fff; font-weight: 800; font-size: 64px; letter-spacing: -0.01em; }
</style></head>
<body>
<div id="clip">
  <video id="v" src="310248_large.mp4" muted playsinline preload="auto"></video>
  <div id="dawn"></div>
  <div id="tint"></div>
  <div id="shade"></div>
  <div id="glow"></div>
  <div id="green"></div>
</div>
<svg id="lines" viewBox="0 0 1080 1920"></svg>
<canvas id="pt" width="1080" height="1274"></canvas>

<div id="hook" class="h">
  <div class="ln"><div class="mask"><span id="w1">Worth</span></div><div class="mask"><span id="w2">the</span></div></div>
  <div class="ln"><div class="mask"><span id="w3" class="gloss">drive?</span></div></div>
</div>

<div id="rig"><div id="dev">
  <div id="screen">
    <div id="scroll"><div class="sl" id="slA"></div><div class="sl" id="slB"></div>
      <div id="rows"></div><div id="grey"></div><div id="pill"></div></div>
    <div id="nav"></div>
    <div id="glare"></div>
  </div>
</div></div>

<div id="slab"><div class="h" id="slabT">Night before.</div></div>
<div id="go">Go</div>

<div id="end">
  <img id="logo" src="rosa-icon.svg" style="width:170px; height:170px">
  <div id="e1" class="h" style="font-size:104px; letter-spacing:-0.035em; line-height:1.08; margin-top:56px; color:#fff">Know before<br>you drive.</div>
  <div id="btn">rosa.surf</div>
  <div id="e3" style="font-size:52px; font-weight:600; margin-top:46px; color:#fff">link in bio</div>
</div>
<svg id="fx" viewBox="0 0 1080 1920"></svg>
<div id="flash"></div>

<script>
const variant = new URLSearchParams(location.search).get("variant") === "story" ? "story" : "reel";
const SAFE_TOP = variant === "story" ? 269 : 285;
const $ = (id) => document.getElementById(id);

// ── easing ──
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
const smooth = (x) => x * x * (3 - 2 * x);
const outExpo = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const inExpo = (x) => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const outBack = (x, s = 1.6) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const bump = (t, a, b) => { const k = seg(t, a, b); return k > 0 && k < 1 ? Math.sin(Math.PI * k) : 0; };
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1e6) / 1e6; };

// ── timeline (s), paced to the VO from 0.5 s: "Dude, is it worth the drive?" ~0.5-2.3 · "I just check Rosa the
// night before." ~2.6-4.7 · "Green tomorrow morning?" ~5.0-6.4 · "I'm already packing the car!" ~6.7-8.6 ──
const T = { punch: [2.3, 2.85], slab: 3.0, scroll: [4.25, 5.15], green: 5.3, go: 5.75, exit: [7.0, 7.6], goOut: [8.45, 8.85], end: 8.9, dur: 15 };

// ── live capture: rosa.surf/spot/supertubos?theme=dark, full page, 2026-11-10, 1170 x 4659. The app's nav is baked
// in at rows NAV; the page is cut there and the nav is laid on top, fixed, so it never scrolls with the list ──
const NAV = { x: 50, y: 2294, w: 1070, h: 192 };
const CUT = [2294, 2530];                         // rows the nav covers (the 12:00 row under it)
const PILL = { x: 92, y: 716, w: 166, h: 76 };    // the "Good" rating pill
const ROWS = { y: 1910, h: 384 };                 // 06:00 + 09:00, the morning
const SCROLL = 560;
const bgAt = (el, x, y, w, h) => Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", backgroundPosition: `${-x}px ${-y}px` });
Object.assign($("slA").style, { top: "0px", height: CUT[0] + "px", backgroundPosition: "0 0" });
Object.assign($("slB").style, { top: CUT[0] + "px", height: 4659 - CUT[1] + "px", backgroundPosition: `0 ${-CUT[1]}px` });
bgAt($("nav"), NAV.x, NAV.y, NAV.w, NAV.h);
$("nav").style.borderRadius = NAV.h / 2 + "px";
bgAt($("pill"), PILL.x, PILL.y, PILL.w, PILL.h); $("pill").style.borderRadius = PILL.h / 2 + "px";
bgAt($("grey"), PILL.x, PILL.y, PILL.w, PILL.h); $("grey").style.borderRadius = PILL.h / 2 + "px";
Object.assign($("rows").style, { top: ROWS.y + "px", height: ROWS.h + "px" });

// ── Rosa particles: the app's splash field (rosa/web particles.ts + splash: palette, density 1.4,
// speed 1, alpha .3, 460 css px band) made a pure function of t ──
const BW = 390, BH = 460;
const NP = Math.round(BW * BH / 11000 * 1.4);
const PAL = ["125, 185, 240", "94, 205, 205"];
const SLOTS = Array.from({ length: NP }, (_, i) => ({ life: 4 * (0.8 + hash("l" + i) * 0.4), off: hash("o" + i) * 4 }));
function particles(cv, t, o, { glow = true, gain = 1 } = {}) {
  const c = cv.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  cv.style.opacity = o;
  if (o <= 0) return;
  const CSS = cv.width / BW;
  c.setTransform(CSS, 0, 0, CSS, 0, 0);
  if (glow) {
    let g = c.createRadialGradient(BW * .18, BH * 1.3, 0, BW * .18, BH * 1.3, BH * 1.0);
    g.addColorStop(0, "rgba(22,51,122,.55)"); g.addColorStop(.72, "rgba(22,51,122,0)");
    c.fillStyle = g; c.fillRect(0, 0, BW, BH);
    g = c.createRadialGradient(BW * .82, BH * 1.2, 0, BW * .82, BH * 1.2, BH * .9);
    g.addColorStop(0, "rgba(13,148,136,.4)"); g.addColorStop(.7, "rgba(13,148,136,0)");
    c.fillStyle = g; c.fillRect(0, 0, BW, BH);
  }
  const ps = [];
  SLOTS.forEach(({ life, off }, i) => {
    const k = Math.floor((t + off) / life), age = t + off - k * life, f = age * 60;
    const r = (s) => hash(s + i + "-" + k);
    const depth = Math.pow(r("d"), 0.85), rad = 0.5 + depth * (3.2 - 0.5), blur = (1 - depth) * 4.5;
    const vy = -(0.24 + depth * 1.4), vx = (r("v") - 0.5) * (0.05 + depth * 0.28);
    const ph = r("p") * 6.283, ws = 0.004 + r("w") * 0.012, wa = 0.05 + depth * 0.4;
    const x = r("x") * BW + vx * f + (wa / ws) * (Math.cos(ph) - Math.cos(ph + ws * f));
    const y = BH + r("y") * 30 + vy * f;
    const tw = r("t") * 6.283 + (0.008 + r("s") * 0.025) * f;
    const lf = age / life, env = lf < .15 ? lf / .15 : lf > .7 ? (1 - lf) / .3 : 1;
    const a = clamp((0.22 + depth * 0.7) * 0.3 * gain * Math.min(1, (BH - y) / 80) * Math.min(1, y / (BH * .55)) * (0.75 + Math.sin(tw) * .25) * env);
    if (a > 0.002 && y > -10) ps.push({ x, y, rad, depth, bucket: Math.round(blur), a, col: PAL[Math.floor(r("c") * PAL.length)] });
  });
  ps.sort((p, q) => p.depth - q.depth);
  const dot = (p, rad, blur, a) => {
    c.filter = blur ? `blur(${blur / 2 * CSS}px)` : "none";
    c.globalAlpha = a; c.fillStyle = `rgb(${p.col})`;
    c.beginPath(); c.arc(p.x, p.y, rad, 0, 6.283); c.fill();
  };
  for (const p of ps) if (p.bucket === 0 && p.rad > 1.4) dot(p, p.rad * 2.6, 8, p.a * .55);
  for (const p of ps) dot(p, p.rad, p.bucket, p.a);
  c.filter = "none"; c.globalAlpha = 1;
}

// ── footage: seek and wait for the frame; ping-pong so the water never freezes or jumps ──
function seekVideo(v, s) {
  const d = (v.duration || 30) - 0.1, m = s % (2 * d);
  s = m < d ? m : 2 * d - m;
  if (v.readyState >= 2 && Math.abs(v.currentTime - s) < 1e-3) return Promise.resolve();
  return new Promise((res) => {
    const done = () => { v.removeEventListener("seeked", done); res(); };
    v.addEventListener("seeked", done);
    v.currentTime = s;
  });
}
const loaded = (v) => v.readyState >= 1 ? Promise.resolve() : new Promise((r) => v.addEventListener("loadedmetadata", r, { once: true }));

// ── device pose: rig = translate(X, Y) scale(S); 1214 x 2576 outer, nearly full frame ──
const S = .665, DW = 1214 * S, PX = 540 - DW / 2, PY = 200;
// a point on the page (screen px, before scroll) in frame coords, ignoring the small 3D sway
const onScreen = (x, y, sc, ox, oy) => [ox + sc * (22 + x), oy + sc * (22 + y)];

async function seek(t) {
  let fx = "", lines = "";

  // ── 1. sunrise drive: the clip pans across hard and settles, then cools to Rosa blue behind the app ──
  const v = $("v");
  const pan = outExpo(seg(t, 0, 2.2));
  const blue = smooth(seg(t, T.punch[0], T.punch[1] + .4)) * (1 - .3 * smooth(seg(t, T.exit[0], T.exit[1] + .4)));
  const tail = smooth(seg(t, T.end - .3, T.end + .6));
  v.style.transform = `translateX(${lerp(-60, -440, pan) - 30 * sine(seg(t, 2.2, T.dur))}px) scale(${lerp(1.18, 1.06, pan) + .06 * sine(seg(t, T.exit[0], T.dur))})`;
  v.style.filter = `blur(${(1 - outExpo(seg(t, 0, .9))) * 14 + 10 * blue + 4 * tail}px) saturate(${1.35 - .3 * blue}) brightness(${1.12 - .15 * blue}) contrast(1.08)`;
  $("dawn").style.opacity = clamp(1 - .75 * blue - .8 * tail);
  $("tint").style.opacity = .72 * blue + .5 * tail;
  $("shade").style.background = `linear-gradient(180deg, rgba(1,4,15,${.25 + .4 * blue}) 0%, rgba(1,4,15,${.05 + .3 * blue}) 45%, rgba(1,4,15,${.25 + .35 * blue + .2 * tail}) 100%)`;
  $("glow").style.opacity = blue + .8 * tail;
  // speed streaks across the pan
  const sp = 1 - seg(t, .2, 1.6);
  if (sp > 0) for (let i = 0; i < 14; i++) {
    const y = 200 + hash("ly" + i) * 1500, len = 300 + hash("ll" + i) * 600, x = 1300 - ((t * 2600 + hash("lx" + i) * 2000) % 2600);
    lines += `<rect x="${x}" y="${y}" width="${len}" height="${2 + hash("lh" + i) * 4}" rx="3" fill="#fff" opacity="${.35 * sp * hash("lo" + i)}"/>`;
  }

  // ── 2. hook: words slam up through masks, then blow out as the app punches in ──
  const word = (id, a) => { const k = outBack(seg(t, a, a + .42), 1.5); $(id).style.transform = `translateY(${(1 - k) * 118}%) rotate(${(1 - outExpo(seg(t, a, a + .5))) * 8}deg)`; };
  word("w1", .55); word("w2", .8); word("w3", 1.15);
  $("w3").style.backgroundPosition = `${lerp(100, 0, sine(seg(t, 1.6, 2.2)))}% 0`;
  const ho = inExpo(seg(t, T.punch[0] - .15, T.punch[0] + .25));
  const hk = $("hook");
  hk.style.transform = `translate(0px, ${SAFE_TOP + 330}px) scale(${1 + .5 * ho})`;
  hk.style.opacity = 1 - ho;
  hk.style.filter = `blur(${ho * 16}px)`;
  hk.style.visibility = ho >= 1 ? "hidden" : "visible";

  // ── 3. the dark Supertubos page punches in big ──
  const pu = seg(t, T.punch[0], T.punch[1]), pk = outBack(pu, 1.2);
  const ex = seg(t, T.exit[0], T.exit[1]), exk = inExpo(ex);
  const gp = smooth(seg(t, T.go - .05, T.go + .5)) * (1 - ex);       // pushed back while "Go" owns the frame
  const sc = S * lerp(1.7, 1, pk) * (1 - .1 * gp);
  const ox = 540 - 1214 * sc / 2, oy = PY + (1 - pk) * -260 + 2400 * exk + 60 * gp;
  $("rig").style.transform = `translate(${ox}px, ${oy}px) scale(${sc})`;
  const drift = smooth(seg(t, T.punch[1], T.punch[1] + .6));
  const rx = lerp(30, 0, outExpo(pu)) + drift * 4 * Math.sin(t * 1.1) + 30 * exk;
  const ry = lerp(-18, 0, outExpo(pu)) + drift * 7 * Math.sin(t * .8 + .6);
  const rz = lerp(-5, 0, outExpo(pu)) + drift * 1.2 * Math.sin(t * .7) - 14 * exk;
  $("dev").style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  $("dev").style.boxShadow = `inset 0 0 0 3px rgba(255,255,255,.22), 0 120px 220px rgba(0,0,20,.7), 0 0 ${180 + 120 * gp}px rgba(${gp > 0 ? "36,177,97" : "17,183,242"},${.3 + .2 * gp})`;
  $("dev").style.filter = pu < 1 ? `blur(${(1 - smooth(pu)) * 18}px)` : exk > 0 ? `blur(${exk * 16}px)` : gp > 0 ? `brightness(${1 - .45 * gp}) blur(${3 * gp}px)` : "none";
  $("rig").style.opacity = clamp(pu * 4) * (1 - smooth(seg(ex, .5, 1)));
  $("rig").style.visibility = t < T.punch[0] || ex >= 1 ? "hidden" : "visible";
  $("glare").style.backgroundPosition = `${lerp(150, -50, seg(t, 2.6, 4.2))}% 0`;
  if (pu > 0 && pu < 1) {   // shockwave off the impact
    const q = outExpo(pu);
    fx += `<circle cx="540" cy="900" r="${200 + 900 * q}" fill="none" stroke="#11b7f2" stroke-width="${30 * (1 - q)}" opacity="${1 - q}"/>`;
  }

  // ── 4. scroll to the morning; the list moves, the nav stays put ──
  const sk = inOut(seg(t, T.scroll[0], T.scroll[1]));
  $("scroll").style.transform = `translateY(${-SCROLL * sk}px)`;
  const rw = smooth(seg(t, T.scroll[1] - .15, T.scroll[1] + .3)) * (1 - smooth(seg(t, T.go + .2, T.go + .6)));
  $("rows").style.boxShadow = `inset 0 0 0 ${8 * rw}px rgba(36,177,97,${rw}), 0 0 ${90 * rw}px rgba(36,177,97,${.6 * rw})`;

  // ── 5. the rating pill turns green and pops ──
  const gk = seg(t, T.green, T.green + .35);
  $("grey").style.opacity = 1 - smooth(gk);
  const pp = Math.sin(Math.PI / 2 * clamp(seg(t, T.green, T.green + .5) * 2)) * (1 - smooth(seg(t, T.go + .3, T.go + .8)));
  const pill = $("pill");
  pill.style.transform = `scale(${1 + .5 * pp}) rotate(${-5 * pp}deg)`;
  pill.style.boxShadow = `0 ${24 * pp}px ${60 * pp}px rgba(0,0,0,${.4 * pp}), 0 0 ${140 * pp}px rgba(36,177,97,${pp})`;
  pill.style.zIndex = 2;
  Object.assign($("grey").style, { zIndex: 3, transform: pill.style.transform });
  const [pcx, pcy] = onScreen(PILL.x + PILL.w / 2, PILL.y + PILL.h / 2 - SCROLL * sk, sc, ox, oy);
  if (gk > 0 && gk < 1) [0, 1].forEach((j) => {
    const q = outExpo(clamp(gk * 1.1 - j * .15));
    fx += `<circle cx="${pcx}" cy="${pcy}" r="${30 + 260 * q}" fill="none" stroke="${j ? "#fff" : "#24b161"}" stroke-width="${(j ? 4 : 12) * (1 - q) + 1}" opacity="${1 - q}"/>`;
  });

  // ── 6. "Go" bursts out of the pill in huge white type ──
  const gi = seg(t, T.go, T.go + .55), gik = outBack(gi, 1.3);
  const go = $("go");
  const GY = SAFE_TOP + 240;     // cap box of the word inside the safe area
  const gcx = 540, gcy = GY + 260;
  const goOut = inExpo(seg(t, T.goOut[0], T.goOut[1]));
  const gx = lerp(pcx, gcx, outExpo(gi)), gy = lerp(pcy, gcy, outExpo(gi));
  const breathe = 1 + .03 * Math.sin((t - T.go) * 4) * smooth(seg(t, T.go + .5, T.go + 1));
  go.style.transform = `translate(${gx - 540}px, ${gy - 260}px) scale(${lerp(.08, 1, gik) * breathe * (1 + 5 * goOut)}) rotate(${(1 - outExpo(gi)) * -14}deg)`;
  go.style.top = "0px";
  go.style.opacity = clamp(gi * 6) * (1 - goOut);
  go.style.filter = goOut > 0 ? `blur(${goOut * 30}px)` : "none";
  go.style.textShadow = `0 0 60px rgba(36,177,97,.9), 0 0 160px rgba(36,177,97,.6), 0 30px 80px rgba(0,0,0,.4)`;
  go.style.visibility = gi > 0 && goOut < 1 ? "visible" : "hidden";
  $("green").style.opacity = smooth(seg(t, T.go, T.go + .4)) * (1 - smooth(seg(t, T.goOut[0], T.goOut[1])));
  if (gi > 0 && gi < 1) [0, 1, 2].forEach((j) => {
    const q = outExpo(clamp(gi * 1.2 - j * .12));
    fx += `<circle cx="${gcx}" cy="${gcy}" r="${120 + (520 + 120 * j) * q}" fill="none" stroke="${j === 1 ? "#fff" : "#24b161"}" stroke-width="${(j === 1 ? 6 : 22) * (1 - q) + 1}" opacity="${1 - q}"/>`;
  });
  // burst rays, the "packing the car" energy
  const ry2 = seg(t, T.go + .05, T.go + .75);
  if (ry2 > 0 && ry2 < 1) for (let i = 0; i < 16; i++) {
    const a = i / 16 * 6.283 + hash("ra" + i) * .3, q = outExpo(ry2), r0 = 200 + 300 * q, r1 = r0 + 160 * (1 - q) + 40;
    fx += `<line x1="${gcx + Math.cos(a) * r0}" y1="${gcy + Math.sin(a) * r0}" x2="${gcx + Math.cos(a) * r1}" y2="${gcy + Math.sin(a) * r1}" stroke="#fff" stroke-width="${10 * (1 - q) + 1}" stroke-linecap="round" opacity="${1 - ry2}"/>`;
  }

  // ── 7. "Night before." on a tile-blue slab across the lower half ──
  const lk = seg(t, T.slab, T.slab + .55), lo = inExpo(seg(t, T.scroll[0] - .2, T.scroll[0] + .2));
  const slab = $("slab");
  slab.style.top = 1248 - 230 - 40 + "px";
  slab.style.transform = `translateX(${(1 - outExpo(lk)) * -1200 + lo * 1300}px) skewY(-4deg)`;
  slab.style.visibility = lk > 0 && lo < 1 ? "visible" : "hidden";
  $("slabT").style.transform = `translateX(${(1 - outExpo(seg(t, T.slab + .12, T.slab + .7))) * -500}px)`;

  // ── 8. flashes on the hits ──
  $("flash").style.opacity = .45 * bump(t, T.punch[0] - .05, T.punch[0] + .25) + .35 * bump(t, T.go - .05, T.go + .25) + .4 * bump(t, T.goOut[1] - .2, T.goOut[1] + .2);

  // ── 9. Rosa particles rise in the free space once the app is gone ──
  particles($("pt"), t, smooth(seg(t, T.exit[0] + .2, T.exit[1] + .6)), { gain: 3.2 });

  // ── 10. end card ──
  const E = T.end;
  $("end").style.top = SAFE_TOP + 70 + "px";
  const lg = seg(t, E, E + .8);
  $("logo").style.transform = `scale(${lerp(.3, 1, outBack(lg))}) rotate(${(1 - outExpo(lg)) * -25}deg)`;
  $("logo").style.opacity = clamp(lg * 3);
  const rise = (el, a) => { const k = outExpo(seg(t, a, a + .8)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 70}px)`; el.style.filter = `blur(${(1 - k) * 10}px)`; };
  rise($("e1"), E + .2); rise($("btn"), E + .6); rise($("e3"), E + .8);
  const gl = 34 + 12 * Math.sin(t * 2.6);
  $("btn").style.boxShadow = `0 0 ${gl}px rgba(17,183,242,.75), 0 0 ${gl * 2.4}px rgba(17,183,242,.35)`;
  $("end").style.visibility = t < E ? "hidden" : "visible";
  if (lg > 0 && lg < 1) {
    const q = outExpo(lg);
    fx += `<circle cx="540" cy="${SAFE_TOP + 155}" r="${80 + 440 * q}" fill="none" stroke="#11b7f2" stroke-width="${14 * (1 - lg)}" opacity="${1 - lg}"/>`;
  }

  $("fx").innerHTML = fx;
  $("lines").innerHTML = lines;
  await document.fonts.ready;
  await loaded(v);
  await seekVideo(v, .3 + t * .7);
}
window.__film = { seek, duration: T.dur };
</script>
</body></html>
