<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #020c2a; }
body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0;
  background: radial-gradient(110% 60% at 20% 0%, #1f4dff 0%, rgba(3,42,250,0) 60%),
              radial-gradient(90% 50% at 100% 100%, rgba(17,183,242,.55) 0%, rgba(17,183,242,0) 65%),
              linear-gradient(180deg, #032afa 0%, #0a1f8f 48%, #020c2a 100%); }
#photo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 50% 40%; }
video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; object-position: 24% 50%; }
#shade { position: absolute; inset: 0; }
#pt { position: absolute; left: 0; top: 646px; mix-blend-mode: screen; pointer-events: none; }
#rig { position: absolute; left: 0; top: 0; transform-origin: 0 0; perspective: 2600px; }
#phone { position: relative; padding: 36px; border-radius: 150px; transform-style: preserve-3d; transform-origin: 50% 40%;
  background: linear-gradient(145deg, #f3f5f9, #b9c1cd 42%, #e6e9ef); }
#screen { position: relative; width: 1170px; height: 2532px; overflow: hidden; border-radius: 114px;
  background: url(spot-uluwatu-w47.png) 0 0 / 1170px 2532px no-repeat; }
.patch { position: absolute; background-image: url(spot-uluwatu-w47.png); background-repeat: no-repeat; }
.trk { position: absolute; border-radius: 99px; background: #ebebee; }
#fx { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; overflow: visible; }
#glare { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.3) 49%, rgba(255,255,255,0) 60%); background-size: 300% 100%; }
.h { font-weight: 800; letter-spacing: -0.045em; line-height: .98; }
.line { overflow: hidden; padding-bottom: .12em; }
.line > span { display: inline-block; }
#hook { position: absolute; left: 65px; width: 950px; font-size: 128px; text-shadow: 0 8px 40px rgba(0,10,40,.45); }
.pill { display: inline-block; padding: .02em .34em .1em; border-radius: 999px; background: #24b161; color: #fff;
  box-shadow: 0 14px 40px rgba(36,177,97,.45); }
.word { position: absolute; left: 65px; width: 950px; }
.word .w { font-size: 240px; font-weight: 850; letter-spacing: -0.055em; line-height: 1; white-space: nowrap;
  text-shadow: 0 16px 60px rgba(0,10,40,.45); }
.word .w > span { display: inline-block; }
.word .bar { position: relative; margin-top: 14px; height: 26px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.word .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
.word .sub { margin-top: 18px; font-size: 58px; font-weight: 700; letter-spacing: -0.02em; }
#sum { position: absolute; left: 65px; width: 950px; height: 150px; border-radius: 75px; background: rgba(13,18,37,.86);
  backdrop-filter: blur(20px); box-shadow: 0 30px 80px rgba(13,18,37,.35);
  display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 70px; font-weight: 800; letter-spacing: -0.035em; }
#sum b { color: #11b7f2; }
#end { position: absolute; left: 65px; width: 950px; display: flex; flex-direction: column; align-items: center; text-align: center; }
#btn { margin-top: 96px; padding: 30px 74px; border-radius: 999px; background: #11b7f2; color: #fff; font-weight: 800; font-size: 50px; letter-spacing: -0.01em; }
</style></head>
<body>
<div id="stage"></div>
<div id="photo">
  <video id="v" src="13772-251867974_large.mp4" muted playsinline preload="auto"></video>
  <div id="shade"></div>
</div>
<canvas id="pt" width="1080" height="1274"></canvas>

<div id="hook" class="h">
  <div class="line"><span id="hk1">Here's why</span></div>
  <div class="line"><span id="hk2">it says <span class="pill">Good</span></span></div>
</div>
<div id="words"></div>

<div id="rig"><div id="phone"><div id="screen">
  <div id="cover"></div>
  <svg id="fx" viewBox="0 0 1170 2532"></svg>
  <div id="glare"></div>
</div></div></div>

<div id="sum"><span>Size</span><b>+</b><span>Period</span><b>+</b><span>Wind</span></div>

<div id="end">
  <img id="logo" src="rosa-icon.svg" style="width:190px; height:190px">
  <div id="e1" class="h" style="font-size:82px; margin-top:52px; letter-spacing:0; white-space:nowrap">Know why it's Good</div>
  <div id="btn">Install it</div>
  <div id="e3" style="font-size:48px; font-weight:600; margin-top:46px">link in bio</div>
</div>

<script>
const variant = new URLSearchParams(location.search).get("variant") === "story" ? "story" : "reel";
const SAFE_TOP = variant === "story" ? 269 : 285;
const $ = (id) => document.getElementById(id);

// ── easing ──
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
const outExpo = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x, s = 1.6) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1e6) / 1e6; };

// ── timeline (s) ──
const T = {
  phoneIn: [1.55, 2.5],
  hookOut: 2.55,
  bars: [2.85, 4.05, 5.25],            // each bar lands on a beat
  pill: 6.45,
  swing: [6.85, 8.0],
  sum: 7.75,
  exit: [9.7, 10.55],
  end: 10.45, dur: 17,
};

// ── the live capture (spot-uluwatu-w47.png, 1170 x 2532, rosa.surf/spot/uluwatu light, 2026-11-10) ──
const BAR_X = 756, BAR_W = 191, BAR_H = 18;
const BARS = [                          // y centre, fill end, colour: as the app drew them
  { name: "Size", y: 741, end: 861, col: "#11b7f2" },
  { name: "Period", y: 813, end: 947, col: "#24b161" },
  { name: "Wind", y: 885, end: 879, col: "#11b7f2", sub: "can only polish" },
];
const PILL = { x: 92, y: 712, w: 180, h: 80 };   // "Good" pill box
const BLANK = [600, 1058];               // an empty stretch of the card, stretched to cover things

// cover: hide a box with blank card
function blank(x, y, w, h) {
  const f = Math.max(w, h) / 16, d = document.createElement("div");
  d.className = "patch";
  Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px",
    backgroundSize: `${1170 * f}px ${2532 * f}px`, backgroundPosition: `${-BLANK[0] * f}px ${-BLANK[1] * f}px` });
  $("cover").appendChild(d); return d;
}
// a piece of the capture, at its own place
function piece(x, y, w, h) {
  const d = document.createElement("div");
  d.className = "patch";
  Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px",
    backgroundSize: "1170px 2532px", backgroundPosition: `${-x}px ${-y}px` });
  $("cover").appendChild(d); return d;
}
BARS.forEach((b, i) => {
  blank(BAR_X - 12, b.y - 16, BAR_W + 24, 32);
  const tr = document.createElement("div");
  tr.className = "trk";
  Object.assign(tr.style, { left: BAR_X + "px", top: b.y - BAR_H / 2 + "px", width: BAR_W + "px", height: BAR_H + "px" });
  $("cover").appendChild(tr);
  b.fill = piece(BAR_X - 8, b.y - 14, BAR_W + 16, 28);   // the app's own bar, revealed left to right

  // the bar's name, huge, above the phone, with its own big bar
  const w = document.createElement("div");
  w.className = "word";
  w.innerHTML = `<div class="w">${[...b.name].map((c) => `<span>${c}</span>`).join("")}</div>
    <div class="bar"><i style="background:${b.col}"></i></div>${b.sub ? `<div class="sub">${b.sub}</div>` : ""}`;
  $("words").appendChild(w);
  b.word = w;
});
blank(PILL.x - 6, PILL.y - 6, PILL.w + 12, PILL.h + 12);
const pill = piece(96, 719, 170, 66);    // the pill itself, edge to edge
pill.style.transformOrigin = "50% 50%";
pill.style.borderRadius = "33px";

// ── Rosa particles: the app's splash field (rosa/web particles.ts + splash: palette, density 1.4,
// speed 1, alpha .3, 460 css px band) made a pure function of t ──
const BW = 390, BH = 460;
const N = Math.round(BW * BH / 11000 * 1.4);
const PAL = ["125, 185, 240", "94, 205, 205"];
const SLOTS = Array.from({ length: N }, (_, i) => ({ life: 4 * (0.8 + hash("l" + i) * 0.4), off: hash("o" + i) * 4 }));
function particles(cv, t, o, { glow = true, gain = 1 } = {}) {
  const c = cv.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  cv.style.opacity = o;
  if (o <= 0) return;
  const CSS = cv.width / BW;
  c.setTransform(CSS, 0, 0, CSS, 0, 0);
  if (glow) {
    let g = c.createRadialGradient(BW * .18, BH * 1.3, 0, BW * .18, BH * 1.3, BH * 1.0);
    g.addColorStop(0, "rgba(22,51,122,.55)"); g.addColorStop(.72, "rgba(22,51,122,0)");
    c.fillStyle = g; c.fillRect(0, 0, BW, BH);
    g = c.createRadialGradient(BW * .82, BH * 1.2, 0, BW * .82, BH * 1.2, BH * .9);
    g.addColorStop(0, "rgba(13,148,136,.4)"); g.addColorStop(.7, "rgba(13,148,136,0)");
    c.fillStyle = g; c.fillRect(0, 0, BW, BH);
  }
  const ps = [];
  SLOTS.forEach(({ life, off }, i) => {
    const k = Math.floor((t + off) / life), age = t + off - k * life, f = age * 60;
    const r = (s) => hash(s + i + "-" + k);
    const depth = Math.pow(r("d"), 0.85), rad = 0.5 + depth * (3.2 - 0.5), blur = (1 - depth) * 4.5;
    const vy = -(0.24 + depth * 1.4), vx = (r("v") - 0.5) * (0.05 + depth * 0.28);
    const ph = r("p") * 6.283, ws = 0.004 + r("w") * 0.012, wa = 0.05 + depth * 0.4;
    const x = r("x") * BW + vx * f + (wa / ws) * (Math.cos(ph) - Math.cos(ph + ws * f));
    const y = BH + r("y") * 30 + vy * f;
    const tw = r("t") * 6.283 + (0.008 + r("s") * 0.025) * f;
    const lf = age / life, env = lf < .15 ? lf / .15 : lf > .7 ? (1 - lf) / .3 : 1;
    const a = clamp((0.22 + depth * 0.7) * 0.3 * gain * Math.min(1, (BH - y) / 80) * Math.min(1, y / (BH * .55)) * (0.75 + Math.sin(tw) * .25) * env);
    if (a > 0.002 && y > -10) ps.push({ x, y, rad, depth, bucket: Math.round(blur), a, col: PAL[Math.floor(r("c") * PAL.length)] });
  });
  ps.sort((p, q) => p.depth - q.depth);
  const dot = (p, rad, blur, a) => {
    c.filter = blur ? `blur(${blur / 2 * CSS}px)` : "none";
    c.globalAlpha = a; c.fillStyle = `rgb(${p.col})`;
    c.beginPath(); c.arc(p.x, p.y, rad, 0, 6.283); c.fill();
  };
  for (const p of ps) if (p.bucket === 0 && p.rad > 1.4) dot(p, p.rad * 2.6, 8, p.a * .55);
  for (const p of ps) dot(p, p.rad, p.bucket, p.a);
  c.filter = "none"; c.globalAlpha = 1;
}

// ── footage: seek and wait for the frame ──
function seekVideo(v, s) {
  s = Math.max(0, Math.min(s, (v.duration || 30) - 0.05));
  if (v.readyState >= 2 && Math.abs(v.currentTime - s) < 1e-3) return Promise.resolve();
  return new Promise((res) => {
    const done = () => { v.removeEventListener("seeked", done); res(); };
    v.addEventListener("seeked", done);
    v.currentTime = s;
  });
}
const loaded = (v) => v.readyState >= 1 ? Promise.resolve() : new Promise((r) => v.addEventListener("loadedmetadata", r, { once: true }));

// a line slides up out of its mask, blur to sharp; leaves upward
function rise(el, t, a, b, d = .7) {
  const i = outExpo(seg(t, a, a + d)), o = 1 - inOut(seg(t, b - .35, b));
  el.style.transform = `translateY(${(1 - i) * 105 + (1 - o) * -110}%)`;
  el.style.opacity = Math.min(i * 1.4, 1 - seg(t, b - .2, b));
  el.style.filter = `blur(${(1 - i) * 10 + (1 - o) * 6}px)`;
}

// ── fx (capture px): glow ring + sparks where something lands ──
let fx = "";
function burst(x, y, k, col, big = 1) {
  if (k <= 0 || k >= 1) return;
  const e = outExpo(k);
  fx += `<circle cx="${x}" cy="${y}" r="${(30 + 150 * e) * big}" fill="none" stroke="${col}" stroke-width="${14 * (1 - k)}" opacity="${1 - k}"/>`;
  for (let i = 0; i < 12; i++) {
    const a = hash("sa" + i + col) * 6.283, d = (60 + hash("sd" + i) * 170) * outCubic(k) * big;
    fx += `<circle cx="${x + Math.cos(a) * d}" cy="${y + Math.sin(a) * d}" r="${8 * (1 - k) * (0.6 + hash("sr" + i))}" fill="${col}" opacity="${1 - k}"/>`;
  }
}

// ── phone poses: rig = translate(X, Y) scale(S); a capture point (cx, cy) lands at X + (36 + cx) S ──
const at = (cx, cy, sx, sy, S) => ({ S, X: sx - (36 + cx) * S, Y: sy - (36 + cy) * S });
const PA = { S: .78, X: (1080 - 1242 * .78) / 2, Y: 690 };
const PIN = { ...PA, Y: 2050 };
const PB = { S: .88, X: -40, Y: 690 };
const PC = at(600, 860, 540, 1100, 1.0);   // the whole rating card (pill + bars) edge to edge, nothing cut
const PD = { S: .62, X: (1080 - 1242 * .62) / 2, Y: 2150 };
const mix = (P, Q, k) => ({ S: lerp(P.S, Q.S, k), X: lerp(P.X, Q.X, k), Y: lerp(P.Y, Q.Y, k) });

async function seek(t) {
  fx = "";

  // ── 1. footage runs full screen the whole film, dims under the phone, blurs behind the end card ──
  const ex = inOut(seg(t, T.exit[0], T.exit[1]));
  const drift = sine(seg(t, 0, T.dur));
  $("photo").style.transform = `scale(${lerp(1.08 + .1 * drift, 1.2, ex)})`;
  $("photo").style.filter = `blur(${ex * 8}px)`;
  const dim = .1 + .25 * seg(t, .9, T.phoneIn[1]) + ex * .1;
  $("shade").style.background = `linear-gradient(180deg, rgba(2,12,42,${dim + .35}) 0%, rgba(2,12,42,${dim}) 45%, rgba(2,12,42,${dim + .15}) 100%)`;

  // hook over the footage
  $("hook").style.top = SAFE_TOP + 20 + "px";
  rise($("hk1"), t, .1, T.hookOut, .7);
  rise($("hk2"), t, .3, T.hookOut + .1, .7);

  // ── 2. the phone slides up into the bottom two thirds, then creeps in on the bars ──
  const pin = outExpo(seg(t, T.phoneIn[0], T.phoneIn[1]));
  const push = sine(seg(t, T.phoneIn[1], T.pill));
  const sw = inOut(seg(t, T.swing[0], T.swing[1]));
  let P = mix(mix(PIN, PA, pin), PB, push);
  P = mix(P, PC, sw);
  P = mix(P, PD, ex);
  // beat kicks: every landing nudges the phone
  let kick = 0;
  [...T.bars.map((b) => b + .3), T.pill].forEach((b) => { const k = seg(t, b, b + .4); if (k > 0 && k < 1) kick += Math.sin(Math.PI * k) * (1 - k); });
  const kS = 1 + .02 * kick;
  $("rig").style.transform = `translate(${P.X - 621 * P.S * (kS - 1)}px, ${P.Y - 1302 * P.S * (kS - 1)}px) scale(${P.S * kS})`;
  const swing = Math.sin(Math.PI * seg(t, T.swing[0], T.swing[1] + .25));
  const rx = lerp(38, 5, pin) * (1 - sw) + Math.sin(t * .7) * 1.5 * (1 - sw) - swing * 6 + ex * 32;
  const ry = -6 * pin * (1 - sw) + swing * 26 + Math.sin(t * .5 + .4) * 2 * (1 - sw);
  $("phone").style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${(-1.5 * pin + kick * .8) * (1 - sw) + ex * 6}deg)`;
  $("phone").style.boxShadow = `inset 0 0 0 3px rgba(255,255,255,.6), inset 0 0 0 8px rgba(0,0,0,.08), 0 90px 180px rgba(0,8,40,.6), 0 0 160px rgba(17,183,242,.25)`;
  $("phone").style.filter = `blur(${(1 - seg(t, T.phoneIn[0], T.phoneIn[0] + .35)) * 8}px)`;
  $("rig").style.visibility = t < T.phoneIn[0] || ex >= 1 ? "hidden" : "visible";
  $("glare").style.backgroundPosition = `${lerp(110, -10, seg(t, T.phoneIn[0], T.phoneIn[1] + 1)) + lerp(0, 120, seg(t, T.swing[0], T.swing[1] + .4))}% 0`;

  // ── 3. bars fill one after another, each name slams in above the phone ──
  BARS.forEach((b, i) => {
    const a = T.bars[i], k = outExpo(seg(t, a, a + .55));
    const frac = (b.end - BAR_X) / BAR_W;
    // reveal the app's own bar; the clip edge leaves no gap once full
    b.fill.style.clipPath = `inset(0 ${(1 - (k < 1 ? k * (frac * BAR_W + 8) / (BAR_W + 16) : 1)) * 100}% 0 0)`;
    const land = seg(t, a + .25, a + .9);
    b.fill.style.filter = land > 0 && land < 1 ? `drop-shadow(0 0 ${14 * (1 - land)}px ${b.col}) brightness(${1 + .25 * (1 - land)})` : "none";
    burst(b.end, b.y, seg(t, a + .28, a + .95), b.col, .55);

    // the word: letters rise out of a mask, staggered; leaves up when the next one comes
    const nxt = i < 2 ? T.bars[i + 1] - .12 : T.pill - .1;
    const w = b.word, inW = a - .2;
    w.style.top = SAFE_TOP + 15 + "px";
    w.style.visibility = t < inW || t > nxt + .3 ? "hidden" : "visible";
    const out = inOut(seg(t, nxt, nxt + .28));
    w.style.transform = `translateY(${-out * 140}px) scale(${1 - out * .1})`;
    w.style.opacity = 1 - out;
    w.style.filter = `blur(${out * 12}px)`;
    [...w.querySelector(".w").children].forEach((s, j) => {
      const q = outBack(seg(t, inW + j * .035, inW + j * .035 + .45), 1.4);
      s.style.transform = `translateY(${(1 - q) * 110}%) rotate(${(1 - q) * 8}deg)`;
      s.style.opacity = clamp(q * 2);
    });
    w.querySelector(".bar > i").style.width = k * frac * 100 + "%";
    w.querySelector(".bar > i").style.boxShadow = `0 0 ${34 * (1 - land) + 10}px ${b.col}`;
    const sub = w.querySelector(".sub");
    if (sub) { const q = outExpo(seg(t, a + .45, a + 1)); sub.style.opacity = q; sub.style.transform = `translateY(${(1 - q) * 30}px)`; }
  });

  // ── 4. the rating pill punches in last, then the phone swings at the camera ──
  const pk = seg(t, T.pill, T.pill + .5);
  pill.style.visibility = t < T.pill ? "hidden" : "visible";
  pill.style.transform = `scale(${t < T.pill ? 0 : outBack(pk, 2.6)})`;
  pill.style.filter = pk < 1 ? `drop-shadow(0 0 ${30 * (1 - pk)}px #24b161)` : "none";
  burst(PILL.x + PILL.w / 2, PILL.y + PILL.h / 2, seg(t, T.pill + .05, T.pill + .8), "#24b161", .9);

  // the why, under the big pill
  const sk = outBack(seg(t, T.sum, T.sum + .5), 1.3), so = inOut(seg(t, T.exit[0] - .2, T.exit[0] + .2));
  $("sum").style.top = 640 + "px";
  $("sum").style.opacity = clamp(seg(t, T.sum, T.sum + .2)) * (1 - so);
  $("sum").style.transform = `translateY(${(1 - sk) * 80 - so * 60}px) scale(${lerp(.8, 1, sk)})`;
  $("sum").style.visibility = t < T.sum ? "hidden" : "visible";
  [...$("sum").children].forEach((s, j) => {
    const q = outExpo(seg(t, T.sum + .1 + j * .07, T.sum + .6 + j * .07));
    s.style.display = "inline-block"; s.style.opacity = q; s.style.transform = `translateY(${(1 - q) * 40}px)`;
  });

  // ── 5. particles rise through the empty space; then the end card ──
  particles($("pt"), t, Math.max(.55 * seg(t, T.phoneIn[0], T.phoneIn[1]) * (1 - sw), seg(t, T.exit[0], T.exit[1])), { gain: 2.4 });

  const E = T.end;
  $("end").style.top = SAFE_TOP + 120 + "px";
  const lg = seg(t, E, E + .8);
  $("logo").style.transform = `scale(${lerp(.4, 1, outBack(lg))}) rotate(${(1 - outExpo(lg)) * -20}deg)`;
  $("logo").style.opacity = clamp(lg * 3);
  const pop = (el, a) => { const k = outExpo(seg(t, a, a + .8)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 60}px)`; el.style.filter = `blur(${(1 - k) * 8}px)`; };
  pop($("e1"), E + .2); pop($("btn"), E + .5); pop($("e3"), E + .85);
  const glow = 30 + 10 * Math.sin(t * 2.6);
  $("btn").style.boxShadow = `0 0 ${glow}px rgba(17,183,242,.65), 0 0 ${glow * 2.4}px rgba(17,183,242,.28)`;
  $("end").style.visibility = t < E ? "hidden" : "visible";

  $("fx").innerHTML = fx;
  await document.fonts.ready;
  const v = $("v"); await loaded(v);
  // the whole film from one take: start at 6.25 s, or earlier / slower if the clip is short
  const D = v.duration - .1, rate = Math.min(1, D / T.dur);
  await seekVideo(v, Math.min(6.25, D - T.dur * rate) + t * rate);
}
window.__film = { seek, duration: T.dur };
</script>
