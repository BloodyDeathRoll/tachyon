<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #01061a; }
body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#world { position: absolute; inset: 0; }
#clip { position: absolute; inset: 0; overflow: hidden; }
video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
#tint, #shade, #vig { position: absolute; inset: 0; }
#tint { background: linear-gradient(180deg, #032afa 0%, #0a1f8f 50%, #01061a 100%); mix-blend-mode: multiply; }
#vig { background: radial-gradient(120% 80% at 50% 45%, rgba(1,6,26,0) 40%, rgba(1,6,26,.85) 100%); }
#pt { position: absolute; left: 0; top: 646px; mix-blend-mode: screen; pointer-events: none; }
#hk { position: absolute; left: 0; top: 0; pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; pointer-events: none; opacity: 0; }
#fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

#stage { position: absolute; inset: 0; perspective: 4200px; perspective-origin: 50% 40%; }
#rig { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform-style: preserve-3d; }
#phone { position: relative; padding: 34px; border-radius: 160px; transform-style: preserve-3d; transform-origin: 50% 50%;
  background: linear-gradient(150deg, #3a3f4b, #14171e 38%, #2b303a 70%, #0d0f14); }
#screen { position: relative; width: 1170px; height: 2532px; overflow: hidden; border-radius: 126px; background: #000; }
.scr { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; background-size: 1170px 2532px; }
.dim { position: absolute; inset: 0; background: #000; }
#glare { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.07) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; }
#thumb { position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,.28) 55%, rgba(255,255,255,.1) 70%);
  border: 5px solid rgba(255,255,255,.75); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
#rip { position: absolute; left: 0; top: 0; border-radius: 50%; border: 10px solid #11b7f2; }

.word { position: absolute; white-space: nowrap; transform-origin: 0 50%; }
.word .bar { position: absolute; inset: 0; background: #032afa; border-radius: 26px; transform-origin: 0 50%;
  box-shadow: 0 0 60px rgba(17,183,242,.55), 0 24px 60px rgba(0,0,0,.5); }
.word .msk { position: relative; overflow: hidden; padding: 4px 46px 18px; }
.word .txt { display: block; font-size: 150px; font-weight: 900; letter-spacing: -0.05em; line-height: 1.02; }
.word .ln { position: absolute; left: 46px; right: 46px; bottom: 16px; height: 12px; border-radius: 6px; background: #11b7f2; transform-origin: 0 50%; }

#end { position: absolute; left: 65px; width: 950px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.h { font-weight: 850; letter-spacing: -0.05em; line-height: .98; }
#btn { margin-top: 120px; padding: 32px 88px; border-radius: 999px; background: #11b7f2; color: #fff; font-weight: 800; font-size: 58px; letter-spacing: -0.01em; }
</style></head>
<body>
<div id="world">
  <div id="clip">
    <video id="v" src="1306-145340152_medium.mp4" muted playsinline preload="auto"></video>
    <div id="tint"></div>
    <div id="shade"></div>
    <div id="vig"></div>
  </div>
  <canvas id="pt" width="1080" height="1274"></canvas>

  <div id="stage"><div id="rig"><div id="phone">
    <div id="screen">
      <div class="scr" id="s0" style="background-image:url(home-clean.png)"><div class="dim"></div></div>
      <div class="scr" id="s1" style="background-image:url(search.png)"><div class="dim"></div></div>
      <div class="scr" id="s2" style="background-image:url(spot-uluwatu.png)"><div class="dim"></div></div>
      <div id="rip"></div>
      <div id="thumb"></div>
      <div id="glare"></div>
    </div>
  </div></div></div>

  <div class="word" id="w0"><div class="bar"></div><div class="msk"><span class="txt">Search.</span><div class="ln"></div></div></div>
  <div class="word" id="w1"><div class="bar"></div><div class="msk"><span class="txt">Tap.</span><div class="ln"></div></div></div>
  <div class="word" id="w2"><div class="bar"></div><div class="msk"><span class="txt">Forecast.</span><div class="ln"></div></div></div>
  <div class="word" id="w3"><div class="bar"></div><div class="msk"><span class="txt">No sign-up.</span><div class="ln"></div></div></div>

  <canvas id="hk" width="1080" height="1920"></canvas>
  <svg id="fx" viewBox="0 0 1080 1920"></svg>

  <div id="end">
    <img id="logo" src="rosa-icon.svg" style="width:210px; height:210px">
    <div id="e1" class="h" style="font-size:104px; margin-top:60px">No paywall, ever.</div>
    <div id="btn">Install it</div>
    <div id="e3" style="font-size:52px; font-weight:600; margin-top:50px; color:#fff">link in bio</div>
  </div>
</div>
<div id="flash"></div>

<script>
const variant = new URLSearchParams(location.search).get("variant") === "story" ? "story" : "reel";
const SAFE_TOP = variant === "story" ? 269 : 285, SAFE_BOT = 1248;
const $ = (id) => document.getElementById(id);

// ── easing ──
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
const smooth = (x) => x * x * (3 - 2 * x);
const outExpo = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inCubic = (x) => x * x * x;
const outBack = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1e6) / 1e6; };
const bump = (t, a, d) => { const k = seg(t, a, a + d); return k > 0 && k < 1 ? Math.sin(Math.PI * k) * (1 - k) : 0; };

// ── timeline (s) ──
const T = {
  slam: [.12, .78], shatter: [1.95, .6], rise: [2.3, 3.35],
  tapSearch: 4.25, push1: [4.4, 4.9], tapSpot: 5.75, push2: [5.95, 6.45],
  pull: [8.5, 9.3], collapse: [10.75, 11.45], end: 11.35, dur: 16.5,
};

// ── the hook: "No paywall." / "No account." set on a canvas so the words can turn into particles ──
const LINES = ["No paywall.", "No account."];
let HOOK = null;
function layoutHook() {
  const c = document.createElement("canvas").getContext("2d");
  c.font = "900 100px Inter"; c.letterSpacing = "-5px";
  const fs = Math.floor(100 * 950 / Math.max(...LINES.map((l) => c.measureText(l).width)));
  const y1 = SAFE_TOP + 330, gap = fs * 1.1;
  const lines = LINES.map((s, i) => ({ s, x: 65, y: y1 + i * gap }));
  // sample the ink into specks, 4 px apart
  const off = document.createElement("canvas"); off.width = 1080; off.height = 1920;
  const o = off.getContext("2d");
  o.font = `900 ${fs}px Inter`; o.letterSpacing = `${-fs * .05}px`; o.fillStyle = "#fff";
  lines.forEach((l) => o.fillText(l.s, l.x, l.y));
  const top = SAFE_TOP + 330 - fs, h = fs * 2.3;
  const d = o.getImageData(0, top, 1080, h).data, pts = [];
  for (let y = 0; y < h; y += 4) for (let x = 0; x < 1080; x += 4) {
    if (d[(y * 1080 + x) * 4 + 3] > 128) {
      const i = pts.length, r = (k) => hash(k + i);
      pts.push({ x, y: y + top, rel: T.shatter[0] + T.shatter[1] * (x / 1080) + r("j") * .1, life: 1.2 + r("l") * 1.1,
        vx: (r("vx") - .5) * 260, vy: 60 + r("vy") * 260, acc: 180 + r("a") * 520, wa: 6 + r("wa") * 26, ws: 2 + r("ws") * 5, ph: r("p") * 6.28,
        size: 1.6 + Math.pow(r("s"), 2) * 4.4, col: r("c") < .5 ? [125, 185, 240] : [94, 205, 205], glow: r("g") < .12 });
    }
  }
  HOOK = { fs, lines, pts };
}

function drawHook(t) {
  const cv = $("hk"), c = cv.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 1080, 1920);
  if (t > T.shatter[0] + T.shatter[1] + 2.6) return;
  const { fs, lines, pts } = HOOK;
  // camera shake on each impact
  const sh = 26 * (bump(t, T.slam[0] + .2, .45) + bump(t, T.slam[1] + .2, .45));
  const sx = sh * Math.sin(t * 91), sy = sh * Math.cos(t * 73);
  const sweepX = (t - T.shatter[0] - .1) / T.shatter[1] * 1080;   // left of it every speck has left
  c.font = `900 ${fs}px Inter`; c.letterSpacing = `${-fs * .05}px`;
  lines.forEach((l, i) => {
    const k = seg(t, T.slam[i], T.slam[i] + .22);
    if (k <= 0) return;
    const e = outExpo(k), s = lerp(2.8, 1, e);
    const w = 950, cx = l.x + w / 2, cy = l.y - fs * .36;
    // blue echo ring of the word, thrown outward on impact
    const ek = seg(t, T.slam[i] + .18, T.slam[i] + .75);
    c.save();
    c.beginPath(); c.rect(t > T.shatter[0] ? sweepX : -2000, 0, 5000, 1920); c.clip();
    if (ek > 0 && ek < 1) {
      const es = 1 + .22 * outCubic(ek);
      c.setTransform(es, 0, 0, es, cx - cx * es + sx, cy - cy * es + sy);
      c.globalAlpha = .7 * (1 - ek); c.strokeStyle = "#11b7f2"; c.lineWidth = 4;
      c.strokeText(l.s, l.x, l.y);
    }
    c.setTransform(s, 0, 0, s, cx - cx * s + sx, cy - cy * s + sy);
    c.globalAlpha = clamp(k * 4);
    c.filter = k < 1 ? `blur(${(1 - e) * 14}px)` : "none";
    c.shadowColor = "rgba(0,0,0,.55)"; c.shadowBlur = 40; c.shadowOffsetY = 12;
    c.fillStyle = "#fff"; c.fillText(l.s, l.x, l.y);
    c.restore();
  });
  // shatter: each speck leaves its glyph at rel and rises like the app's loading specks, fading as it climbs
  c.setTransform(1, 0, 0, 1, sx, sy);
  c.globalCompositeOperation = "lighter";
  for (const p of pts) {
    const a = t - p.rel;
    if (a < 0 || a > p.life) continue;
    const u = a / p.life, cm = smooth(clamp(a / .4));
    const x = p.x + p.vx * outCubic(clamp(a / 1.2)) + p.wa * Math.sin(p.ph + p.ws * a) * cm;
    const y = p.y - p.vy * a - .5 * p.acc * a * a;
    const sz = lerp(4, p.size, cm);
    const al = Math.pow(1 - u, 1.3) * (.8 + .2 * Math.sin(p.ph + a * 9));
    const r = lerp(255, p.col[0], cm), g = lerp(255, p.col[1], cm), b = lerp(255, p.col[2], cm);
    c.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${al})`;
    if (cm < .3) c.fillRect(x - sz / 2, y - sz / 2, sz, sz);
    else { c.beginPath(); c.arc(x, y, sz / 2, 0, 6.283); c.fill(); }
    if (p.glow && cm > .3) {
      c.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${al * .18})`;
      c.beginPath(); c.arc(x, y, sz * 2.4, 0, 6.283); c.fill();
    }
  }
  c.globalCompositeOperation = "source-over";
}

// ── Rosa particles: the app's splash field (rosa/web particles.ts + splash: palette, density 1.4,
// speed 1, alpha .3, 460 css px band) made a pure function of t ──
const BW = 390, BH = 460;
const NP = Math.round(BW * BH / 11000 * 1.4);
const PAL = ["125, 185, 240", "94, 205, 205"];
const SLOTS = Array.from({ length: NP }, (_, i) => ({ life: 4 * (0.8 + hash("l" + i) * 0.4), off: hash("o" + i) * 4 }));
function particles(cv, t, o, { glow = true, gain = 1 } = {}) {
  const c = cv.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  cv.style.opacity = o;
  if (o <= 0) return;
  const CSS = cv.width / BW;
  c.setTransform(CSS, 0, 0, CSS, 0, 0);
  if (glow) {
    let g = c.createRadialGradient(BW * .18, BH * 1.3, 0, BW * .18, BH * 1.3, BH * 1.0);
    g.addColorStop(0, "rgba(22,51,122,.55)"); g.addColorStop(.72, "rgba(22,51,122,0)");
    c.fillStyle = g; c.fillRect(0, 0, BW, BH);
    g = c.createRadialGradient(BW * .82, BH * 1.2, 0, BW * .82, BH * 1.2, BH * .9);
    g.addColorStop(0, "rgba(13,148,136,.4)"); g.addColorStop(.7, "rgba(13,148,136,0)");
    c.fillStyle = g; c.fillRect(0, 0, BW, BH);
  }
  const ps = [];
  SLOTS.forEach(({ life, off }, i) => {
    const k = Math.floor((t + off) / life), age = t + off - k * life, f = age * 60;
    const r = (s) => hash(s + i + "-" + k);
    const depth = Math.pow(r("d"), 0.85), rad = 0.5 + depth * (3.2 - 0.5), blur = (1 - depth) * 4.5;
    const vy = -(0.24 + depth * 1.4), vx = (r("v") - 0.5) * (0.05 + depth * 0.28);
    const ph = r("p") * 6.283, ws = 0.004 + r("w") * 0.012, wa = 0.05 + depth * 0.4;
    const x = r("x") * BW + vx * f + (wa / ws) * (Math.cos(ph) - Math.cos(ph + ws * f));
    const y = BH + r("y") * 30 + vy * f;
    const tw = r("t") * 6.283 + (0.008 + r("s") * 0.025) * f;
    const lf = age / life, env = lf < .15 ? lf / .15 : lf > .7 ? (1 - lf) / .3 : 1;
    const a = clamp((0.22 + depth * 0.7) * 0.3 * gain * Math.min(1, (BH - y) / 80) * Math.min(1, y / (BH * .55)) * (0.75 + Math.sin(tw) * .25) * env);
    if (a > 0.002 && y > -10) ps.push({ x, y, rad, depth, bucket: Math.round(blur), a, col: PAL[Math.floor(r("c") * PAL.length)] });
  });
  ps.sort((p, q) => p.depth - q.depth);
  const dot = (p, rad, blur, a) => {
    c.filter = blur ? `blur(${blur / 2 * CSS}px)` : "none";
    c.globalAlpha = a; c.fillStyle = `rgb(${p.col})`;
    c.beginPath(); c.arc(p.x, p.y, rad, 0, 6.283); c.fill();
  };
  for (const p of ps) if (p.bucket === 0 && p.rad > 1.4) dot(p, p.rad * 2.6, 8, p.a * .55);
  for (const p of ps) dot(p, p.rad, p.bucket, p.a);
  c.filter = "none"; c.globalAlpha = 1;
}

// ── footage: seek and wait for the frame ──
function seekVideo(v, s) {
  const d = v.duration || 30;
  s = s % (d - 0.1);
  if (v.readyState >= 2 && Math.abs(v.currentTime - s) < 1e-3) return Promise.resolve();
  return new Promise((res) => {
    const done = () => { v.removeEventListener("seeked", done); res(); };
    v.addEventListener("seeked", done);
    v.currentTime = s;
  });
}
const loaded = (v) => v.readyState >= 1 ? Promise.resolve() : new Promise((r) => v.addEventListener("loadedmetadata", r, { once: true }));

// ── the phone: 1242 x 2604 at scale S; poses are its centre (x, y), scale and 3D angles ──
const PW = 1242, PH = 2604, S = .56;
const POSES = [                     // [t, cx, cy, scale, rx, ry, rz]
  [3.35, 540, 1010, 1, 6, -10, -2],
  [4.0, 610, 1040, 1, 4, -14, -1],   // leans right: "Search." lands on the left
  [5.2, 480, 1060, 1, 4, 14, 2],     // leans left: "Tap." lands on the right
  [6.5, 560, 1100, 1.06, 10, -8, -1],
  [8.4, 600, 1140, 1.12, 14, -16, -3],
  [9.3, 400, 1200, .86, 6, 26, 4],   // pulls back and down: "No sign-up." lands over it
  [10.7, 420, 1180, .88, 4, 30, 5],
];
function pose(t) {
  if (t <= POSES[0][0]) return POSES[0].slice(1);
  for (let i = 0; i < POSES.length - 1; i++) {
    const a = POSES[i], b = POSES[i + 1];
    if (t <= b[0]) { const k = inOut(seg(t, a[0], b[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); }
  }
  return POSES[POSES.length - 1].slice(1);
}

// ── the thumb, in capture px: rests off-screen, glides to a target and taps ──
const SEARCH_BTN = [1086, 79], ULU_ROW = [330, 780];
function thumb(t) {
  const keys = [[3.5, 1300, 1900], [4.15, ...SEARCH_BTN], [4.6, ...SEARCH_BTN], [5.1, 700, 1250], [5.65, ...ULU_ROW], [6.05, ...ULU_ROW], [6.7, 900, 2900]];
  if (t < keys[0][0] || t > keys[keys.length - 1][0]) return null;
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) {
      const k = inOut(seg(t, a[0], b[0]));
      const arc = Math.sin(Math.PI * k) * (a[1] === b[1] ? 0 : 140);
      return [lerp(a[1], b[1], k) + arc * .4, lerp(a[2], b[2], k) - arc];
    }
  }
}

// ── step words: a deep-blue bar wipes in, the word rises through it, both clear ──
const WORDS = [
  { id: "w0", at: 4.18, out: 5.25, x: 65, y: () => SAFE_TOP + 1000, rot: -4 },   // below the results: the search bar stays visible
  { id: "w1", at: 5.7, out: 6.75, x: 1015, y: () => SAFE_TOP + 420, rot: 3, right: true },
  { id: "w2", at: 6.5, out: 8.35, x: 65, y: () => SAFE_TOP + 765, rot: -3 },
  { id: "w3", at: 9.0, out: 10.65, x: 1015, y: () => SAFE_TOP + 40, rot: -2, right: true },
];
function word(t, w) {
  const el = $(w.id), bar = el.querySelector(".bar"), txt = el.querySelector(".txt"), ln = el.querySelector(".ln");
  const vis = t >= w.at && t < w.out + .4;
  el.style.visibility = vis ? "visible" : "hidden";
  if (!vis) return;
  const ib = outExpo(seg(t, w.at, w.at + .28)), it = outBack(seg(t, w.at + .06, w.at + .4), 1.4);
  const ob = inCubic(seg(t, w.out + .08, w.out + .36)), ot = inCubic(seg(t, w.out, w.out + .22));
  const kick = bump(t, w.at + .05, .5);
  const W = el.offsetWidth;
  el.style.left = (w.right ? w.x - W : w.x) + "px";
  el.style.top = w.y() + "px";
  el.style.transformOrigin = w.right ? "100% 50%" : "0 50%";
  el.style.transform = `rotate(${w.rot * (1 - .4 * ib)}deg) scale(${1 + .12 * kick})`;
  bar.style.transformOrigin = (ob > 0) !== !!w.right ? "100% 50%" : "0 50%";
  bar.style.transform = `scaleX(${ib * (1 - ob)})`;
  txt.style.transform = `translateY(${(1 - it) * 110 - ot * 110}%)`;
  ln.style.transform = `scaleX(${outExpo(seg(t, w.at + .2, w.at + .6)) * (1 - ot)})`;
  ln.style.transformOrigin = w.right ? "100% 50%" : "0 50%";
}

let ready = null;
async function seek(t) {
  if (!ready) ready = document.fonts.load("900 100px Inter").then(() => document.fonts.ready).then(layoutHook);
  await ready;
  let fx = "";

  // ── 1. the dark ocean: full screen for the hook, then pushed back, blurred and tinted under the phone ──
  const rk = seg(t, T.rise[0], T.rise[1]);
  const col = seg(t, T.collapse[0], T.collapse[1]);
  const punch = .05 * (bump(t, T.slam[0] + .18, .5) + bump(t, T.slam[1] + .18, .5));
  $("v").style.transform = `scale(${lerp(1.22, 1.06, sine(seg(t, 0, T.rise[1]))) + .06 * sine(seg(t, T.rise[1], T.dur)) + punch})`;
  $("v").style.filter = `blur(${lerp(0, 6, smooth(rk))}px) brightness(${lerp(.8, .62, rk)}) saturate(1.1)`;
  $("tint").style.opacity = .35 + .4 * smooth(rk);
  $("shade").style.background = `linear-gradient(180deg, rgba(1,6,26,.55) 0%, rgba(1,6,26,.15) 35%, rgba(1,6,26,.25) 60%, rgba(1,6,26,${.7 + .2 * rk}) 100%)`;
  $("flash").style.opacity = .5 * Math.pow(1 - seg(t, T.slam[0] + .18, T.slam[0] + .45), 3) * (t > T.slam[0] + .18 ? 1 : 0)
    + .35 * Math.pow(1 - seg(t, T.slam[1] + .18, T.slam[1] + .45), 3) * (t > T.slam[1] + .18 ? 1 : 0);

  // ── 2. hook slams, then shatters into rising specks ──
  drawHook(t);

  // ── 3. the phone rises from below, big, and moves through the flow in 3D ──
  let [cx, cy, sc, rx, ry, rz] = pose(t);
  const rise = outBack(rk, 1.1);
  cy = lerp(cy + 1700, cy, rise); rx += lerp(48, 0, outCubic(rk)); rz += lerp(-12, 0, outCubic(rk));
  // taps nudge the phone
  const tapK = bump(t, T.tapSearch, .35) + bump(t, T.tapSpot, .35);
  sc *= 1 - .015 * tapK;
  // collapse into the logo
  const ce = inOut(col);
  const LOGO = [540, SAFE_TOP + 110 + 105];
  cx = lerp(cx, LOGO[0], ce); cy = lerp(cy, LOGO[1], ce); sc = lerp(sc, .1, ce); ry += 260 * ce; rz += 20 * ce;
  const s = S * sc;
  $("rig").style.transform = `translate(${cx - PW * s / 2}px, ${cy - PH * s / 2}px) scale(${s})`;
  $("phone").style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  $("phone").style.boxShadow = `inset 0 0 0 4px rgba(255,255,255,.22), inset 0 0 0 10px rgba(0,0,0,.4), 0 100px 200px rgba(0,4,30,.75), 0 0 220px rgba(17,183,242,${.22 + .2 * tapK})`;
  $("phone").style.filter = rk < 1 ? `blur(${(1 - smooth(rk)) * 8}px)` : col > 0 ? `blur(${col * 10}px)` : "none";
  $("phone").style.opacity = 1 - seg(t, T.collapse[1] - .2, T.collapse[1]);
  $("stage").style.display = t < T.rise[0] || col >= 1 ? "none" : "block";
  $("glare").style.backgroundPosition = `${lerp(110, -10, seg(t, T.rise[0], T.collapse[1]))}% 0`;

  // screens: iOS-style push, the old screen slides a third over and dims
  const p1 = inOut(seg(t, ...T.push1)), p2 = inOut(seg(t, ...T.push2));
  const place = (id, x, dim) => { const e = $(id); e.style.transform = `translateX(${x}px)`; e.querySelector(".dim").style.opacity = dim; e.style.visibility = x > -1170 && x < 1170 ? "visible" : "hidden"; };
  place("s0", -390 * p1, .5 * p1);
  place("s1", 1170 * (1 - p1) - 390 * p2, .5 * p2);
  place("s2", 1170 * (1 - p2), 0);
  $("s1").style.boxShadow = $("s2").style.boxShadow = "-30px 0 60px rgba(0,0,0,.6)";

  // thumb + tap ripple
  const th = thumb(t), tm = $("thumb");
  tm.style.visibility = th ? "visible" : "hidden";
  if (th) {
    const press = Math.max(Math.sin(Math.PI * seg(t, T.tapSearch - .08, T.tapSearch + .14)), Math.sin(Math.PI * seg(t, T.tapSpot - .08, T.tapSpot + .14)));
    tm.style.transform = `translate(${th[0]}px, ${th[1]}px) scale(${1 - .22 * press})`;
    tm.style.opacity = Math.min(seg(t, 3.5, 3.75), 1 - seg(t, 6.4, 6.7));
  }
  const rp = $("rip");
  const rt = t >= T.tapSpot ? T.tapSpot : T.tapSearch, rpt = rt === T.tapSpot ? ULU_ROW : SEARCH_BTN;
  const rq = seg(t, rt, rt + .5);
  rp.style.visibility = rq > 0 && rq < 1 ? "visible" : "hidden";
  const R = 40 + 200 * outExpo(rq);
  Object.assign(rp.style, { left: rpt[0] - R + "px", top: rpt[1] - R + "px", width: 2 * R + "px", height: 2 * R + "px", opacity: 1 - rq, borderWidth: 14 * (1 - rq) + 2 + "px" });

  // ── 4. step words ──
  WORDS.forEach((w) => word(t, w));

  // ── 5. Rosa particles along the bottom the whole way, stronger behind the end card ──
  particles($("pt"), t, Math.max(.75 * seg(t, T.rise[0], T.rise[1]), seg(t, T.collapse[0], T.collapse[1])), { gain: 3.4 });

  // ── 6. end card: the phone folds into the logo ──
  const E = T.end;
  $("end").style.top = SAFE_TOP + 110 + "px";
  const lg = seg(t, E, E + .8);
  $("logo").style.transform = `scale(${lerp(.2, 1, outBack(lg, 2))}) rotate(${(1 - outExpo(lg)) * -40}deg)`;
  $("logo").style.opacity = clamp(lg * 3);
  const pop = (el, a) => { const k = outExpo(seg(t, a, a + .8)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 70}px)`; el.style.filter = `blur(${(1 - k) * 10}px)`; };
  pop($("e1"), E + .25); pop($("btn"), E + .7); pop($("e3"), E + .9);
  const glow = 34 + 12 * Math.sin(t * 2.6);
  $("btn").style.boxShadow = `0 0 ${glow}px rgba(17,183,242,.75), 0 0 ${glow * 2.4}px rgba(17,183,242,.35)`;
  $("end").style.visibility = t < E ? "hidden" : "visible";
  if (lg > 0 && lg < 1) {
    const e = outExpo(lg);
    fx += `<circle cx="540" cy="${LOGO[1]}" r="${80 + 520 * e}" fill="none" stroke="#11b7f2" stroke-width="${16 * (1 - lg)}" opacity="${1 - lg}"/>`;
    fx += `<circle cx="540" cy="${LOGO[1]}" r="${60 + 360 * e}" fill="none" stroke="#fff" stroke-width="${6 * (1 - lg)}" opacity="${.8 * (1 - lg)}"/>`;
  }
  $("fx").innerHTML = fx;

  const v = $("v"); await loaded(v);
  await seekVideo(v, .2 + t * .9);
}
window.__film = { seek, duration: T.dur };
</script>
